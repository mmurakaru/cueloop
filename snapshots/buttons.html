<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button — states</title>
    <style>
      :root {
        --ink: #1c1d24;
        --soft: #5b6172;
        --line: #e6e6ec;
        --accent: #5b3ea6;
        --danger: #c0392b;
        --bg: #f2f2f7;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 48px;
      }
      /* card + grid are intentionally class-less below so cueloop's element
         resolver anchors a click on the <button>, not a named container. */
      .col { font-size: 15px; color: var(--soft); text-transform: uppercase; letter-spacing: 0.08em; }
      .rowlabel { font-size: 23px; color: var(--ink); font-weight: 600; }
      button {
        font: inherit;
        font-size: 22px;
        font-weight: 600;
        padding: 22px 34px;
        border-radius: 18px;
        border: 2px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        justify-content: center;
        width: 100%;
      }
      .primary { background: var(--accent); color: #fff; }
      .secondary { background: #ece6f8; color: var(--accent); }
      .outline { background: transparent; color: var(--ink); border-color: var(--line); }
      .danger { background: var(--danger); color: #fff; }
      .is-hover.primary { background: #4a2f8c; box-shadow: 0 8px 20px -8px rgba(91, 62, 166, 0.6); }
      .is-hover.secondary { background: #e0d5f4; }
      .is-hover.outline { border-color: var(--accent); color: var(--accent); }
      .is-hover.danger { background: #a63024; box-shadow: 0 8px 20px -8px rgba(192, 57, 43, 0.55); }
      .spinner {
        width: 17px; height: 17px; border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.5); border-top-color: #fff;
      }
      .outline .spinner { border-color: rgba(91, 62, 166, 0.3); border-top-color: var(--accent); }
    </style>
  </head>
  <body>
    <div style="background:#fff;border:1px solid var(--line);border-radius:28px;padding:64px 76px 72px;box-shadow:0 30px 70px -34px rgba(20,18,30,0.38);width:100%;">
      <div style="font-size:42px;font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;">Button</div>
      <div style="margin:0 0 60px;color:var(--soft);font-size:21px;">Four variants across default, hover, and loading states.</div>
      <div style="display:grid;grid-template-columns:200px repeat(3,1fr);gap:50px 42px;align-items:center;">
        <div class="col"></div>
        <div class="col">Default</div>
        <div class="col">Hover</div>
        <div class="col">Loading</div>

        <div class="rowlabel">Primary</div>
        <button class="primary">Save changes</button>
        <button class="primary is-hover">Save changes</button>
        <button class="primary"><span class="spinner"></span>Saving…</button>

        <div class="rowlabel">Secondary</div>
        <button class="secondary">Preview</button>
        <button class="secondary is-hover">Preview</button>
        <button class="secondary"><span class="spinner"></span>Loading</button>

        <div class="rowlabel">Outline</div>
        <button class="outline">Cancel</button>
        <button class="outline is-hover">Cancel</button>
        <button class="outline"><span class="spinner"></span>Working</button>

        <div class="rowlabel">Danger</div>
        <button class="danger">Delete</button>
        <button class="danger is-hover">Delete</button>
        <button class="danger"><span class="spinner"></span>Deleting…</button>
      </div>
    </div>
  </body>
</html>
