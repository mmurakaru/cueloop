<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button — states</title>
    <style>
      :root {
        --ink: #1c1d24;
        --soft: #5b6172;
        --line: #e5e6ec;
        --accent: #5b3ea6;
        --accent-ink: #ffffff;
        --danger: #c0392b;
        --bg: #f4f4f8;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 40px 46px;
        display: flex;
        flex-direction: column;
      }
      .head { margin-bottom: 26px; }
      .head h1 { font-size: 26px; margin: 0 0 5px; letter-spacing: -0.01em; }
      .head p { margin: 0; color: var(--soft); font-size: 15px; }
      .cols {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 26px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 26px 30px;
        box-shadow: 0 1px 2px rgba(20, 18, 30, 0.05);
        display: flex;
        flex-direction: column;
      }
      .card h2 {
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em;
        color: var(--soft); margin: 0 0 22px; font-weight: 600;
      }
      .grid {
        flex: 1;
        display: grid;
        grid-template-columns: 90px repeat(3, 1fr);
        gap: 22px 20px;
        align-items: center;
        align-content: space-around;
      }
      .col { font-size: 11px; color: var(--soft); text-transform: uppercase; letter-spacing: 0.06em; }
      .rowlabel { font-size: 14px; color: var(--soft); font-weight: 500; }
      button {
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        padding: 12px 18px;
        border-radius: 11px;
        border: 1px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        justify-content: center;
        width: 100%;
      }
      .primary { background: var(--accent); color: var(--accent-ink); }
      .secondary { background: #ece6f8; color: var(--accent); }
      .outline { background: transparent; color: var(--ink); border-color: var(--line); }
      .ghost { background: transparent; color: var(--soft); }
      .danger { background: var(--danger); color: #fff; }
      .link { background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
      .is-hover.primary { background: #4b3090; }
      .is-hover.secondary { background: #e0d5f4; }
      .is-hover.outline { border-color: var(--accent); color: var(--accent); }
      .is-hover.danger { background: #a93125; }
      .is-hover.ghost { background: #eef0f4; color: var(--ink); }
      .is-disabled { opacity: 0.42; cursor: not-allowed; }
      .spinner {
        width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5); border-top-color: #fff;
      }
      .outline .spinner, .ghost .spinner, .link .spinner { border-color: rgba(91, 62, 166, 0.35); border-top-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>Button</h1>
      <p>Six variants across default, hover, and loading states.</p>
    </div>
    <div class="cols">
      <div class="card">
        <h2>Solid</h2>
        <div class="grid">
          <div class="col"></div>
          <div class="col">Default</div>
          <div class="col">Hover</div>
          <div class="col">Loading</div>

          <div class="rowlabel">Primary</div>
          <button class="primary">Save changes</button>
          <button class="primary is-hover">Save changes</button>
          <button class="primary"><span class="spinner"></span>Saving…</button>

          <div class="rowlabel">Secondary</div>
          <button class="secondary">Preview</button>
          <button class="secondary is-hover">Preview</button>
          <button class="secondary"><span class="spinner"></span>Loading</button>

          <div class="rowlabel">Danger</div>
          <button class="danger">Delete</button>
          <button class="danger is-hover">Delete</button>
          <button class="danger"><span class="spinner"></span>Deleting…</button>
        </div>
      </div>

      <div class="card">
        <h2>Quiet</h2>
        <div class="grid">
          <div class="col"></div>
          <div class="col">Default</div>
          <div class="col">Hover</div>
          <div class="col">Disabled</div>

          <div class="rowlabel">Outline</div>
          <button class="outline">Cancel</button>
          <button class="outline is-hover">Cancel</button>
          <button class="outline is-disabled">Cancel</button>

          <div class="rowlabel">Ghost</div>
          <button class="ghost">Dismiss</button>
          <button class="ghost is-hover">Dismiss</button>
          <button class="ghost is-disabled">Dismiss</button>

          <div class="rowlabel">Link</div>
          <button class="link">Learn more</button>
          <button class="link is-hover">Learn more</button>
          <button class="link is-disabled">Learn more</button>
        </div>
      </div>
    </div>
  </body>
</html>
