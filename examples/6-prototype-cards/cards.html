<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design system - pricing cards</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #1a1d27;
        --border: #2a2e3a;
        --text: #e6e6e6;
        --muted: #9aa0ac;
        --accent: #4c6ef5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 48px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 4px;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 32px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card.featured {
        border-color: var(--accent);
      }
      .tier {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0;
      }
      .price {
        font-size: 34px;
        font-weight: 700;
        margin: 0;
      }
      .price span {
        font-size: 15px;
        font-weight: 400;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: var(--muted);
      }
      button {
        margin-top: auto;
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 12px 16px;
        border-radius: 9px;
        font-size: 15px;
        cursor: pointer;
      }
      .card:not(.featured) button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <h1>Pricing</h1>
    <p class="lede">Three plans for teams of every size.</p>
    <div class="grid">
      <div class="card">
        <p class="tier">Starter</p>
        <p class="price">$0<span>/mo</span></p>
        <ul>
          <li>1 project</li>
          <li>Community support</li>
        </ul>
        <button>Get started</button>
      </div>
      <div class="card featured">
        <p class="tier">Pro</p>
        <p class="price">$24<span>/mo</span></p>
        <ul>
          <li>Unlimited projects</li>
          <li>Priority support</li>
          <li>Usage analytics</li>
        </ul>
        <button>Choose Pro</button>
      </div>
      <div class="card">
        <p class="tier">Enterprise</p>
        <p class="price">Custom</p>
        <ul>
          <li>SSO and audit logs</li>
          <li>Dedicated manager</li>
        </ul>
        <button>Contact sales</button>
      </div>
    </div>
  </body>
</html>
