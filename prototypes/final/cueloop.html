    if (cb) cb.addEventListener("click", () => { agent.connected = true; flash("agent connected · " + providerName(agent.provider)); renderAgent(); });
    return;
  }
  html += '<div class="ag-scroll" id="ag-scroll">';
  html += '<div class="ag-ctx">◆ inherited session context · ' + esc(providerName(agent.provider)) + ' · plan.md rev 2</div>';
  agent.messages.forEach(m => {
    html += '<div class="ag-msg ' + m.who + '"><div class="ag-who">' + (m.who === "user" ? "you" : "review agent") + '</div><div class="ag-bubble">' + agentBubble(m.text) + "</div></div>";
  });
  html += "</div>";
  html += '<div class="ag-input-dock"><textarea id="ag-input" rows="1" placeholder="Ask the review agent…"></textarea>'
    + '<div class="ag-input-foot"><span class="ag-via">via ' + esc(providerName(agent.provider)) + '</span><button class="ag-send" id="ag-send">Send</button></div></div>';
  host.innerHTML = html;
  const scroll = $("#ag-scroll");
  if (scroll) scroll.scrollTop = scroll.scrollHeight;
  const send = () => {
    const ta = $("#ag-input");
    if (!ta) return;
    const t = ta.value.trim();
    if (!t) return;
    agent.messages.push({ who: "user", text: t });
    agent.messages.push({ who: "agent", text: cannedReply() });
    renderAgent();
  };
  const sb = $("#ag-send");
  if (sb) sb.addEventListener("click", send);
  const ta = $("#ag-input");
  if (ta) ta.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
}

/* ═══════════ Sidebar render ═══════════ */

function statLabel(f) {
  if (f.kind === "ro") return '<span class="s-stat"><span class="roflag">ro</span></span>';
  if (f.kind === "plan") return '<span class="s-stat">' + versionBadgeText() + "</span>";
  if (f.status === "new") return '<span class="s-stat"><span class="newf">NEW</span></span>';
  const c = countDiff(f.lines);
  return '<span class="s-stat"><span class="plus">+' + c.add + '</span> <span class="minus">−' + c.del + "</span></span>";
}
function countDiff(lines) { let a = 0, d = 0; lines.forEach(l => { if (l.t === "add") a++; else if (l.t === "del") d++; }); return { add: a, del: d }; }

function activeItems() {
  if (state.tab === "status") {
    const items = [{ kind: "all", key: "__all__" }];
    statusChanged.forEach(id => items.push({ kind: "file", fileId: id, key: "file:" + id, group: "changed" }));
    statusUntracked.forEach(id => items.push({ kind: "file", fileId: id, key: "file:" + id, group: "untracked" }));
    return items;
  }
  if (state.tab === "tree") return visibleTreeNodes();
  if (state.tab === "versions") return [
    { kind: "version", v: "v2", key: "ver:v2" },
    { kind: "version", v: "v1", key: "ver:v1" },
  ];
  return [];
}

function renderSidebar() {
  const items = activeItems();
  if (state.sidebarCursor >= items.length) state.sidebarCursor = items.length - 1;
  if (state.sidebarCursor < 0) state.sidebarCursor = 0;
  const list = $("#side-list");
  let html = "";

  if (state.tab === "status") {
    items.forEach((it, i) => {
      const cur = i === state.sidebarCursor ? " cursor" : "";
      if (it.kind === "all") {
        const viewed = changedFileIds.filter(id => state.viewed["file:" + id]).length;
        html += '<div class="side-all' + (state.view === "all" ? " open" : "") + cur + '" data-idx="' + i + '">'
          + '<span class="sa-glyph">≡</span><div class="sa-main"><div class="sa-title">All changed files</div>'
          + '<div class="sa-sub">continuous scroll · ' + viewed + " / " + changedFileIds.length + " viewed</div></div></div>";
        return;
      }
      if (it.group === "changed" && (i === 0 || items[i - 1].group !== "changed")) html += '<div class="side-group"><span>CHANGED</span><span class="g-cnt">' + statusChanged.length + "</span></div>";
      if (it.group === "untracked" && items[i - 1].group !== "untracked") html += '<div class="side-group"><span>UNTRACKED</span><span class="g-cnt">' + statusUntracked.length + "</span></div>";
      const f = FILES[it.fileId];
      const badge = fileBadge(it.fileId);
      const open = (state.view === "file" && state.active === it.fileId) ? " open" : "";
      const viewedCls = state.viewed["file:" + it.fileId] ? " viewed" : "";
      html += '<div class="side-item indent' + cur + open + viewedCls + '" data-idx="' + i + '">'
        + '<span class="s-check" data-mark="' + i + '">✓</span>'
        + '<span class="s-name" title="' + esc(f.path) + '">' + esc(f.name) + "</span>"
        + statLabel(f)
        + (badge ? '<span class="s-badge">' + badge + "</span>" : "")
        + "</div>";
    });
  } else if (state.tab === "tree") {
    html += '<div class="tree-controls"><span class="tc-label">' + (state.treeShowAll ? "REPOSITORY" : "CHANGED FIRST") + "</span>"
      + '<span class="tree-toggle' + (state.treeShowAll ? " on" : "") + '" id="tree-showall">' + (state.treeShowAll ? "Changed only" : "Show all files") + "</span></div>";
    items.forEach((it, i) => {
      const cur = i === state.sidebarCursor ? " cursor" : "";
      const pad = 6 + it.depth * 15;
      if (it.kind === "folder") {
        const collapsed = !!state.treeCollapsed[it.path];
        html += '<div class="tree-row dir' + cur + '" data-idx="' + i + '" style="padding-left:' + pad + 'px">'
          + '<span class="tree-caret' + (collapsed ? " collapsed" : "") + '">▾</span>'
          + '<span class="tree-ic folder">▸</span>'
          + '<span class="tree-name">' + esc(it.name) + "</span></div>";
      } else {
        const f = FILES[it.fileId];
        const open = (state.view === "file" && state.active === it.fileId) ? " open" : "";
        const roCls = f.kind === "ro" ? " ro" : "";
        const viewedCls = state.viewed["file:" + it.fileId] ? " viewed" : "";
        html += '<div class="tree-row' + roCls + open + viewedCls + cur + '" data-idx="' + i + '" style="padding-left:' + pad + 'px">'
          + '<span class="tree-caret leaf">·</span>'
          + (f.changed ? '<span class="tree-check" data-mark="' + i + '">✓</span>' : '<span class="tree-ic">·</span>')
          + '<span class="tree-name" title="' + esc(f.path) + '">' + esc(f.name) + "</span>"
          + statLabel(f) + "</div>";
      }
    });
  } else if (state.tab === "versions") {
    const s = versionStats();
    html += '<div class="ver-lead">PLAN REVISIONS</div>';
    html += '<div class="ver-summary">'
      + '<div class="vs-row"><span class="vs-tag">v1 → v2</span><span>agent/worker-3 resubmitted the plan</span></div>'
      + '<div class="vs-row"><span class="vs-tag">passages</span><span><span class="amber">' + s.changed + " changed</span> · <span class=\"plus\">" + s.added + " added</span> · <span class=\"minus\">" + s.removed + " removed</span></span></div>"
      + "</div>";
    html += '<div class="ver-seg" id="ver-seg">'
      + '<button data-vdv="rendered" class="' + (state.versionDiffView === "rendered" ? "on" : "") + '">Rendered</button>'
      + '<button data-vdv="raw" class="' + (state.versionDiffView === "raw" ? "on" : "") + '">Raw diff</button></div>';
    items.forEach((it, i) => {
      const cur = i === state.sidebarCursor ? " cursor" : "";
      const on = state.planVersion === it.v ? " on" : "";
      const meta = it.v === "v2" ? "current · resubmitted 4m ago" : "initial submission";
      html += '<div class="ver-item' + on + cur + '" data-idx="' + i + '">'
        + '<span class="vi-dot"></span><div class="vi-main"><div class="vi-name">' + it.v + " · " + (it.v === "v2" ? "revised" : "initial") + "</div>"
        + '<div class="vi-sub">' + meta + "</div></div></div>";
    });
  }
  list.innerHTML = html;

  const viewedCount = changedFileIds.filter(id => state.viewed["file:" + id]).length;
  $("#p-tabname").textContent = "CHANGED FILES VIEWED";
  $("#p-count").textContent = viewedCount + " / " + changedFileIds.length;
  $("#pbar-fill").style.width = (viewedCount / changedFileIds.length * 100) + "%";

  list.querySelectorAll("[data-idx]").forEach(el => {
    el.addEventListener("click", e => {
      const i = +el.dataset.idx;
      state.sidebarCursor = i;
      if (e.target.closest("[data-mark]")) { toggleViewedItem(items[i]); return; }
      openItem(items[i]);
    });
  });
  const sa = $("#tree-showall");
  if (sa) sa.addEventListener("click", e => { e.stopPropagation(); state.treeShowAll = !state.treeShowAll; state.sidebarCursor = 0; renderSidebar(); });
  const vs = $("#ver-seg");
  if (vs) vs.querySelectorAll("[data-vdv]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); state.versionDiffView = b.dataset.vdv; renderAll(); }));

  const curEl = list.querySelector(".cursor");
  if (curEl) curEl.scrollIntoView({ block: "nearest" });
}

function fileBadge(fileId) {
  if (fileId === "plan") return state.annotations.filter(a => a.item === "plan").length + state.edits.length;
  return state.annotations.filter(a => a.item === fileId).length;
}

/* ═══════════ Tree builder ═══════════ */

function visibleTreeNodes() {
  const ids = state.treeShowAll ? allTreeIds : changedFileIds;
  const root = { name: "", path: "", dirs: {}, files: [] };
  ids.forEach(id => {
    const f = FILES[id];
    const parts = f.path.split("/");
    let node = root;
    for (let p = 0; p < parts.length - 1; p++) {
      const seg = parts[p];
      const dpath = node.path ? node.path + "/" + seg : seg;
      if (!node.dirs[seg]) node.dirs[seg] = { name: seg, path: dpath, dirs: {}, files: [] };
      node = node.dirs[seg];
    }
    node.files.push(id);
  });
  const out = [];
  const walk = (node, depth) => {
    const dirNames = Object.keys(node.dirs).sort();
    dirNames.forEach(dn => {
      const d = node.dirs[dn];
      out.push({ kind: "folder", name: dn, path: d.path, depth: depth, key: "dir:" + d.path });
      if (!state.treeCollapsed[d.path]) walk(d, depth + 1);
    });
    const files = node.files.slice().sort((a, b) => {
      const ca = FILES[a].changed ? 0 : 1, cb = FILES[b].changed ? 0 : 1;
      if (ca !== cb) return ca - cb;
      return FILES[a].name.localeCompare(FILES[b].name);
    });
    files.forEach(id => out.push({ kind: "tree-file", fileId: id, name: FILES[id].name, depth: depth, key: "file:" + id }));
  };
  walk(root, 0);
  return out;
}

/* ═══════════ Open / toggle ═══════════ */

function openItem(it) {
  state.focusZone = "content";
  if (it.kind === "all") { state.view = "all"; state.active = "__all__"; state.allCursor = 0; }
  else if (it.kind === "file" || it.kind === "tree-file") { openFile(it.fileId); }
  else if (it.kind === "folder") { state.treeCollapsed[it.path] = !state.treeCollapsed[it.path]; renderSidebar(); return; }
  else if (it.kind === "version") { state.planVersion = it.v; state.view = "versions"; state.active = "plan"; }
  syncView(); renderAll();
  scrollActiveIntoView(it);
}
function openFile(id) {
  state.view = "file";
  state.active = id;
  if (state.cursors[id] == null) state.cursors[id] = 0;
  state.selAnchor = null; setFocused(null);
  if (state.mode === "guided") state.guidedIndex = Math.max(0, changedFileIds.indexOf(id));
}
function scrollActiveIntoView(it) {
  if (state.view !== "file") return;
  const el = $("#content").querySelector('[data-row="0"]');
  if (el) el.scrollIntoView({ block: "start" });
}

function toggleViewedItem(it) {
  let id = null;
  if (it.kind === "all") { toggleViewedAllFiles(); return; }
  if (it.kind === "file" || it.kind === "tree-file") id = it.fileId;
  if (!id || !FILES[id].changed) { flash("Only changed files track a viewed state"); return; }
  const key = "file:" + id;
  state.viewed[key] = !state.viewed[key];
  flash(state.viewed[key] ? "marked viewed" : "marked not viewed");
  renderAll();
}
function toggleViewedAllFiles() {
  const allSeen = changedFileIds.every(id => state.viewed["file:" + id]);
  changedFileIds.forEach(id => state.viewed["file:" + id] = !allSeen);
  flash(allSeen ? "cleared all viewed" : "marked all viewed");
  renderAll();
}

function syncView() { $("#app").dataset.view = state.view; }

/* ═══════════ Center render dispatch ═══════════ */

function renderContent() {
  const inner = $("#content");
  if (state.mode === "split") { inner.innerHTML = splitBodyHTML(); updateCrumb(); return; }
  if (state.view === "versions") { inner.innerHTML = versionsBodyHTML(); wireVersions(); updateCrumb(); return; }
  if (state.view === "all") { inner.innerHTML = allFilesHTML(); wireAllFiles(); updateCrumb(); return; }
  const f = FILES[state.active];
  if (f.kind === "plan") inner.innerHTML = planBodyHTML(state.active, false);
  else if (f.kind === "ro") inner.innerHTML = roBodyHTML(f);
  else inner.innerHTML = diffBodyHTML(state.active, { cursor: true });
  wireRows(inner);

  const fc = $("#fc-btn");
  if (fc) fc.addEventListener("click", startFileComment);
  inner.querySelectorAll("[data-gap]").forEach(b => b.addEventListener("click", () => { state.expandedGaps[b.dataset.gap] = true; renderContent(); renderRail(); }));
  inner.querySelectorAll("[data-tbl]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); handleTableTool(b.dataset.tbl); }));

  injectInlineSuggestions(inner);

  const ta = $("#edit-input");
  if (ta) { ta.focus(); ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; ta.setSelectionRange(ta.value.length, ta.value.length); }
  const curEl = inner.querySelector(".row.cursor");
  if (curEl && !ta && !$("#suggest-input")) curEl.scrollIntoView({ block: "nearest" });
  updateCrumb();
  applyAnchorFocus();
}

function wireRows(scope) {
  scope.querySelectorAll("#content > * [data-row], #content [data-row]").forEach(el => {
    if (el.dataset.wired) return; el.dataset.wired = "1";
    el.addEventListener("click", () => {
      state.focusZone = "content"; syncFocus();
      state.cursors[state.active] = +el.dataset.row;
      state.selAnchor = null;
      const note = firstNoteOnRow(state.active, +el.dataset.row);
      setFocused(note ? note.id : null);
      renderContent(); renderRail();
    });
  });
}

/* ═══════════ Plan body ═══════════ */

function planBodyHTML(fileId, scoped) {
  const rows = planRows();
  const cur = state.cursors.plan != null ? state.cursors.plan : 0;
  const [s0, s1] = selRange();
  let html = '<div class="plan prose">';
  if (!scoped) {
    const rev = state.planVersion === "v2" ? "revision 2" : "revision 1";
    html += '<div class="doc-meta">submitted by <b>agent/worker-3</b> · ' + rev
      + ' · <span class="rev-badge" id="open-versions">v1→v2 ' + versionBadgeText() + "</span></div>";
    const orph = orphanCount();
    if (orph > 0) {
      html += '<div class="orphan-banner"><span class="ob-dot"></span>'
        + orph + " annotation" + (orph > 1 ? "s" : "") + " no longer match version " + (state.planVersion === "v2" ? "v2" : "v1")
        + ' — the passage was removed. <a id="orphan-jump">reattach in Versions →</a></div>';
    }
  }
  let codeOpen = false;
  const closeCode = () => { if (codeOpen) { html += "</div>"; codeOpen = false; } };

  rows.forEach((b, i) => {
    if (!scoped && b.id === "h-p2") { closeCode(); html += configTableHTML(); }
    const liked = !scoped && likedRow("plan", i), red = !scoped && redlinedRow("plan", i);
    const rowCls = ["row",
      (!scoped && i === cur) ? "cursor" : "",
      (!scoped && state.selAnchor !== null && i >= s0 && i <= s1) ? "sel" : "",
      planHasNote(i) ? "has-note" : "",
      (liked && !red) ? "liked" : "",
      red ? "redlined" : "",
    ].filter(Boolean).join(" ");
    const edit = state.edits.find(e => planIndexOfBlock(e.blockId) === i);
    const editing = !scoped && state.editing === b.id;

    if (b.kind === "code") {
      if (!codeOpen) { html += '<div class="codewrap">'; codeOpen = true; }
      let codeInner;
      if (editing) codeInner = '<span class="editor-inline code"><textarea id="edit-input">' + esc(edit ? edit.newText : b.text) + "</textarea><span class=\"ed-hint\"><kbd>⏎</kbd> save · <kbd>esc</kbd> cancel</span></span>";
      else if (edit) codeInner = "<pre><code>" + trackedHTML(edit.oldText, edit.newText) + "</code></pre>";
      else codeInner = "<pre><code>" + hlCode(b.text) + "</code></pre>";
      html += '<div class="' + rowCls + '" data-row="' + i + '">' + codeInner + "</div>";
      return;
    }
    closeCode();

    let inner;
    if (editing) inner = '<span class="editor-inline"><textarea id="edit-input">' + esc(edit ? edit.newText : b.text) + "</textarea><span class=\"ed-hint\"><kbd>⏎</kbd> save tracked change · <kbd>esc</kbd> cancel</span></span>";
    else if (edit) inner = trackedHTML(edit.oldText, edit.newText);
    else inner = codeIdents(linkFilesProse(esc(b.text)));

    let body;
    if (b.kind === "h1") body = "<h1>" + (editing ? inner : esc(b.text)) + "</h1>";
    else if (b.kind === "h2") body = "<h2>" + (editing ? inner : esc(b.text)) + "</h2>";
    else if (b.kind === "li") body = '<div class="li"><span class="marker">▪</span><span>' + inner + "</span></div>";
    else if (b.kind === "oli") { const n = rows.slice(0, i).filter(x => x.kind === "oli").length + 1; body = '<div class="oli"><span class="marker">' + n + '.</span><span>' + inner + "</span></div>"; }
    else body = "<p>" + inner + "</p>";
    html += '<div class="' + rowCls + '" data-row="' + i + '">' + body + "</div>";
  });
  closeCode();
  html += "</div>";
  return html;
}

/* ═══════════ Diff body (settings-driven) ═══════════ */

function diffHeadHTML(f, opts) {
  let html = '<div class="diff-head"><span class="fpath">' + esc(f.path) + "</span>";
  const c = countDiff(f.lines);
  html += f.status === "new"
    ? '<span class="fstat"><span class="newf">new file</span> <span class="plus">+' + c.add + "</span></span>"
    : '<span class="fstat"><span class="plus">+' + c.add + '</span> <span class="minus">−' + c.del + "</span></span>";
  html += '<span class="fstat" style="color:var(--text-dim)">' + settings.diffStyle + (settings.showLineNumbers ? "" : " · no nums") + "</span>";
  if (!opts.scoped) {
    const fileNote = state.annotations.some(a => a.item === f.id && a.fileScope);
    html += '<span class="fc-btn" id="fc-btn">' + (fileNote ? "＋ another file note" : "＋ comment on file  ⇧C") + "</span>";
  }
  html += "</div>";
  return html;
}

function diffTxt(m, side) {
  const l = m.line;
  if (settings.diffGranularity !== "none" && m.partner) {
    if (l.t === "del" && (side === undefined || side === "del")) return intraSide(l.text, m.partner, settings.diffGranularity, "old");
    if (l.t === "add" && (side === undefined || side === "add")) return intraSide(m.partner, l.text, settings.diffGranularity, "new");
  }
  return txtHtml(l.text);
}

function diffBodyHTML(fileId, opts) {
  const f = FILES[fileId];
  const model = buildDiffModel(f);
  const cursorOn = opts.cursor;
  const cur = cursorOn ? (state.cursors[fileId] != null ? state.cursors[fileId] : 0) : -1;
  const [s0, s1] = cursorOn ? selRange() : [-1, -1];
  const style = settings.diffStyle;
  let html = '<div class="diff" data-style="' + style + '" data-linenums="' + (settings.showLineNumbers ? "on" : "off")
    + '" data-intensity="' + settings.lineIntensity + '" style="--tab-size:' + settings.tabSize + ";--diff-mono:" + monoStack(settings.monoFont) + '">';
  html += diffHeadHTML(f, opts);

  model.forEach(m => {
    if (m.type === "hunk") { html += '<div class="dline hunk"><span class="txt">' + esc(m.text) + "</span></div>"; return; }
    if (m.type === "gap") { html += '<div class="dgap"><span class="gut">⋯</span><span class="gap-btn" data-gap="' + fileId + ":" + m.gapId + '">Expand ' + m.count + " unchanged " + (m.count === 1 ? "line" : "lines") + "</span></div>"; return; }
    const l = m.line;
    const red = cursorOn && redlinedRow(fileId, m.idx);
    const rowCls = ["row",
      (cursorOn && m.idx === cur) ? "cursor" : "",
      (cursorOn && state.selAnchor !== null && m.idx >= s0 && m.idx <= s1) ? "sel" : "",
      annCoversLi(fileId, m.li) ? "has-note" : "",
      red ? "redlined" : "",
    ].filter(Boolean).join(" ");
    const inner = style === "split" ? splitLineHTML(m) : unifiedLineHTML(m);
    html += '<div class="' + rowCls + '" data-row="' + m.idx + '" data-li="' + m.li + '">' + inner + "</div>";
  });
  html += "</div>";
  return html;
}

function unifiedLineHTML(m) {
  const nums = settings.showLineNumbers
    ? '<span class="gut">' + m.lo + '</span><span class="gut">' + m.ln + "</span>"
    : "";
  return '<div class="dline ' + m.line.t + '">' + nums + '<span class="sign">' + m.sign + '</span><span class="txt">' + diffTxt(m) + "</span></div>";
}
function splitLineHTML(m) {
  const showN = settings.showLineNumbers, t = m.line.t;
  let leftTxt = " ", rightTxt = " ", leftCls = "", rightCls = "";
  if (t === "ctx") { leftTxt = diffTxt(m); rightTxt = diffTxt(m); }
  else if (t === "del") { leftTxt = diffTxt(m, "del"); leftCls = " c-del"; }
  else { rightTxt = diffTxt(m, "add"); rightCls = " c-add"; }
  let h = '<div class="dline">';
  if (showN) {
    h += '<span class="gut">' + (m.lo !== "" ? m.lo : "") + "</span>";
    h += '<span class="txt' + leftCls + '">' + leftTxt + "</span>";
    h += '<span class="gut mid">' + (m.ln !== "" ? m.ln : "") + "</span>";
    h += '<span class="txt' + rightCls + '">' + rightTxt + "</span>";
  } else {
    h += '<span class="txt' + leftCls + '">' + leftTxt + "</span>";
    h += '<span class="txt mid' + rightCls + '">' + rightTxt + "</span>";
  }
  h += "</div>";
  return h;
}

/* saved suggestions render as proposed-replacement blocks; open editor renders in place */
function injectInlineSuggestions(inner) {
  if (state.view !== "file") return;
  cardsForActive().filter(c => c.kind === "suggestion" && !c.orphan).forEach(c => {
    if (state.suggesting && state.suggesting.item === state.active && state.suggesting.start === c.anchor) return;
    const anchor = inner.querySelector('[data-row="' + c.anchor + '"]');
    if (!anchor) return;
    const block = document.createElement("div");
    block.className = "suggestion-block" + (c.id === state.focusedId ? " focused" : "");
    block.innerHTML = '<div class="sb-head">SUGGESTED CHANGE</div>'
      + '<pre class="sb-old"><code>' + esc(c.ann.oldCode) + "</code></pre>"
      + '<pre class="sb-new"><code>' + esc(c.ann.suggestion) + "</code></pre>";
    anchor.after(block);
  });
  if (state.suggesting && state.suggesting.item === state.active) {
    const anchor = inner.querySelector('[data-row="' + state.suggesting.start + '"]');
    if (anchor) {
      const box = document.createElement("div");
      box.className = "suggest-editor";
      box.innerHTML = '<div class="se-head">SUGGEST A REPLACEMENT</div>'
        + '<textarea id="suggest-input"></textarea>'
        + '<div class="ed-hint"><kbd>⌘⏎</kbd> save suggestion · <kbd>esc</kbd> cancel</div>';
      anchor.after(box);
      const ta = box.querySelector("textarea");
      ta.value = rowsText(state.active, state.suggesting.start, state.suggesting.end);
      ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px";
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }
}

/* ═══════════ Read-only body ═══════════ */

function roBodyHTML(f) {
  const lines = f.content.split("\n");

/* ═══════════ All-files continuous ═══════════ */

function allFilesHTML() {

function wireAllFiles() {

function setViewedFile(id, val, autocollapse) {

function allFilesStep(dir) {

/* ═══════════ Version diff body ═══════════ */

function serializeBlock(b) {
  if (b.kind === "h1") return ["# " + b.text];
  if (b.kind === "h2") return ["## " + b.text];
  if (b.kind === "li") return ["- " + b.text];
  if (b.kind === "oli") return ["1. " + b.text];
  if (b.kind === "code") return b.text.split("\n");
  return [b.text];
}

function versionsBodyHTML() {
  const diff = planBlockDiff();
  let html = '<div class="ver-view"><div class="vv-head"><div><div class="vv-title">plan.md — revision diff</div>'
    + '<div class="vv-sub">v1 (initial) → v2 (current) · showing ' + (state.versionDiffView === "rendered" ? "rendered passages" : "raw markdown diff") + "</div></div>"
    + '<div class="vv-tools"><div class="mini-seg" data-verseg><button data-vdv="rendered" class="' + (state.versionDiffView === "rendered" ? "on" : "") + '">Rendered</button><button data-vdv="raw" class="' + (state.versionDiffView === "raw" ? "on" : "") + '">Raw</button></div></div></div>';

  if (state.versionDiffView === "raw") {
    html += '<div class="ver-raw">';
    diff.forEach(d => {
      if (d.status === "same") serializeBlock(d.b).forEach(ln => { html += rawLine(" ", ln); });
      else if (d.status === "added") serializeBlock(d.b).forEach(ln => { html += rawLine("+", ln); });
      else if (d.status === "removed") serializeBlock(d.a).forEach(ln => { html += rawLine("-", ln); });
      else { serializeBlock(d.a).forEach(ln => { html += rawLine("-", ln); }); serializeBlock(d.b).forEach(ln => { html += rawLine("+", ln); }); }
    });
    html += "</div>";
  } else {
    diff.forEach(d => {
      const b = d.b || d.a;
      const tagMap = { same: "", changed: "REVISED", added: "ADDED IN v2", removed: "REMOVED IN v2" };
      const tag = tagMap[d.status] ? '<span class="vv-tag">' + tagMap[d.status] + "</span>" : "";
      let inner;
      if (b.kind === "code") {
        if (d.status === "changed") inner = '<span class="vb-code">' + codeLineDiff(d.a.text, d.b.text) + "</span>";
        else inner = '<span class="vb-code">' + hlCode(b.text) + "</span>";
      } else {
        const cls = b.kind === "h1" ? "vb-h1" : b.kind === "h2" ? "vb-h2" : "vb-text";
        let t;
        if (d.status === "changed") t = trackedHTML(d.a.text, d.b.text);
        else t = linkFiles(esc(b.text));
        const prefix = b.kind === "li" ? "▪ " : b.kind === "oli" ? "• " : "";
        inner = '<span class="' + cls + ' vb-text">' + prefix + t + "</span>";
      }
      html += '<div class="vblock ' + d.status + '">' + inner + tag + "</div>";
    });
  }
  html += "</div>";
  return html;
}
function rawLine(sign, text) {
  const cls = sign === "+" ? "add" : sign === "-" ? "del" : "";
  return '<div class="rl ' + cls + '"><span class="sign">' + sign + '</span><span class="txt">' + (esc(text) || " ") + "</span></div>";
}
function codeLineDiff(oldSrc, newSrc) {
  const ops = lcsOps(oldSrc.split("\n"), newSrc.split("\n"));
  return ops.map(o => {
    if (o.t === "eq") return hlCode(o.v);
    if (o.t === "ins") return '<span class="ln-add">' + hlCode(o.v) + "</span>";
    return '<span class="ln-del">' + hlCode(o.v) + "</span>";
  }).join("\n");
}
function wireVersions() {
  $("#content").querySelectorAll("[data-verseg] [data-vdv]").forEach(b => b.addEventListener("click", () => { state.versionDiffView = b.dataset.vdv; renderAll(); }));
}

/* ═══════════ Split top-mode ═══════════ */

function splitBodyHTML() {
  const f = FILES[state.active];
  if (state.view === "all") { state.view = "file"; state.active = "plan"; }
  if (!f || f.kind === "ro") {
    return '<div class="split"><div class="split-pane"><div class="split-label">BASE</div><div class="ro-banner">Read-only file — nothing to compare.</div></div><div class="split-pane"><div class="split-label working">WORKING COPY</div></div></div>';
  }
  if (f.kind === "plan") {
    const rows = planRows();
    const base = '<div class="split-pane"><div class="split-label">BASE · as submitted</div><div class="plan">' + rows.map(b => staticBlock(b, null)).join("") + "</div></div>";
    const work = '<div class="split-pane"><div class="split-label working">WORKING COPY · your edits</div><div class="plan">' + rows.map((b, i) => { const e = state.edits.find(x => planIndexOfBlock(x.blockId) === i); return staticBlock(b, e); }).join("") + "</div></div>";
    return '<div class="split">' + base + work + "</div>";
  }
  const model = buildDiffModel(f);
  const oldSide = [], newSide = [];
  model.forEach(m => {
    if (m.type !== "line") return;
    const l = m.line;
    if (l.t === "ctx") { oldSide.push({ n: m.lo, t: "ctx", text: l.text }); newSide.push({ n: m.ln, t: "ctx", text: l.text }); }
    else if (l.t === "del") oldSide.push({ n: m.lo, t: "del", text: l.text });
    else newSide.push({ n: m.ln, t: "add", text: l.text });
  });
  const side = arr => arr.map(r => '<div class="dline ' + r.t + '"><span class="gut">' + r.n + '</span><span class="sign">' + (r.t === "add" ? "+" : r.t === "del" ? "−" : " ") + '</span><span class="txt">' + (esc(r.text) || " ") + "</span></div>").join("");
  return '<div class="split"><div class="split-pane"><div class="split-label">BASE · ' + esc(f.path) + '</div><div class="diff" data-style="unified" data-linenums="on" style="--tab-size:' + settings.tabSize + '">' + side(oldSide)
    + '</div></div><div class="split-pane"><div class="split-label working">WORKING COPY</div><div class="diff" data-style="unified" data-linenums="on" style="--tab-size:' + settings.tabSize + '">' + side(newSide) + "</div></div>";
}
function staticBlock(b, edit) {
  if (b.kind === "code") return '<div class="codewrap"><pre><code>' + (edit ? trackedHTML(edit.oldText, edit.newText) : hlCode(b.text)) + "</code></pre></div>";
  const inner = edit ? trackedHTML(edit.oldText, edit.newText) : linkFiles(esc(b.text));
  if (b.kind === "h1") return "<h1 style='padding:3px 0'>" + inner + "</h1>";
  if (b.kind === "h2") return "<h2 style='padding:12px 0 4px'>" + inner + "</h2>";
  if (b.kind === "li") return '<div class="li" style="padding:3px 0"><span class="marker">▪</span><span>' + inner + "</span></div>";
  if (b.kind === "oli") return '<div class="oli" style="padding:3px 0"><span class="marker">•</span><span>' + inner + "</span></div>";
  return "<p style='padding:3px 0'>" + inner + "</p>";
}

/* ═══════════ Guided ═══════════ */

function renderGuided() {
  const ids = changedFileIds;
  if (state.guidedIndex >= ids.length) state.guidedIndex = ids.length - 1;
  const id = ids[state.guidedIndex];
  state.view = "file"; state.active = id;
  if (state.cursors[id] == null) state.cursors[id] = 0;
  const viewed = ids.filter(x => state.viewed["file:" + x]).length;
  $("#g-title").textContent = FILES[id].path;
  $("#g-count").textContent = "file " + (state.guidedIndex + 1) + " of " + ids.length + " · " + viewed + " viewed";
  $("#gbar-fill").style.width = (viewed / ids.length * 100) + "%";
  renderContent();
  const target = $("#content").querySelector('[data-row="0"]');
  if (target) target.scrollIntoView({ block: "start" });
}
function guidedStep(dir) {
  const ids = changedFileIds;
  if (dir > 0) state.viewed["file:" + ids[state.guidedIndex]] = true;
  const next = state.guidedIndex + dir;
  if (next < 0) { flash("At the first file"); return; }
  if (next >= ids.length) { state.viewed["file:" + ids[state.guidedIndex]] = true; flash("End of walk — ⌘⏎ to finish"); renderAll(); return; }
  state.guidedIndex = next;
  renderAll();
}

/* ═══════════ Crumb ═══════════ */

function updateCrumb() {
  const c = $("#crumb");
  const lead = esc(state.sessionTitle);
  if (state.view === "all") { c.innerHTML = lead + " <span class='sep'>/</span> <b>all changed files</b> <span class='cbadge'>" + changedFileIds.length + " files</span>"; return; }
  if (state.view === "versions") { c.innerHTML = lead + " <span class='sep'>/</span> <b>plan.md</b> <span class='sep'>·</span> revision diff <span class='cbadge'>v1 → v2</span>"; return; }
  const f = FILES[state.active];
  if (!f) { c.innerHTML = lead; return; }
  if (f.kind === "plan") {
    const rows = planRows();
    const cur = state.cursors.plan != null ? state.cursors.plan : 0;
    c.innerHTML = lead + " <span class='sep'>/</span> <b>plan.md</b> <span class='sep'>·</span> " + (state.planVersion) + " <span class='sep'>·</span> block " + (cur + 1) + "/" + rows.length;
    return;
  }
  const rows = rowsFor(state.active);
  const cur = state.cursors[state.active] != null ? state.cursors[state.active] : 0;
  const kindLabel = f.kind === "ro" ? "read-only" : "diff";
  c.innerHTML = lead + " <span class='sep'>/</span> <b>" + esc(f.path) + "</b> <span class='sep'>·</span> " + kindLabel + (f.kind === "diff" ? " <span class='sep'>·</span> line " + (cur + 1) + "/" + rows.length : "");
}

/* ═══════════ Rail ═══════════ */

function topInCanvas(el) { return el.getBoundingClientRect().top - canvas.getBoundingClientRect().top; }
function firstNoteOnRow(item, rowIdx) {
  if (item === "plan") {
    const a = state.annotations.find(a => {
      if (a.item !== "plan" || a.fileScope) return false;
      const s = planIndexOfBlock(a.blockId), e = planIndexOfBlock(a.blockIdEnd != null ? a.blockIdEnd : a.blockId);
      return s >= 0 && rowIdx >= Math.min(s, e) && rowIdx <= Math.max(s, e);
    });
    if (a) return { id: a.id };
    const e = state.edits.find(x => planIndexOfBlock(x.blockId) === rowIdx);
    if (e) return { id: "e" + e.id };
    return null;
  }
  const rows = rowsFor(item);
  const r = rows[rowIdx];
  if (!r) return null;
  const a = state.annotations.find(a => a.item === item && !a.fileScope && r.li >= a.startLi && r.li <= a.endLi);
  return a ? { id: a.id } : null;
}

function cardsForActive() {
  const list = [];
  const item = state.active;
  state.annotations.filter(a => a.item === item).forEach(a => {
    const idx = a.fileScope ? -1 : annStartRow(a);
    list.push({ id: a.id, kind: a.type || "comment", ann: a, anchor: a.fileScope ? -1 : idx, orphan: !a.fileScope && idx < 0 });
  });
  if (item === "plan") state.edits.forEach(e => { const idx = planIndexOfBlock(e.blockId); if (idx >= 0) list.push({ id: "e" + e.id, kind: "edit", edit: e, anchor: idx }); });
  list.sort((x, y) => (x.orphan ? 1e6 : (x.anchor < 0 ? -1 : x.anchor)) - (y.orphan ? 1e6 : (y.anchor < 0 ? -1 : y.anchor)));
  return list;
}
function anchorRow(card) { if (card.orphan || card.anchor < 0) return null; return $("#content").querySelector('[data-row="' + card.anchor + '"]'); }

function diffLineNum(a) {
  const rows = rowsFor(a.item);
  const r = rows.find(x => x.li === a.startLi);
  return r ? (r.ln || r.lo) : "?";
}
function quoteOf(a) {
  if (a.fileScope) return "Whole file — file-level note";
  if (a.item === "plan") {
    const b = planBlock(a.blockId);
    if (!b) { const bv = planBlock(a.blockId, "v1") || planBlock(a.blockId, "v2"); return "(passage removed) " + (bv ? trunc(bv.text) : ""); }
    return trunc(b.text.trim());
  }
  const rows = rowsFor(a.item);
  const r = rows.find(x => x.li === a.startLi);
  const text = r ? (r.line.text || "(blank line)") : "(line hidden)";
  const more = a.endLi > a.startLi ? " … +" + (a.endLi - a.startLi) : "";
  return trunc(text.trim()) + more;
}

function convChip(a) { return a.convention ? '<span class="conv-chip">' + esc(a.convention) + "</span>" : ""; }
function blkChip(a) { return a.blocking ? '<span class="blocking-chip">blocking</span>' : ""; }

function buildCard(card) {
  const el = document.createElement("div");
  el.dataset.id = card.id;
  const sent = state.submitted;
  const badge = card.orphan ? '<span class="card-badge orphan">ORPHANED</span>' : '<span class="card-badge' + (sent ? " sent" : "") + '">' + (sent ? "SENT" : "PENDING") + "</span>";
  const f = FILES[state.active];
  const a = card.ann;
  const loc = (a && !a.fileScope && f.kind === "diff" && card.anchor >= 0) ? '<div class="card-loc">' + esc(f.path) + ":" + diffLineNum(a) + "</div>" : "";

  if (card.kind === "edit") {
    el.className = "card is-edit";
    el.innerHTML = '<div class="card-head"><span class="card-type">EDIT</span>' + badge + "</div>"
      + '<div class="card-mini"><span class="m-del">' + esc(trunc(card.edit.oldText)) + '</span><span class="m-ins">' + esc(trunc(card.edit.newText)) + "</span></div>";
  } else if (card.kind === "suggestion") {
    el.className = "card is-suggestion" + (card.orphan ? " orphan" : "");
    el.innerHTML = '<div class="card-head"><span class="card-type">SUGGESTION</span>' + badge + "</div>" + loc
      + '<div class="card-mini"><span class="m-del">' + esc(trunc(a.oldCode.replace(/\n/g, " "))) + '</span><span class="m-ins">' + esc(trunc(a.suggestion.replace(/\n/g, " "))) + "</span></div>"
      + '<div class="card-body">' + esc(a.text) + "</div>";
  } else if (card.kind === "redline") {
    el.className = "card is-redline" + (card.orphan ? " orphan" : "");
    el.innerHTML = '<div class="card-head"><span class="card-type">CUT · DELETE</span>' + badge + "</div>" + loc
      + '<div class="card-quote' + (f.kind === "diff" ? " mono" : "") + '">' + esc(quoteOf(a)) + "</div>"
      + '<div class="card-body">' + esc(a.text) + "</div>";
  } else if (card.kind === "looksgood") {
    el.className = "card is-praise" + (card.orphan ? " orphan" : "");
    el.innerHTML = '<div class="card-head"><span class="card-type">✓ LOOKS GOOD</span>' + badge + "</div>" + loc
      + '<div class="card-quote green">' + esc(quoteOf(a)) + "</div>"
      + '<div class="card-body">' + esc(a.text) + "</div>";
  } else if (card.kind === "label") {
    const t = tagById(a.tag);
    el.className = "card is-label" + (card.orphan ? " orphan" : "");
    el.innerHTML = '<div class="card-head"><span class="tag-dot" style="background:' + t.color + '"></span><span class="card-type" style="color:' + t.color + '">' + t.label.toUpperCase() + "</span>" + badge + "</div>" + loc
      + '<div class="card-quote' + (f.kind === "diff" ? " mono" : "") + '">' + esc(quoteOf(a)) + "</div>"
      + '<div class="card-body">' + esc(a.text) + "</div>";
  } else {
    el.className = "card" + (card.orphan ? " orphan" : "");
    const head = a.fileScope ? "FILE NOTE" : "COMMENT";
    el.innerHTML = '<div class="card-head"><span class="card-type">' + head + "</span>" + convChip(a) + blkChip(a) + badge + "</div>" + loc
      + (a.fileScope ? "" : '<div class="card-quote' + (f.kind === "diff" && card.anchor >= 0 ? " mono" : "") + '">' + esc(quoteOf(a)) + "</div>")
      + '<div class="card-body">' + esc(a.text) + "</div>";
    if (card.orphan) el.innerHTML += '<div class="card-reattach" data-reattach="v1">was anchored in v1 — switch to v1 to reattach →</div>';
  }

  el.addEventListener("click", e => {
    if (e.target.closest("[data-reattach]")) { state.planVersion = "v1"; flash("switched to v1 — annotation reattached"); renderAll(); return; }
    const editable = a && card.kind !== "edit" && card.kind !== "suggestion";
    if (state.focusedId === card.id && editable && e.target.closest(".card-body")) editCardNote(el, a);
    else { setFocused(card.id); renderRail(); applyAnchorFocus(); }
  });
  return el;
}

function applyAnchorFocus() {
  document.querySelectorAll(".anchor-focus").forEach(el => el.classList.remove("anchor-focus"));
  if (!state.focusedId) return;
  const card = cardsForActive().find(c => c.id === state.focusedId);
  if (!card) return;
  const row = anchorRow(card);
  if (row) row.classList.add("anchor-focus");
}

function railVisible() {
  return state.mode !== "focus" && state.view === "file" && FILES[state.active] && FILES[state.active].kind !== "ro";
}

function renderRail() {
  if (connector) connector.style.display = "none";
  railCards.innerHTML = "";

  const onFile = state.view === "file" && FILES[state.active] && FILES[state.active].kind !== "ro";
  if (!onFile) {
    const note = document.createElement("div");
    note.className = "rail-empty static";
    note.textContent = state.view === "all"
      ? "Open a single file to see its pending notes here — the review still submits everything at once."
      : state.view === "versions"
        ? "Plan revision diff open. Open a file to annotate; pending notes show here."
        : "Read-only context file — nothing to annotate.";
    railCards.appendChild(note);
    return;
  }

  const cards = cardsForActive();
  const otherCount = state.annotations.length + state.edits.length - cards.length;

  if (!cards.length) {
    const empty = document.createElement("div");
    empty.className = "rail-empty static";
    empty.textContent = FILES[state.active].kind === "plan"
      ? "No notes on this file yet. Move with j / k, extend with ⇧j, then c to comment, r to cut, g for looks-good, or e to rewrite a block."
      : "Move the line cursor with j / k, then c to comment, r to cut, s to suggest code, or ⇧C for a file-scoped note.";
    railCards.appendChild(empty);
    if (otherCount > 0) railNote(otherCount);
    return;
  }

  cards.forEach(c => {
    const el = buildCard(c);
    el.classList.toggle("focused", c.id === state.focusedId);
    railCards.appendChild(el);
  });
  if (otherCount > 0) railNote(otherCount);
}
function railNote(n) {
  const note = document.createElement("div");
  note.className = "rail-note static";
  note.textContent = n + " more pending on other files — press n to walk them.";
  railCards.appendChild(note);
}

function editCardNote(el, ann) {
  const body = el.querySelector(".card-body");
  if (!body || el.querySelector("textarea")) return;
  const ta = document.createElement("textarea");
  ta.value = ann.text; ta.rows = Math.max(2, ann.text.split("\n").length);

/* ═══════════ Selection / focus ═══════════ */

function selRange() {
  const cur = state.cursors[state.active] != null ? state.cursors[state.active] : 0;
  if (state.selAnchor === null) return [cur, cur];

}
function setFocused(id) { state.focusedId = id; }
function syncFocus() { $("#app").dataset.focus = state.focusZone; }
function canAnnotate() { return state.view === "file" && FILES[state.active] && (FILES[state.active].kind === "plan" || FILES[state.active].kind === "diff"); }
function ensureWorkspace() { if (state.mode === "focus") setMode("workspace"); if (state.rightTab !== "feedback") switchRightTab("feedback"); }

/* ═══════════ Actions ═══════════ */

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  state.sidebarCursor = 0;
  if (tab === "versions") { state.view = "versions"; state.active = "plan"; }
  else if (state.view === "versions") { state.view = "file"; state.active = "plan"; }
  syncView(); renderAll();
}
function cycleTab() { const order = ["status", "tree", "versions"]; setTab(order[(order.indexOf(state.tab) + 1) % order.length]); }

function setMode(mode) {
  state.mode = mode;
  $("#app").dataset.mode = mode;
  document.querySelectorAll("#mode-seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  if (mode === "guided") state.guidedIndex = Math.max(0, changedFileIds.indexOf(state.active === "__all__" ? "plan" : state.active));

function moveSidebar(delta) {

}
function moveContent(delta, extend) {

function jumpFile(dir) {
  if (state.view === "all") { allFilesStep(dir); return; }
  const cur = changedFileIds.indexOf(state.active);
  const idx = Math.max(0, Math.min(changedFileIds.length - 1, (cur < 0 ? 0 : cur) + dir));
  state.focusZone = "content";
  openFile(changedFileIds[idx]);

}

  if (state.view === "file" && FILES[state.active] && FILES[state.active].changed) {

/* ═══════════ Annotation creators ═══════════ */

function addAnnotation(a) {

  a.type = a.type || "comment";
  a.text = a.text || "";
  a.convention = a.convention || "";

}
function markRedline() {

}

/* ═══════════ Composer (rail or inline) ═══════════ */

let composer = null;
function startComment() {
  if (state.editing != null || state.suggesting) return;
  if (state.view === "all") {
    if (!state.allSel) { flash("Click a line first, then c to comment"); return; }
    openComposer(state.allSel.file, state.allSel.row, state.allSel.row, {});
    return;
  }
  if (!canAnnotate()) { flash("Open a changed file to comment"); return; }
  const [s0, s1] = selRange();

}
function startFileComment() {
  if (state.editing != null || state.suggesting) return;

  openComposer(state.active, 0, 0, { fileScope: true });
}
function openComposer(item, start, end, opts) {
  cancelComposer();

  let quote;
  if (opts.fileScope) quote = "Whole file — " + f.path;
  else { const first = rows[start]; quote = item === "plan" ? first.block.text : (first.line.text || "(blank line)"); }
  const span = !opts.fileScope && end > start ? " · +" + (end - start) + " more" : "";
  const conv = settings.conventions;
  let convRow = "";
  if (conv.enabled) {
    convRow = '<div class="conv-row">'
      + '<button class="conv-opt none' + (conv.default === "" ? " on" : "") + '" data-conv="">none</button>'
      + CONVENTIONS.map(c => '<button class="conv-opt' + (c === conv.default ? " on" : "") + '" data-conv="' + c + '">' + c + "</button>").join("")
      + '<button class="blk-opt" data-blk>blocking</button></div>';
  }

  const el = document.createElement("div");
  el.className = "card composer inline-composer";
  el.innerHTML = '<div class="card-head"><span class="card-type">' + (opts.fileScope ? "FILE NOTE" : "COMMENT") + '</span><span class="card-badge">DRAFT</span></div>'
    + '<div class="card-quote' + (f.kind === "diff" && !opts.fileScope ? " mono" : "") + '">' + esc(trunc(quote)) + span + "</div>"
    + convRow
    + '<textarea id="composer-input" rows="3" placeholder="Note for the agent…"></textarea>'
    + '<div class="card-hint"><kbd>⏎</kbd> save · <kbd>esc</kbd> cancel</div>';

  // inline in the center, anchored after the selected row (or at the top for file-scoped notes)
  let anchor;
  if (state.view === "all") anchor = $("#content").querySelector('section.afile[data-file="' + item + '"] [data-row="' + start + '"]');
  else anchor = $("#content").querySelector('[data-row="' + start + '"]');
  if (anchor) anchor.insertAdjacentElement("afterend", el);
  else $("#content").appendChild(el);
  composer = { el: el, item: item, start: start, end: end, fileScope: !!opts.fileScope, convention: conv.default, blocking: conv.default ? !!conv.blocking[conv.default] : false };

  const syncBlk = () => { const b = el.querySelector("[data-blk]"); if (b) b.classList.toggle("on", composer.blocking); };
  el.querySelectorAll("[data-conv]").forEach(b => b.addEventListener("mousedown", ev => {
    ev.preventDefault();

    el.querySelectorAll("[data-conv]").forEach(x => x.classList.toggle("on", x === b));
    syncBlk();
  }));

}
function saveComposer() {

  if (!composer) return;

  const { item, start, end, fileScope, convention, blocking } = composer;

  let a;

  else a = Object.assign({ item: item, type: "comment", text: text, convention: convention || "", blocking: !!blocking }, anchorFromRange(item, start, end));

/* ═══════════ Code suggestion ═══════════ */

function startSuggestion() {
  if (!canAnnotate() || state.editing != null) { flash("Open a changed file to suggest code"); return; }
  cancelComposer();
  ensureWorkspace();
  const [s0, s1] = selRange();
  state.suggesting = { item: state.active, start: s0, end: s1 };
  renderContent();
  flash("Editing a suggested replacement — ⌘⏎ to save");
}
function saveSuggestion() {
  const ta = $("#suggest-input");

  const { item, start, end } = state.suggesting;
  const oldCode = rowsText(item, start, end);
  const newCode = ta.value;
  state.suggesting = null;
  if (newCode.trim() === oldCode.trim() || !newCode.trim()) { flash("No change — suggestion discarded"); renderAll(); return; }
  const a = addAnnotation(Object.assign({ item: item, type: "suggestion", oldCode: oldCode, suggestion: newCode }, anchorFromRange(item, start, end)));
  setFocused(a.id);
  flash("Code suggestion added — pending until submit");
  renderAll();
}
function cancelSuggestion() { state.suggesting = null; renderContent(); renderRail(); }

/* ═══════════ Plan edits (tracked) ═══════════ */

function startEdit() {
  if (state.view !== "file" || FILES[state.active].kind !== "plan") { flash("e edits plan text — open plan.md"); return; }
  cancelComposer();
  const cur = state.cursors.plan != null ? state.cursors.plan : 0;
  state.editing = planRows()[cur].id;
  renderContent();
}
function saveEdit() {
  const ta = $("#edit-input");
  if (ta == null || state.editing == null) return;
  const blockId = state.editing;
  const block = planBlock(blockId);
  const text = ta.value.trim();
  const existing = state.edits.find(e => e.blockId === blockId);
  state.editing = null;
  if (!block || !text || text === block.text) {
    if (existing) state.edits = state.edits.filter(e => e !== existing);
    flash("No change — edit discarded"); renderAll(); return;
  }
  if (existing) { state.undoStack.push({ kind: "edit-update", id: existing.id, prev: existing.newText }); existing.newText = text; }
  else { const e = { id: state.nextId++, blockId: blockId, oldText: block.text, newText: text }; state.edits.push(e); state.undoStack.push({ kind: "edit", id: e.id }); setFocused("e" + e.id); }
  flash("Edit tracked — pending until submit");
  renderAll();
}
function cancelEdit() { state.editing = null; renderContent(); }

function undo() {
  const op = state.undoStack.pop();
  if (!op) { flash("Nothing to undo"); return; }
  if (op.kind === "annotation") { state.annotations = state.annotations.filter(a => a.id !== op.id); flash("Annotation removed"); }
  else if (op.kind === "edit") { state.edits = state.edits.filter(e => e.id !== op.id); flash("Edit reverted"); }
  else if (op.kind === "edit-update") { const e = state.edits.find(x => x.id === op.id); if (e) e.newText = op.prev; flash("Edit reverted"); }
  setFocused(null);
  renderAll();
}

/* ═══════════ Pending navigation ═══════════ */

function pendingEntries() {
  const order = changedFileIds;
  const es = [];
  state.annotations.forEach(a => {
    if (a.item === "plan") { const idx = a.fileScope ? -1 : planIndexOfBlock(a.blockId); es.push({ item: "plan", id: a.id, sortFile: 0, at: a.fileScope ? -1 : (idx < 0 ? 1e5 : idx), orphan: annOrphaned(a) }); }
    else es.push({ item: a.item, id: a.id, sortFile: order.indexOf(a.item), at: a.fileScope ? -1 : a.startLi });
  });
  state.edits.forEach(e => { const idx = planIndexOfBlock(e.blockId); if (idx >= 0) es.push({ item: "plan", id: "e" + e.id, sortFile: 0, at: idx }); });
  es.sort((x, y) => x.sortFile - y.sortFile || x.at - y.at);
  return es;
}
function jumpPending(dir) {
  const list = pendingEntries();

  if (state.mode !== "workspace") setMode("workspace");
  let idx = list.findIndex(e => e.id === state.focusedId);
  idx = idx < 0 ? (dir > 0 ? 0 : list.length - 1) : (idx + dir + list.length) % list.length;
  const target = list[idx];
  state.view = "file"; state.focusZone = "content";
  openFile(target.item);
  setFocused(target.id);
  if (target.orphan) flash("orphaned annotation — reattach in Versions");
  if (state.tab === "status") state.sidebarCursor = Math.max(0, statusItemIndex(target.item));
  syncView(); renderAll();
  if (target.item !== "plan" && target.at >= 0) {
    const rows = rowsFor(target.item); const r = rows.findIndex(x => x.li === target.at); const row = r >= 0 ? r : 0;
    const rowEl = $("#content").querySelector('[data-row="' + row + '"]');
    if (rowEl) { rowEl.classList.add("flash"); rowEl.scrollIntoView({ block: "center" }); }
  } else if (target.at >= 0) {
    const rowEl = $("#content").querySelector('[data-row="' + target.at + '"]');
    if (rowEl) { rowEl.classList.add("flash"); rowEl.scrollIntoView({ block: "center" }); }
  }

}

/* ═══════════ Finish panel ═══════════ */

function pendingCount() { return state.annotations.length + state.edits.length; }
function blockingCount() { return state.annotations.filter(a => (a.type || "comment") === "comment" && a.blocking).length; }

function renderRightMeta() {
  const verBadge = $("#tab-ver-badge");
  if (verBadge) verBadge.textContent = "v2";
  const n = pendingCount();
  const fb = $("#rp-fb-count");
  if (fb) { fb.textContent = n ? String(n) : ""; fb.style.display = n ? "inline-flex" : "none"; }
}

function finishItemHTML(a) {
  let tag = "", body = "";
  const type = a.type || "comment";
  if (type === "redline") { tag = '<span class="fi-tag red">cut</span>'; body = '<span class="del">' + esc(quoteOf(a)) + "</span>"; }
  else if (type === "looksgood") { tag = '<span class="fi-tag green">looks good</span>'; body = a.text ? esc(a.text) : esc(quoteOf(a)); }
  else if (type === "label") { const t = tagById(a.tag); tag = '<span class="fi-tag" style="color:' + t.color + ';border-color:' + t.color + '">' + t.label + "</span>"; body = a.text ? esc(a.text) : esc(quoteOf(a)); }
  else if (type === "suggestion") { tag = '<span class="fi-tag green">suggestion</span>'; body = '<span class="minus">' + esc(trunc(a.oldCode.replace(/\n/g, " "))) + '</span> → <span class="plus">' + esc(trunc(a.suggestion.replace(/\n/g, " "))) + "</span>"; }
  else { tag = (a.convention ? '<span class="fi-tag">' + esc(a.convention) + "</span>" : "") + (a.blocking ? '<span class="fi-tag red">blocking</span>' : ""); body = esc(a.text); }
  const ex = a.fileScope ? "whole file" : quoteOf(a);
  return '<div class="fitem"><div class="fexcerpt"><span class="fex-t">' + esc(ex) + "</span>" + tag + '</div><div class="fbody">' + body + "</div></div>";
}

function renderFinishPanel() {
  const body = $("#finish-body");

  if (unviewed.length) html += '<div id="unviewed-warn"><span class="uv-dot"></span>' + unviewed.length + " changed file" + (unviewed.length > 1 ? "s" : "") + " not viewed · " + unviewed.map(id => esc(FILES[id].name)).join(", ") + "</div>";

  html += '<div class="f-label">SUMMARY COMMENT</div><textarea id="parent-comment" placeholder="Overall note to the agent (optional)…">' + (($("#parent-comment") && !state.submitted) ? esc($("#parent-comment").value) : "") + "</textarea>";
  const verdicts = [

    if (hasEdits) {

      html += '<div class="fitem"><div class="fexcerpt"><span class="fex-t">plan text · ' + state.edits.length + " block" + (state.edits.length > 1 ? "s" : "") + ' edited</span><span class="fi-tag green">tracked</span></div>'
        + '<div class="fbody"><span class="plus">+' + tot.i + '</span> <span class="minus">−' + tot.d + "</span> words</div></div>";

    }

}

/* ⌘⏎ (first press): reveal the Feedback pane and focus the summary. */
function openPanel(contextual) {
  if (state.submitted) return;
  cancelComposer(); if (state.editing != null) saveEdit();
  if (state.mode === "focus") setMode("workspace");
  if (contextual) state.verdict = pendingCount() === 0 ? "approve" : (state.verdict === "approve" ? "comment" : state.verdict);
  switchRightTab("feedback");
  renderFinishPanel(); renderRightMeta();
  const pc = $("#parent-comment");
  if (pc) { pc.focus(); pc.setSelectionRange(pc.value.length, pc.value.length); pc.scrollIntoView({ block: "nearest" }); }
}
function closePanel() { const pc = $("#parent-comment"); if (pc) pc.blur(); }

let autoCloseTimer = null;
function submitReview() {
  if (state.submitted) return;
  const names = { comment: "Comment", approve: "Approve", request: "Request changes" };
  const pc = $("#parent-comment");
  const parent = pc ? pc.value.trim() : "";
  const nc = state.annotations.length, ne = state.edits.length, nb = blockingCount();
  state.submitted = true;
  closePanel();
  const parts = [];
  if (nc) parts.push(nc + " annotation" + (nc === 1 ? "" : "s"));
  if (ne) parts.push(ne + " tracked edit" + (ne === 1 ? "" : "s"));
  $("#cc-sub").textContent = (parts.length ? parts.join(" and ") : "No annotations")
    + (nb ? " (" + nb + " blocking)" : "")
    + (parent ? ", with an overall note," : "") + " delivered to agent/worker-3 as " + settings.displayName + " in one atomic reply. Nothing was visible until now.";

/* ═══════════ Theme / texture / settings application ═══════════ */

function applyTheme() {

function fuzzy(q, text) {
  q = q.toLowerCase(); const s = text.toLowerCase();
  let ti = 0, qi = 0; const idxs = []; let score = 0, streak = 0;
  while (qi < q.length && ti < s.length) {
    if (q[qi] === s[ti]) { idxs.push(ti); qi++; streak++; score += 1 + streak; }
    else streak = 0;
    ti++;
  }
  if (qi < q.length) return null;
  return { idxs, score: score - s.length * 0.02 };
}
function highlightName(name, idxs) {
  if (!idxs || !idxs.length) return esc(name);
  const set = new Set(idxs);
  let out = "";
  for (let i = 0; i < name.length; i++) out += set.has(i) ? "<b>" + esc(name[i]) + "</b>" : esc(name[i]);
  return out;
}
function keysHTML(keys) { return keys.map(k => "<kbd>" + esc(k) + "</kbd>").join(""); }

function renderPalette(query) {
  const q = (query || "").trim();
  if (!q) {
    paletteResults = commands.map(c => ({ c, idxs: [] }));
  } else {
    paletteResults = commands.map(c => { const mn = fuzzy(q, c.name); const md = fuzzy(q, c.desc || ""); const m = mn || md; return m ? { c, idxs: mn ? mn.idxs : [], score: m.score } : null; })
      .filter(Boolean).sort((a, b) => b.score - a.score);
  }
  if (paletteSel >= paletteResults.length) paletteSel = 0;
  const list = $("#palette-list");
  if (!paletteResults.length) { list.innerHTML = '<div class="pal-empty">No commands match “' + esc(q) + "”</div>"; return; }
  let html = "", lastGroup = null;
  paletteResults.forEach((r, i) => {
    if (!q && r.c.group !== lastGroup) { html += '<div class="pal-group">' + esc(r.c.group) + "</div>"; lastGroup = r.c.group; }
    html += '<div class="pal-row' + (i === paletteSel ? " sel" : "") + '" data-i="' + i + '">'
      + '<span class="pal-ico">' + r.c.ico + "</span>"
      + '<span class="pal-name">' + highlightName(r.c.name, r.idxs) + "</span>"
      + (r.c.desc ? '<span class="pal-desc">' + esc(r.c.desc) + "</span>" : "")
      + '<span class="pal-key">' + keysHTML(r.c.keys) + "</span></div>";
  });
  list.innerHTML = html;
  list.querySelectorAll("[data-i]").forEach(el => {
    el.addEventListener("mousemove", () => { paletteSel = +el.dataset.i; markPaletteSel(); });
    el.addEventListener("click", () => { paletteSel = +el.dataset.i; runPaletteSel(); });
  });
}
function markPaletteSel() {
  const list = $("#palette-list");
  list.querySelectorAll(".pal-row").forEach((el, i) => el.classList.toggle("sel", i === paletteSel));
  const sel = list.querySelector(".pal-row.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}
function movePaletteSel(d) {
  if (!paletteResults.length) return;
  paletteSel = (paletteSel + d + paletteResults.length) % paletteResults.length;
  markPaletteSel();
}
function runPaletteSel() { const r = paletteResults[paletteSel]; if (r) r.c.run(); }
function openPalette() {

function onSetting(key, val) {
  if (key === "tabSize") val = +val;
  if (key === "conv-enabled") { settings.conventions.enabled = !settings.conventions.enabled; renderSettingsBody(); return; }
  if (key === "conv-default") { settings.conventions.default = val; renderSettingsBody(); return; }
  if (key.indexOf("conv-blk-") === 0) { const c = key.slice(9); settings.conventions.blocking[c] = !settings.conventions.blocking[c]; renderSettingsBody(); return; }
  if (key === "obsidian-enabled") { settings.obsidian.enabled = !settings.obsidian.enabled; renderSettingsBody(); return; }

  settings[key] = val;
  refreshFromSettings();
  renderSettingsBody();
}
function wireSettingsBody() {
  const body = $("#settings-body");
  body.querySelectorAll(".seg-control[data-key]").forEach(seg => {
    seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => onSetting(seg.dataset.key, b.dataset.val)));
  });
  body.querySelectorAll(".set-toggle[data-key]").forEach(t => {
    t.addEventListener("click", () => { const k = t.dataset.key; onSetting(k, typeof settings[k] === "boolean" ? !settings[k] : true); });
  });
  body.querySelectorAll("[data-theme-pick]").forEach(el => el.addEventListener("click", () => { settings.theme = el.dataset.themePick; refreshFromSettings(); renderSettingsBody(); }));
  const name = $("#set-name");
  if (name) name.addEventListener("input", () => { settings.displayName = name.value || autoName(); updateCrumb(); });
  const regen = $("#set-name-regen");
  if (regen) regen.addEventListener("click", () => { settings.displayName = autoName(); renderSettingsBody(); updateCrumb(); });
  const storagePath = $("#set-storage-path");
  if (storagePath) storagePath.addEventListener("input", () => { settings.storagePath = storagePath.value; });
  const obsVault = $("#set-obs-vault");
  if (obsVault) obsVault.addEventListener("input", () => { settings.obsidian.vaultPath = obsVault.value; });
  const obsFolder = $("#set-obs-folder");

  const obsFilename = $("#set-obs-filename");

function obsidianFrontmatter() {
  const verdictName = { comment: "comment", approve: "approve", request: "request_changes" }[state.verdict] || "comment";
  const fname = settings.obsidian.filenameFormat
    .replace("{date}", new Date().toISOString().slice(0, 10))
    .replace("{plan}", "session-persistence")
    .replace("{verdict}", verdictName);
  return "---\n"
    + "title: Plan review — Session Persistence\n"
    + "file: " + settings.obsidian.folder + "/" + fname + ".md\n"
    + "reviewer: " + settings.displayName + "\n"
    + "verdict: " + verdictName + "\n"
    + "annotations: " + pendingCount() + "\n"
    + "tags: [cueloop, review, plan]\n"
    + "---";
}

  if (settings.obsidian.enabled) saveToObsidian();

}

  if (settings.defaultSaveAction === "obsidian") return saveToObsidianOrHint();
  if (settings.defaultSaveAction === "download") return flash("Annotations downloaded → " + settings.displayName + ".json");

}

function setInput(mode) {
  state.inputMode = mode;
  $("#app").dataset.input = mode;
  document.querySelectorAll("#input-seg button").forEach(b => {
    const on = b.dataset.input === mode;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  updateModeHint();
}
function contentPrimary() {
  if (state.inputMode === "comment") { startComment(); return; }
  if (state.inputMode === "redline") { markRedline(); return; }
  const note = firstNoteOnRow(state.active, state.cursors[state.active] || 0);
  if (note) { setFocused(note.id); renderRail(); applyAnchorFocus(); }
}

/* ═══════════ Status / cheat ═══════════ */
let statusTimer = null;
function flash(msg) {
  const el = $("#status"); el.textContent = msg; el.classList.add("show");
  clearTimeout(statusTimer); statusTimer = setTimeout(() => el.classList.remove("show"), 2400);
}
function renderCheat() {
  const cols = $("#cheat-cols");
  const colHTML = groups => groups.map(([group, rows]) =>
    '<div class="cheat-group">' + group + "</div>" + rows.map(([label, keys]) =>
      '<div class="cheat-row"><span>' + esc(label) + '</span><span class="keys">' + keys.map(k => "<kbd>" + esc(k) + "</kbd>").join("") + "</span></div>").join("")).join("");
  cols.innerHTML = "<div>" + colHTML([KEYS[0], KEYS[4]]) + "</div><div>" + colHTML([KEYS[1]]) + "</div><div>" + colHTML([KEYS[2], KEYS[3]]) + "</div>";
}
function toggleCheat() { $("#cheat").classList.toggle("show"); }

/* ═══════════ Render all ═══════════ */

function renderAll() {
  syncFocus(); syncView();
  renderSpaces();
  renderSidebar();
  if (state.mode === "guided") renderGuided(); else renderContent();
  renderRail();
  renderFinishPanel();
  if (state.rightTab === "agent") renderAgent();
  renderRightMeta();
  applyAnchorFocus();
}

/* ═══════════ Keyboard ═══════════ */

document.addEventListener("keydown", e => {
  const meta = e.metaKey || e.ctrlKey;
  const typing = /^(TEXTAREA|INPUT)$/.test(e.target.tagName);

  // command palette scope
  if (paletteOpen) {
    if (e.key === "Escape") { e.preventDefault(); closePalette(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); movePaletteSel(1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); movePaletteSel(-1); return; }
    if (e.key === "Enter") { e.preventDefault(); runPaletteSel(); return; }
    return;
  }
  // settings scope
  if (settingsOpen) {
    if (e.key === "Escape" || (meta && e.key === ",")) { e.preventDefault(); closeSettings(); return; }
    return;
  }
  // global surface openers
  if (meta && (e.key === "k" || e.key === "K")) { e.preventDefault(); openPalette(); return; }
  if (meta && e.key === ",") { e.preventDefault(); openSettings(); return; }
  if (meta && (e.key === "s" || e.key === "S")) {
    e.preventDefault();
    performSave();
    return;
  }

  if (state.submitted) { if (e.key === "Escape") dismissConfirm(); return; }

  if (!typing && e.key === "/") { e.preventDefault(); openPalette(); return; }

  if (typing) {
    if (e.key === "Enter" && meta) {
      e.preventDefault();
      if (e.target.id === "parent-comment") { submitReview(); return; }
      if (e.target.id === "suggest-input") { saveSuggestion(); return; }
      if (e.target.id === "edit-input") { saveEdit(); return; }
      if (e.target.id === "composer-input") { saveComposer(); return; }
      return;
    }
    if (e.target.id === "suggest-input") { if (e.key === "Escape") { e.preventDefault(); cancelSuggestion(); return; } return; }
    if (e.target.id === "edit-input") {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); return; }
      if (e.key === "Escape") { e.preventDefault(); cancelEdit(); return; }
    }
    return;
  }

  if ($("#cheat").classList.contains("show")) { if (e.key === "?" || e.key === "Escape") toggleCheat(); return; }
  if (e.key === "?") { e.preventDefault(); toggleCheat(); return; }

  // ⌘⏎ reveals the Feedback pane + focuses the summary; a second ⌘⏎ (in the summary) submits atomically
  if (e.key === "Enter" && meta) { e.preventDefault(); openPanel(true); return; }

  // verdict selector in the Feedback pane
  if (!e.altKey && (e.key === "1" || e.key === "2" || e.key === "3") && feedbackActive()) {
    e.preventDefault();
    state.verdict = { "1": "comment", "2": "approve", "3": "request" }[e.key];
    renderFinishPanel(); renderRightMeta();
    flash("verdict · " + { comment: "Comment", approve: "Approve", request: "Request changes" }[state.verdict]);
    return;
  }

  if (e.key === "z" && meta) { e.preventDefault(); undo(); return; }

  // preset labels: Alt+1..5
  if (e.altKey && /^[1-5]$/.test(e.key)) { e.preventDefault(); applyTag(+e.key - 1); return; }

  if (e.key === "t") { cycleTab(); return; }
  if (e.key === "w") {
    if (state.mode === "focus") { flash("Spaces panel is hidden in Focus mode"); return; }
    state.focusZone = "nav"; state.navCursor = navItemsList().findIndex(it => it.kind === "ss" && it.id === state.activeSession);
    if (state.navCursor < 0) state.navCursor = 0;
    syncFocus(); renderSpaces();
    flash("Spaces · j / k move · ⏎ open · esc back");
    return;
  }
  if (e.key === "f") {
    if (state.mode === "focus") { flash("Side panels are hidden in Focus mode"); return; }
    toggleRightTab(); flash(state.rightTab === "agent" ? "Agent panel" : "Review panel");
    return;
  }
  if (e.key === "a") {
    if (state.mode === "focus") { flash("Side panels are hidden in Focus mode"); return; }
    switchRightTab("agent");
    const ai = $("#ag-input"); if (ai) ai.focus();
    flash("Agent panel · preview");
    return;
  }
  if (e.key === "]") { e.preventDefault(); jumpFile(1); return; }
  if (e.key === "[") { e.preventDefault(); jumpFile(-1); return; }
  if (e.key === "v") { markViewedCurrent(); return; }
  if (e.key === "c") { e.preventDefault(); startComment(); return; }
  if (e.key === "C") { e.preventDefault(); startFileComment(); return; }
  if (e.key === "g") { e.preventDefault(); markLooksGood(); return; }
  if (e.key === "s") { e.preventDefault(); startSuggestion(); return; }
  if (e.key === "e") { e.preventDefault(); startEdit(); return; }
  if (e.key === "r") { e.preventDefault(); if (state.view === "versions") { state.versionDiffView = state.versionDiffView === "rendered" ? "raw" : "rendered"; renderAll(); } else markRedline(); return; }
  if (e.key === "n") { e.preventDefault(); if (state.mode === "guided") guidedStep(1); else jumpPending(1); return; }
  if (e.key === "p") { e.preventDefault(); if (state.mode === "guided") guidedStep(-1); else jumpPending(-1); return; }
  if (e.key === "x") {
    if (state.view === "all") { const id = changedFileIds[state.allCursor]; state.collapsed[id] = !state.collapsed[id]; flash(state.collapsed[id] ? "collapsed" : "expanded"); renderContent(); }
    else flash("x collapses files in the all-files view");
    return;
  }

  if (e.key === "Escape") {
    if (state.suggesting) { cancelSuggestion(); return; }
    if (composer) { cancelComposer(); renderContent(); renderRail(); return; }
    if (state.selAnchor !== null) { state.selAnchor = null; renderContent(); renderRail(); return; }
    if (state.focusedId) { setFocused(null); renderRail(); applyAnchorFocus(); return; }
    if (state.focusZone === "nav") { state.focusZone = "sidebar"; syncFocus(); renderSpaces(); return; }
    if (state.focusZone === "content") { state.focusZone = "sidebar"; syncFocus(); renderContent(); return; }
    return;
  }

  if (state.mode === "guided") {
    if (e.key === "Enter") { e.preventDefault(); guidedStep(1); return; }
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveContent(1, e.shiftKey); return; }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveContent(-1, e.shiftKey); return; }
    return;
  }

  if (state.view === "all" && state.focusZone === "content") {
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); allFilesStep(1); return; }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); allFilesStep(-1); return; }
    if (e.key === "Enter") { e.preventDefault(); openFile(changedFileIds[state.allCursor]); syncView(); renderAll(); return; }
    return;
  }

  if (state.focusZone === "nav") {
    const items = navItemsList();
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); state.navCursor = Math.min(items.length - 1, state.navCursor + 1); renderSpaces(); return; }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); state.navCursor = Math.max(0, state.navCursor - 1); renderSpaces(); return; }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); openNavItem(items[state.navCursor]); return; }
    return;
  }

  if (state.focusZone === "sidebar") {
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveSidebar(1); return; }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveSidebar(-1); return; }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); openItem(activeItems()[state.sidebarCursor]); return; }
    return;
  }

  // content-focused
  if (state.view === "versions") { return; }
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveContent(1, false); return; }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveContent(-1, false); return; }
  if (e.key === "J" || (e.shiftKey && e.key === "j")) { e.preventDefault(); moveContent(1, true); return; }
  if (e.key === "K" || (e.shiftKey && e.key === "k")) { e.preventDefault(); moveContent(-1, true); return; }
  if (e.key === "Tab") { e.preventDefault(); moveContent(e.shiftKey ? -1 : 1, false); return; }
  if (e.key === "Enter") { e.preventDefault(); contentPrimary(); return; }
});

/* ═══════════ Wire up ═══════════ */

$("#theme-btn").addEventListener("click", cycleTheme);
$("#settings-btn").addEventListener("click", openSettings);
$("#submit-btn").addEventListener("click", submitReview);
$("#spaces-collapse").addEventListener("click", toggleSpaces);
document.querySelectorAll("#rp-tabs [data-rtab]").forEach(b => b.addEventListener("click", () => switchRightTab(b.dataset.rtab)));
$("#confirm").addEventListener("click", e => { if (e.target.id === "confirm") dismissConfirm(); });
$("#cheat").addEventListener("click", e => { if (e.target.id === "cheat") toggleCheat(); });
$("#palette-wrap").addEventListener("click", e => { if (e.target.id === "palette-wrap") closePalette(); });
$("#settings-wrap").addEventListener("click", e => { if (e.target.id === "settings-wrap") closeSettings(); });
$("#palette-input").addEventListener("input", e => { paletteSel = 0; renderPalette(e.target.value); });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
document.querySelectorAll("#mode-seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.querySelectorAll("#input-seg button").forEach(b => b.addEventListener("click", () => { setInput(b.dataset.input); flash(b.querySelector(".label").textContent.toLowerCase() + " mode"); }));
$("#spaces").addEventListener("mousedown", () => { if (state.focusZone !== "nav") { state.focusZone = "nav"; syncFocus(); } });
$("#sidebar").addEventListener("mousedown", () => { if (state.focusZone !== "sidebar") { state.focusZone = "sidebar"; syncFocus(); renderSpaces(); } });
$("#scroller").addEventListener("mousedown", () => { if (state.focusZone !== "content") { state.focusZone = "content"; syncFocus(); renderSpaces(); } });
$("#content").addEventListener("click", e => {
  if (e.target.id === "open-versions") { setTab("versions"); return; }
  if (e.target.id === "orphan-jump") { setTab("versions"); return; }
});

/* ═══════════ Seed & init ═══════════ */

(function seed() {
  // a comment on a plan passage revised in v2 — re-anchors, stays attached (conventional label)
  addAnnotation({ item: "plan", blockId: "p-p1", blockIdEnd: "p-p1", type: "comment", convention: "question",
    text: "Do we fsync the directory after the rename? On ext4 the rename itself can still be lost on power failure." });
  // a looks-good marker on the recovery heading
  addAnnotation({ item: "plan", blockId: "h-p2", blockIdEnd: "h-p2", type: "looksgood", text: "Read-only recovery is the right call." });
  // a preset label on a plan bullet
  addAnnotation({ item: "plan", blockId: "li-2", blockIdEnd: "li-2", type: "label", tag: "nit",
    text: "SCHEMA_VERSION as a string — any reason not to use a number?" });
  // a blocking file-scoped comment
  addAnnotation({ item: "plan", fileScope: true, type: "comment", convention: "issue", blocking: true,
    text: "One blocking concern: durability of the atomic rename (see the fsync question). Please confirm before proceeding." });
  // a comment on a v1 open question the agent RESOLVED in v2 — orphaned in v2, reattachable in v1
  addAnnotation({ item: "plan", blockId: "oq-2", blockIdEnd: "oq-2", type: "comment",
    text: "Agreed — an append-only journal is cleaner. One file per session loses the ordering of annotations across a crash." });
  // a diff comment anchored by stable line index (the revision line in store.ts)
  const revLi = FILES.store.lines.findIndex(l => l.text && l.text.indexOf("revision:") >= 0);
  addAnnotation({ item: "store", startLi: revLi, endLi: revLi, type: "comment", convention: "suggestion",
    text: "Bumping revision here is nice, but nothing reads it yet — wire it into the Phase 2 recovery summary." });
  // a code suggestion on the renameSync import in store.ts
  const impLi = FILES.store.lines.findIndex(l => l.text && l.text.indexOf('import { renameSync } from "node:fs";') >= 0);
  addAnnotation({ item: "store", startLi: impLi, endLi: impLi, type: "suggestion",
    oldCode: 'import { renameSync } from "node:fs";',
    suggestion: 'import { renameSync, openSync, fsyncSync, closeSync } from "node:fs";',
    text: "Need fsync on the directory to make the rename durable." });
  state.undoStack = [];
})();

renderTagLegend();
applyTheme();
document.documentElement.style.setProperty("--grain", settings.grain);
document.documentElement.style.setProperty("--diff-mono", monoStack(settings.monoFont));
updateTextureBtn();
renderCheat();
$("#app").dataset.spaces = settings.spacesCollapsed ? "collapsed" : "expanded";
$("#spaces-collapse").textContent = settings.spacesCollapsed ? "»" : "«";
switchRightTab(state.rightTab);
setInput("select");
setMode("workspace");
renderAll();
flash("Spaces (w) · Status/Tree/Versions · Review/Agent (f) · ⌘K commands · ? for all keys");
})();
</script>
</body>
