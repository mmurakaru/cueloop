<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cueloop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../round2/tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  :root { --diff-mono: var(--mono); }

  /* high-contrast curated theme */
  [data-theme="contrast"] {
    --bg:#000000; --panel:#080808; --elevated:#141414; --overlay:#161616;
    --border:rgba(255,255,255,0.30); --border-strong:rgba(255,255,255,0.55);
    --text:#ffffff; --text-muted:#e6e6e6; --text-dim:#9aa0aa;
    --accent:#ffb3b3; --accent-hover:#ffc9c9; --accent-tint:rgba(255,179,179,0.20); --accent-ink:#160000;
    --green:#5cff7a; --green-tint:rgba(92,255,122,0.20); --red:#ff7a7a; --red-tint:rgba(255,122,122,0.20);
    --blue:#9ec0ff; --dot:rgba(255,255,255,0.16); --shadow:0 8px 40px rgba(0,0,0,0.85);
  }

  /* ── App shell ─────────────────────────────── */
  #app { display: grid; grid-template-rows: 50px 38px 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }

  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #crumb { font-family: var(--mono); font-size: 12px; color: var(--text-muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #crumb b { color: var(--text); font-weight: 500; }
  #crumb .sep { color: var(--text-dim); margin: 0 3px; }
  #crumb .cbadge { font-family: var(--mono); font-size: 10px; color: var(--accent); border: 1px solid rgba(245,163,163,0.3); border-radius: var(--r-sm); padding: 1px 5px; margin-left: 6px; }

  .segmented { display: flex; background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); padding: 2px; gap: 2px; }
  .segmented button {
    font-family: var(--sans); font-size: 12px; color: var(--text-muted);
    background: none; border: none; border-radius: var(--r-sm);
    padding: 4px 11px; cursor: pointer; white-space: nowrap;
    transition: background .12s var(--ease), color .12s var(--ease);
  }
  .segmented button:hover { color: var(--text); }
  .segmented button.on { background: var(--accent-tint); color: var(--accent); }

  .hbtn {
    font-family: var(--mono); font-size: 12px;
    border-radius: var(--r); padding: 6px 11px; cursor: pointer;
    border: 1px solid var(--border); background: var(--elevated); color: var(--text-muted);
    white-space: nowrap; transition: all .14s var(--ease);
  }
  .hbtn:hover { color: var(--text); border-color: var(--border-strong); }
  #textured-btn.on, #settings-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
  #settings-btn, #palette-btn, #theme-btn { padding: 6px 9px; }
  #theme-btn { font-size: 13px; line-height: 1; }
  #palette-btn { color: var(--text-dim); }

  #status {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    opacity: 0; transition: opacity .3s var(--ease); white-space: nowrap;
    max-width: 280px; overflow: hidden; text-overflow: ellipsis;
  }
  #status.show { opacity: 1; }

  /* ── Mode bar (input tools) ────────────────── */
  #modebar { display: flex; align-items: center; gap: 14px; padding: 0 16px 0 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  /* input-mode controls: a connected segmented group where the ACTIVE mode is
     expanded (icon + accent-outlined label) and the rest are icon-only. Switching
     modes animates the label/width open on the new mode and closed on the old one,
     so exactly one segment is ever expanded — no layout jump. */
  #input-seg {
    display: inline-flex; align-items: center; gap: 3px; flex: none;
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 3px;
  }
  #input-seg .tool-btn {
    font-size: 12px; gap: 0; padding: 5px 8px;
    background: transparent; border-color: transparent; border-radius: var(--r);
    transition: background-color .18s var(--ease-standard), color .18s var(--ease-standard),
                border-color .18s var(--ease-standard), padding .18s var(--ease-out);
  }
  #input-seg .tool-btn .ig { font-family: var(--mono); font-size: 12px; line-height: 1; }
  #input-seg .tool-btn:hover { background: var(--overlay); color: var(--text); border-color: transparent; }
  #input-seg .tool-btn.active { padding: 6px 11px; color: var(--accent); background: var(--accent-tint); border-color: var(--accent); }
  /* label rides on .active only (icon-only otherwise): width via --ease-out, fade via --ease-standard */
  #input-seg .tool-btn .label { margin-left: 0; transition: max-width .18s var(--ease-out), opacity .15s var(--ease-standard), margin-left .18s var(--ease-out); }
  #input-seg .tool-btn:hover .label, #input-seg .tool-btn:focus-visible .label { max-width: 0; opacity: 0; }
  #input-seg .tool-btn.active .label { max-width: 140px; opacity: 1; margin-left: 6px; }
  .verb-legend { display: flex; gap: 10px; flex: none; }
  .verb-legend .vl { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  .verb-legend .vl kbd { font-size: 9px; padding: 0 4px; }
  .mb-hint { font-family: var(--mono); font-size: 11px; color: var(--text-dim); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mb-hint b { color: var(--text-muted); font-weight: 500; }
  .mb-hint kbd { margin: 0 1px; }
  .mb-right { display: flex; align-items: center; gap: 12px; flex: none; }
  .tag-legend { display: flex; gap: 9px; }
  .tag-legend .tl { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  .tag-legend .tl .tld { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .tag-legend .tl kbd { font-size: 9px; padding: 0 3px; }

  /* ── Lower: spaces · sidebar · stage · right pane ─ */
  #lower { display: flex; min-height: 0; }
  #app[data-mode="focus"] #spaces,
  #app[data-mode="focus"] #sidebar,
  #app[data-mode="focus"] #rightpane { display: none; }

  /* header brand */
  #brand { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--text); text-decoration: none; letter-spacing: 0.02em; flex: none; padding-right: 12px; margin-right: 2px; border-right: 1px solid var(--border); }
  #brand:hover { color: var(--accent); }

  /* ── Spaces panel (Workspaces → Sessions) ──── */
  #spaces {
    width: 224px; flex: none; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    transition: width .22s var(--ease-standard), box-shadow .15s var(--ease);
  }
  #app[data-spaces="collapsed"] #spaces { width: 52px; }
  #app[data-focus="nav"] #spaces { box-shadow: inset -2px 0 0 var(--accent); }
  #spaces-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px; }
  #spaces-top .sp-title { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; color: var(--text-dim); }
  #app[data-spaces="collapsed"] #spaces-top { justify-content: center; }
  #app[data-spaces="collapsed"] #spaces-top .sp-title { display: none; }
  #spaces-collapse { font-family: var(--mono); font-size: 12px; line-height: 1; color: var(--text-dim); background: none; border: 1px solid transparent; border-radius: var(--r-sm); padding: 2px 6px; cursor: pointer; transition: color .12s var(--ease), border-color .12s var(--ease); }
  #spaces-collapse:hover { color: var(--accent); border-color: var(--border); }
  #spaces-body { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
  .sp-group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; color: var(--text-dim); padding: 12px 8px 5px; }
  #app[data-spaces="collapsed"] .sp-group { text-align: center; padding: 12px 0 5px; }
  #app[data-spaces="collapsed"] .sp-group .sp-g-full { display: none; }

  .ws-item, .ss-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: var(--r);
    border: 1px solid transparent; cursor: pointer; user-select: none;
  }
  .ws-item + .ws-item, .ss-item + .ss-item { margin-top: 2px; }
  .ws-item:hover, .ss-item:hover { background: var(--elevated); }
  .ws-item.cursor, .ss-item.cursor { border-color: var(--border-strong); background: var(--elevated); }
  #app[data-focus="nav"] .ws-item.cursor, #app[data-focus="nav"] .ss-item.cursor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-tint); }
  .ws-item.on { background: var(--accent-tint); }
  .ws-item.on .ws-name { color: var(--text); }
  .ws-init {
    width: 24px; height: 24px; flex: none; border-radius: var(--r-sm);
    background: var(--elevated); border: 1px solid var(--border);
    color: var(--text-muted); font-family: var(--mono); font-size: 12px;
    display: flex; align-items: center; justify-content: center; text-transform: lowercase;
  }
  .ws-item.on .ws-init { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }
  .ws-text { flex: 1; min-width: 0; }
  .ws-name { font-family: var(--mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-branch { font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .ss-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 3px; }
  .ss-dot.working { background: #d9a441; }
  .ss-dot.pending { background: var(--blue); }
  .ss-dot.done { background: var(--green); }
  .ss-item.on { background: var(--accent-tint); }
  .ss-name { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ss-item.on .ss-name { color: var(--text); }
  #app[data-spaces="collapsed"] .ws-text, #app[data-spaces="collapsed"] .ss-name { display: none; }
  #app[data-spaces="collapsed"] .ws-item, #app[data-spaces="collapsed"] .ss-item { justify-content: center; padding: 7px 0; gap: 0; }
  #app[data-spaces="collapsed"] .ss-dot { width: 11px; height: 11px; margin: 4px 0; }

  /* ── Right pane (Feedback · Agent) ─────────── */
  #rightpane {
    width: 360px; flex: none; background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #rp-tabs { display: flex; gap: 2px; padding: 9px 10px; border-bottom: 1px solid var(--border); flex: none; }
  #rp-tabs button {
    flex: 1; font-family: var(--sans); font-size: 12px; color: var(--text-muted);
    background: none; border: 1px solid transparent; border-radius: var(--r);
    padding: 6px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background-color .15s var(--ease-standard), color .15s var(--ease-standard), border-color .15s var(--ease-standard);
  }
  #rp-tabs button:hover { color: var(--text); }
  #app[data-rtab="feedback"] #rp-tabs button[data-rtab="feedback"],
  #app[data-rtab="agent"] #rp-tabs button[data-rtab="agent"] { background: var(--elevated); border-color: var(--border); color: var(--text); }
  .rp-badge { min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); border: 1px solid rgba(245,163,163,0.3); font-family: var(--mono); font-size: 9.5px; font-weight: 600; display: none; align-items: center; justify-content: center; }
  .rp-preview { font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); border: 1px solid rgba(132,166,232,0.4); border-radius: var(--r-sm); padding: 1px 4px; }
  #rp-body { position: relative; flex: 1; min-height: 0; }
  #rp-feedback, #rp-agent {
    position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0;
    opacity: 0; visibility: hidden; transition: opacity .18s var(--ease-standard);
  }
  #app[data-rtab="feedback"] #rp-feedback { opacity: 1; visibility: visible; }
  #app[data-rtab="agent"] #rp-agent { opacity: 1; visibility: visible; }

  /* feedback: pending cards then inline finish */
  #rp-feedback-scroll { flex: 1; overflow-y: auto; min-height: 0; }
  #rail-cards { padding: 12px 14px 4px; position: static; }
  #rail-cards .card { position: static; left: auto; right: auto; margin: 0 0 8px; }
  .rail-empty.static, .rail-note.static { position: static; left: auto; right: auto; top: auto; }
  .rail-empty.static { padding: 4px 4px 8px; line-height: 1.65; }
  .rail-note.static { margin-top: 6px; padding: 8px 2px; }
  .fb-sub { font-family: var(--mono); font-size: 10px; color: var(--text-dim); padding: 10px 14px 2px; border-top: 1px solid var(--border); line-height: 1.5; }
  #finish-body { padding: 4px 14px 18px; }
  #rp-feedback-foot { flex: none; border-top: 1px solid var(--border); padding: 12px 14px; display: flex; align-items: center; gap: 10px; background: var(--panel); }
  #rp-feedback-foot .foot-hint { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); white-space: nowrap; }

  /* agent (preview) */
  .ag-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 11px; border-bottom: 1px solid var(--border); flex: none; }
  .ag-title { font-size: 13px; font-weight: 600; }
  .ag-connect { padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .ag-connect-lead { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; }
  .ag-provider { display: flex; flex-wrap: wrap; gap: 6px; }
  .ag-prov { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 11px; cursor: pointer; transition: color .12s var(--ease), border-color .12s var(--ease); }
  .ag-prov:hover { color: var(--text); border-color: var(--border-strong); }
  .ag-prov.on { background: var(--accent-tint); color: var(--accent); border-color: var(--accent); }
  .ag-connect-btn { align-self: flex-start; font-family: var(--mono); font-size: 12.5px; color: var(--accent-ink); background: var(--accent); border: none; border-radius: var(--r-lg); padding: 10px 16px; cursor: pointer; font-weight: 600; }
  .ag-connect-btn:hover { background: var(--accent-hover); }
  .ag-scroll { flex: 1; overflow-y: auto; padding: 14px 14px 6px; min-height: 0; }
  .ag-ctx { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.05em; color: var(--text-dim); border: 1px dashed var(--border-strong); border-radius: var(--r); padding: 6px 9px; margin-bottom: 14px; line-height: 1.5; }
  .ag-msg { margin-bottom: 14px; }
  .ag-who { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .ag-msg.user .ag-who { color: var(--accent); }
  .ag-bubble { font-size: 12.5px; line-height: 1.55; color: var(--text); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 9px 11px; }
  .ag-msg.user .ag-bubble { background: var(--accent-tint); border-color: rgba(245,163,163,0.3); }
  .ag-bubble .fname { color: var(--blue); }
  .ag-input-dock { flex: none; border-top: 1px solid var(--border); padding: 10px 12px; }
  #ag-input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); font: inherit; font-size: 12.5px; line-height: 1.5; padding: 8px 10px; resize: none; outline: none; }
  #ag-input:focus { border-color: var(--accent); }
  .ag-input-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .ag-via { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  .ag-send { font-family: var(--mono); font-size: 12px; color: var(--text); background: var(--elevated); border: 1px solid var(--border-strong); border-radius: var(--r); padding: 6px 14px; cursor: pointer; transition: color .12s var(--ease), border-color .12s var(--ease); }
  .ag-send:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Sidebar ──────────────────────────────── */
  #sidebar {
    width: 284px; flex: none;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
    transition: box-shadow .15s var(--ease);
  }
  #app[data-focus="sidebar"] #sidebar { box-shadow: inset 2px 0 0 var(--accent); }

  .tabs { display: flex; gap: 3px; padding: 13px 12px 10px; border-bottom: 1px solid var(--border); }
  .tabs button {
    flex: 1; font-family: var(--sans); font-size: 11.5px; color: var(--text-muted);
    background: none; border: 1px solid transparent; border-radius: var(--r);
    padding: 5px 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--elevated); border-color: var(--border); color: var(--text); }
  .tabs button .tb { font-family: var(--mono); font-size: 8.5px; color: var(--accent); border: 1px solid rgba(245,163,163,0.3); border-radius: 7px; padding: 0 4px; }

  #side-list { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
  .side-group {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em;
    color: var(--text-dim); padding: 12px 8px 5px; display: flex; justify-content: space-between;
  }
  .side-group .g-cnt { color: var(--text-dim); }

  .side-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: var(--r);
    border: 1px solid transparent; cursor: pointer; user-select: none;
  }
  .side-item.indent { margin-left: 14px; }
  .side-item + .side-item { margin-top: 1px; }
  .side-item:hover { background: var(--elevated); }
  .side-item.cursor { border-color: var(--border-strong); background: var(--elevated); }
  #app[data-focus="sidebar"] .side-item.cursor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-tint); }
  .side-item.open { background: var(--accent-tint); }
  .side-item.open .s-name { color: var(--text); }

  .s-check {
    width: 15px; height: 15px; flex: none; border-radius: 4px;
    border: 1.5px solid var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: transparent; transition: all .12s var(--ease);
  }
  .side-item.viewed .s-check { background: var(--green); border-color: var(--green); color: var(--accent-ink); }

  .s-name { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-item.viewed .s-name { color: var(--text-dim); }
  .side-item.ro .s-name { color: var(--text-dim); font-style: italic; }
  .s-stat { font-family: var(--mono); font-size: 10px; flex: none; }
  .s-stat .plus { color: var(--green); } .s-stat .minus { color: var(--red); } .s-stat .newf { color: var(--blue); } .s-stat .roflag { color: var(--text-dim); }
  .s-badge {
    flex: none; min-width: 17px; height: 17px; padding: 0 5px;
    border-radius: 9px; background: var(--accent-tint); color: var(--accent);
    border: 1px solid rgba(245,163,163,0.3);
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .s-badge.ver { background: var(--green-tint); color: var(--green); border-color: rgba(67,191,77,0.3); }

  /* "All changed files" entry */
  .side-all {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin: 2px 0 4px;
    border: 1px solid var(--border); border-radius: var(--r-lg); cursor: pointer; user-select: none;
  }
  .side-all:hover { border-color: var(--border-strong); }
  .side-all.open { border-color: var(--accent); background: var(--accent-tint); }
  .side-all.cursor { border-color: var(--border-strong); }
  #app[data-focus="sidebar"] .side-all.cursor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-tint); }
  .side-all .sa-glyph { font-family: var(--mono); color: var(--accent); font-size: 14px; line-height: 1; }
  .side-all .sa-main { flex: 1; }
  .side-all .sa-title { font-family: var(--sans); font-size: 12.5px; color: var(--text); }
  .side-all .sa-sub { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* Tree */
  .tree-controls { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px 4px; }
  .tree-controls .tc-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; color: var(--text-dim); }
  .tree-toggle { font-family: var(--mono); font-size: 10px; color: var(--text-muted); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 3px 7px; cursor: pointer; }
  .tree-toggle:hover { color: var(--text); border-color: var(--border-strong); }
  .tree-toggle.on { color: var(--accent); border-color: var(--accent); }
  .tree-row {
    display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: var(--r);
    border: 1px solid transparent; cursor: pointer; user-select: none;
  }
  .tree-row:hover { background: var(--elevated); }
  .tree-row.cursor { border-color: var(--border-strong); background: var(--elevated); }
  #app[data-focus="sidebar"] .tree-row.cursor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-tint); }
  .tree-row.open { background: var(--accent-tint); }
  .tree-caret { width: 11px; flex: none; color: var(--text-dim); font-size: 9px; text-align: center; transition: transform .12s var(--ease); }
  .tree-caret.collapsed { transform: rotate(-90deg); }
  .tree-caret.leaf { visibility: hidden; }
  .tree-ic { flex: none; font-size: 10px; width: 12px; text-align: center; color: var(--text-dim); }
  .tree-ic.folder { color: var(--accent); }
  .tree-name { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-row.dir .tree-name { color: var(--text); }
  .tree-row.viewed .tree-name { color: var(--text-dim); }
  .tree-row.ro .tree-name { color: var(--text-dim); }
  .tree-check { width: 13px; height: 13px; flex: none; border-radius: 3px; border: 1.5px solid var(--text-dim); display: flex; align-items: center; justify-content: center; font-size: 9px; color: transparent; }
  .tree-row.viewed .tree-check { background: var(--green); border-color: var(--green); color: var(--accent-ink); }

  /* Versions tab */
  .ver-lead { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; color: var(--text-dim); padding: 6px 6px 8px; }
  .ver-summary { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 9px 11px; margin: 0 4px 10px; line-height: 1.6; }
  .ver-summary .plus { color: var(--green); } .ver-summary .minus { color: var(--red); } .ver-summary .amber { color: var(--accent); }
  .ver-summary .vs-row { display: flex; gap: 7px; align-items: baseline; }
  .ver-summary .vs-tag { flex: none; width: 54px; color: var(--text-dim); }
  .ver-seg { display: flex; background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); padding: 2px; gap: 2px; margin: 0 4px 8px; }
  .ver-seg button { flex: 1; font-family: var(--mono); font-size: 11px; color: var(--text-muted); background: none; border: none; border-radius: var(--r-sm); padding: 5px; cursor: pointer; }
  .ver-seg button.on { background: var(--accent-tint); color: var(--accent); }
  .ver-item {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; margin: 3px 4px;
    border: 1px solid var(--border); border-radius: var(--r-lg); cursor: pointer; user-select: none;
  }
  .ver-item:hover { border-color: var(--border-strong); }
  .ver-item.cursor { border-color: var(--border-strong); }
  #app[data-focus="sidebar"] .ver-item.cursor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-tint); }
  .ver-item.on { border-color: var(--accent); background: var(--accent-tint); }
  .ver-item .vi-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid var(--text-dim); }
  .ver-item.on .vi-dot { background: var(--accent); border-color: var(--accent); }
  .ver-item .vi-main { flex: 1; }
  .ver-item .vi-name { font-family: var(--mono); font-size: 12px; color: var(--text); }
  .ver-item .vi-sub { font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); margin-top: 2px; }

  #side-progress { border-top: 1px solid var(--border); padding: 12px 16px 14px; }
  #side-progress .p-label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 7px; }
  #pbar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  #pbar-fill { height: 100%; width: 0; background: var(--green); border-radius: 2px; transition: width .28s var(--ease); }

  /* ── Stage ─────────────────────────────────── */
  #scroller { flex: 1; min-width: 0; overflow-y: auto; min-height: 0; }
  #canvas { position: relative; display: flex; justify-content: center; min-height: 100%; }
  .center-col { width: 760px; max-width: min(760px, 100%); padding: 32px 44px 45vh; }
  #app[data-width="compact"] .center-col { width: 660px; }
  #app[data-width="default"] .center-col { width: 760px; }
  #app[data-width="wide"] .center-col { width: 900px; }
  #app[data-mode="focus"] .center-col { width: 860px; }

  /* guided progress strip */
  #guided-strip { display: none; margin-bottom: 26px; }
  #app[data-mode="guided"] #guided-strip {
    display: block; position: sticky; top: 0; z-index: 4;
    margin: -32px -44px 26px; padding: 18px 44px 16px;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  #guided-strip .g-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  #guided-strip .g-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent); }
  #guided-strip .g-count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  #gbar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  #gbar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .3s var(--ease); }
  #guided-strip .g-hint { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 8px; }
  #guided-strip .g-hint kbd { margin: 0 1px; }

  /* ── Plan typography ──────────────────────── */
  .plan .doc-meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.03em; color: var(--text-dim); margin: -4px 0 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .plan .doc-meta b { color: var(--text-muted); font-weight: 500; }
  .plan .doc-meta .rev-badge { font-family: var(--mono); font-size: 10px; color: var(--green); border: 1px solid rgba(67,191,77,0.3); border-radius: var(--r-sm); padding: 1px 6px; cursor: pointer; }
  .plan .doc-meta .rev-badge:hover { background: var(--green-tint); }
  .orphan-banner { display: flex; align-items: center; gap: 9px; border: 1px solid rgba(245,163,163,0.35); background: var(--accent-tint); border-radius: var(--r-lg); padding: 8px 12px; margin-bottom: 20px; font-size: 12px; color: var(--accent); }
  .orphan-banner .ob-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .orphan-banner a { color: var(--accent); text-decoration: underline; cursor: pointer; margin-left: auto; }

  .row { position: relative; border-radius: var(--r-sm); }
  .plan .row { padding: 3px 12px; margin: 0 -12px; }
  .row.cursor { background: var(--accent-tint); }
  #app[data-focus="content"] .row.cursor::before,
  .row.sel::before {
    content: ""; position: absolute; left: -2px; top: 3px; bottom: 3px;
    width: 2px; border-radius: 2px; background: var(--accent);
  }
  .row.sel { background: var(--accent-tint); }
  .row.has-note::after { content: ""; position: absolute; right: 2px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .row.liked::after { background: var(--green); }
  .row.anchor-focus { background: var(--accent-tint); box-shadow: inset 2px 0 0 var(--accent); }
  .row.guided-dim { opacity: 0.4; }
  .row.flash { animation: rowflash .9s var(--ease); }
  @keyframes rowflash { 0%,35% { background: var(--accent-tint); } 100% { background: transparent; } }

  .plan h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; margin: 0; }
  .plan h2 { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .plan .row:has(h2) { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--border); }
  .plan p { margin: 0; line-height: 1.65; color: var(--text); }
  .plan .li, .plan .oli { display: flex; gap: 10px; line-height: 1.6; }
  .plan .marker { color: var(--text-dim); font-family: var(--mono); flex: none; }
  .fname { font-family: var(--mono); font-size: 0.9em; color: var(--blue); }
  .codewrap { background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-lg); margin: 4px 0; overflow-x: auto; }
  .codewrap .row { padding: 2px 16px; margin: 0; border-radius: 0; }
  .codewrap pre { margin: 0; }
  .codewrap code { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--text-muted); white-space: pre; }
  .tok-kw { color: var(--accent); } .tok-ty { color: var(--green); } .tok-pr { color: var(--text-muted); }
  /* keep the existing code-block frame when the plan container also carries .prose */
  .plan.prose .codewrap pre { margin: 0; padding: 0; background: none; border: 0; border-radius: 0; }
  /* config table lives in the plan flow; give its toolbar room above the header row */
  .plan.prose .table-wrap { margin: 4px 0 16px; }
  .plan.prose .table-tools { top: -30px; }

  /* inline redline */
  .plan .row.redlined p, .plan .row.redlined h1,
  .plan .row.redlined .li > span:last-child, .plan .row.redlined .oli > span:last-child {
    text-decoration: line-through; text-decoration-color: var(--red); color: var(--red);
  }
  .diff .row.redlined .txt { text-decoration: line-through; opacity: .78; }

  /* inline suggestion (proposed replacement) */
  .suggestion-block { margin: 3px 0 8px; border: 1px solid rgba(98,217,107,0.5); border-radius: var(--r); overflow: hidden; background: var(--green-tint); }
  .suggestion-block.focused { box-shadow: 0 0 0 1px var(--green); }
  .suggestion-block .sb-head { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--green); padding: 3px 12px; border-bottom: 1px solid rgba(98,217,107,0.3); }
  .suggestion-block pre { margin: 0; padding: 3px 12px; overflow-x: auto; }
  .suggestion-block .sb-old code { font-family: var(--mono); font-size: 12px; color: var(--red); text-decoration: line-through; white-space: pre; }
  .suggestion-block .sb-new code { font-family: var(--mono); font-size: 12px; color: var(--green); white-space: pre; }
  .suggest-editor { margin: 3px 0 8px; border: 1px solid var(--green); border-radius: var(--r); overflow: hidden; }
  .suggest-editor .se-head { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--green); padding: 3px 12px; background: var(--green-tint); }
  .suggest-editor textarea { width: 100%; background: var(--bg); color: var(--text); border: none; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12.5px; line-height: 1.6; padding: 8px 12px; resize: none; outline: none; }
  .suggest-editor .ed-hint { font-family: var(--mono); font-size: 10px; color: var(--text-dim); padding: 4px 12px; }
  .suggest-editor .ed-hint kbd { margin: 0 1px; }

  /* ── Diff ─────────────────────────────────── */
  .diff { font-family: var(--diff-mono, var(--mono)); font-size: 12.5px; --add-bg: var(--green-tint); --del-bg: var(--red-tint); }
  .diff[data-intensity="subtle"] { --add-bg: color-mix(in srgb, var(--green) 7%, transparent); --del-bg: color-mix(in srgb, var(--red) 7%, transparent); }
  .diff[data-intensity="strong"] { --add-bg: color-mix(in srgb, var(--green) 26%, transparent); --del-bg: color-mix(in srgb, var(--red) 26%, transparent); }
  .diff-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .diff-head .fpath { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .diff-head .fstat { font-size: 11px; font-family: var(--mono); }
  .diff-head .plus { color: var(--green); } .diff-head .minus { color: var(--red); } .diff-head .newf { color: var(--blue); }
  .diff-head .fc-btn { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px 7px; cursor: pointer; }
  .diff-head .fc-btn:hover { color: var(--accent); border-color: var(--accent); }

  .dline { display: grid; grid-template-columns: 40px 40px 16px 1fr; line-height: 1.75; }
  .diff .row { border-radius: 0; margin: 0; }
  .dline .gut { text-align: right; padding-right: 8px; color: var(--text-dim); font-size: 11px; user-select: none; }
  .dline .sign { color: var(--text-dim); user-select: none; text-align: center; }
  .dline .txt { white-space: pre; padding-right: 12px; tab-size: var(--tab-size, 2); -moz-tab-size: var(--tab-size, 2); overflow-x: hidden; }
  .dline.add { background: var(--add-bg); } .dline.add .sign, .dline.add .txt { color: var(--green); }
  .dline.del { background: var(--del-bg); } .dline.del .sign, .dline.del .txt { color: var(--red); }
  .dline.hunk { color: var(--blue); background: rgba(132,166,232,0.07); margin: 8px 0 2px; grid-template-columns: 1fr; }
  .dline.hunk .txt { color: var(--blue); padding-left: 12px; }
  .diff .row.cursor .dline { background: var(--accent-tint); }
  .diff .row.sel .dline { background: var(--accent-tint); }
  .diff .row.anchor-focus .dline { background: var(--accent-tint); }
  .dline .ws { color: var(--text-dim); opacity: 0.55; }
  .ic-del { background: rgba(255,107,107,0.30); border-radius: 2px; }
  .ic-add { background: rgba(67,191,77,0.32); border-radius: 2px; }

  /* line numbers off */
  .diff[data-style="unified"][data-linenums="off"] .dline:not(.hunk) { grid-template-columns: 16px 1fr; }
  .diff[data-style="unified"][data-linenums="off"] .dline .gut { display: none; }

  /* split style */
  .diff[data-style="split"] .dline:not(.hunk) { grid-template-columns: 40px 1fr 40px 1fr; }
  .diff[data-style="split"][data-linenums="off"] .dline:not(.hunk) { grid-template-columns: 1fr 1fr; }
  .diff[data-style="split"] .txt.c-add { background: var(--add-bg); color: var(--green); }
  .diff[data-style="split"] .txt.c-del { background: var(--del-bg); color: var(--red); }
  .diff[data-style="split"] .gut.mid, .diff[data-style="split"] .txt.mid { border-left: 1px solid var(--border); }

  /* expand-context gap */
  .dgap { display: grid; grid-template-columns: 96px 1fr; align-items: center; color: var(--text-dim); background: rgba(132,166,232,0.04); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .dgap .gut { text-align: center; color: var(--text-dim); }
  .dgap .gap-btn { font-family: var(--mono); font-size: 11px; color: var(--blue); cursor: pointer; padding: 3px 0; user-select: none; }
  .dgap .gap-btn:hover { color: var(--text); text-decoration: underline; }

  /* read-only preview */
  .ro-banner { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 8px 12px; margin-bottom: 14px; }
  .ro-banner .ro-lock { color: var(--text-muted); }
  .ro-code { font-family: var(--mono); font-size: 12.5px; line-height: 1.75; }
  .ro-code .rl { display: grid; grid-template-columns: 40px 1fr; }
  .ro-code .rl .gut { text-align: right; padding-right: 12px; color: var(--text-dim); font-size: 11px; user-select: none; }
  .ro-code .rl .txt { white-space: pre; color: var(--text-muted); }

  /* ── All-files continuous ─────────────────── */
  .all-head { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); margin: -32px -44px 20px; padding: 18px 44px 14px; }
  .all-title { font-size: 16px; font-weight: 600; }
  .all-prog { display: flex; align-items: center; gap: 12px; margin-top: 9px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .all-bar { flex: 1; max-width: 260px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .all-bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .28s var(--ease); }
  .all-hint { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 9px; }
  .afile { border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 16px; overflow: hidden; scroll-margin-top: 96px; }
  .afile.cur { border-color: var(--border-strong); }
  #app[data-focus="content"] .afile.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-tint); }
  .afile.viewed { opacity: 0.72; }
  .afile-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
  .afile.collapsed .afile-head { border-bottom: none; }
  .afile-caret { color: var(--text-dim); font-size: 10px; transition: transform .12s var(--ease); }
  .afile.collapsed .afile-caret { transform: rotate(-90deg); }
  .afile-check { width: 15px; height: 15px; flex: none; border-radius: 4px; border: 1.5px solid var(--text-dim); display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; }
  .afile.viewed .afile-check { background: var(--green); border-color: var(--green); color: var(--accent-ink); }
  .afile-name { flex: 1; font-family: var(--mono); font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .afile.viewed .afile-name { color: var(--text-muted); }
  .afile-stat { font-family: var(--mono); font-size: 10.5px; }
  .afile-stat .plus { color: var(--green); } .afile-stat .minus { color: var(--red); } .afile-stat .newf { color: var(--blue); }
  .afile-x { font-family: var(--mono); font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 1px 6px; }
  .afile-body { padding: 12px 16px; }
  .afile.collapsed .afile-body { display: none; }

  /* ── Version diff (content) ───────────────── */
  .ver-view .vv-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .ver-view .vv-title { font-size: 15px; font-weight: 600; }
  .ver-view .vv-sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .ver-view .vv-tools { margin-left: auto; }
  .mini-seg { display: flex; background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); padding: 1px; }
  .mini-seg button { font-family: var(--mono); font-size: 10px; color: var(--text-muted); background: none; border: none; border-radius: var(--r-sm); padding: 3px 7px; cursor: pointer; }
  .mini-seg button:hover { color: var(--text); }
  .mini-seg button.on { background: var(--accent-tint); color: var(--accent); }
  .vblock { position: relative; padding: 5px 12px 5px 14px; margin: 3px 0; border-radius: var(--r-sm); border-left: 2px solid transparent; }
  .vblock .vv-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; padding: 0 5px; border-radius: var(--r-sm); margin-left: 8px; vertical-align: middle; }
  .vblock.same { color: var(--text-muted); }
  .vblock.changed { background: var(--accent-tint); border-left-color: var(--accent); }
  .vblock.changed .vv-tag { color: var(--accent); border: 1px solid rgba(245,163,163,0.35); }
  .vblock.added { background: var(--green-tint); border-left-color: var(--green); }
  .vblock.added .vv-tag { color: var(--green); border: 1px solid rgba(67,191,77,0.35); }
  .vblock.removed { background: var(--red-tint); border-left-color: var(--red); }
  .vblock.removed .vv-tag { color: var(--red); border: 1px solid rgba(255,107,107,0.35); }
  .vblock.removed .vb-text { text-decoration: line-through; color: var(--red); opacity: 0.8; }
  .vb-h1 { font-size: 20px; font-weight: 600; }
  .vb-h2 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .vb-text { line-height: 1.6; }
  .vb-code { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; line-height: 1.7; display: block; }
  .vb-code .ln-del { color: var(--red); text-decoration: line-through; }
  .vb-code .ln-add { color: var(--green); }
  .ver-raw { font-family: var(--mono); font-size: 12.5px; }
  .ver-raw .rl { display: grid; grid-template-columns: 16px 1fr; line-height: 1.7; }
  .ver-raw .rl .sign { text-align: center; color: var(--text-dim); }
  .ver-raw .rl.add { background: var(--green-tint); } .ver-raw .rl.add .sign, .ver-raw .rl.add .txt { color: var(--green); }
  .ver-raw .rl.del { background: var(--red-tint); } .ver-raw .rl.del .sign, .ver-raw .rl.del .txt { color: var(--red); }
  .ver-raw .rl .txt { white-space: pre-wrap; }

  /* ── Inline edit editor ───────────────────── */
  .editor-inline { display: block; margin: 4px 0; }
  .editor-inline textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: var(--r);
    font-family: var(--sans); font-size: 14px; line-height: 1.55; padding: 8px 10px;
    resize: none; outline: none;
  }
  .editor-inline.code textarea { font-family: var(--mono); font-size: 12.5px; }
  .editor-inline .ed-hint { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .editor-inline .ed-hint kbd { margin: 0 1px; }

  /* ── Split (top mode) ─────────────────────── */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .split .split-pane { min-width: 0; padding: 0 20px; }
  .split .split-pane:first-child { border-right: 1px solid var(--border); padding-left: 0; }
  .split .split-pane:last-child { padding-right: 0; }
  .split .split-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--text-dim); margin-bottom: 14px; }
  .split .split-label.working { color: var(--accent); }

  /* ── Rail cards ───────────────────────────── */
  #rail-cards { position: relative; }
  .card {
    position: absolute; left: 20px; right: 20px;
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 10px 12px;
    font-size: 12.5px; cursor: pointer;
    transition: top .16s var(--ease), border-color .12s var(--ease), box-shadow .12s var(--ease);
  }
  .card.inline-composer { position: static; left: auto; right: auto; margin: 6px 0 4px; }
  .card:hover { border-color: var(--border-strong); }
  .card.focused { border-color: var(--accent); box-shadow: var(--shadow); }
  .card.composer { border-color: var(--accent); z-index: 6; cursor: default; }
  .card.orphan { border-color: rgba(245,163,163,0.5); border-style: dashed; }
  .card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .card-type { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--text-dim); }
  .card.is-edit .card-type { color: var(--green); }
  .card-badge { margin-left: auto; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.1em; color: var(--accent); border: 1px solid rgba(245,163,163,0.3); border-radius: var(--r-sm); padding: 1px 5px; }
  .card-badge.sent { color: var(--blue); border-color: rgba(132,166,232,0.4); }
  .card-badge.orphan { color: var(--red); border-color: rgba(255,107,107,0.4); }
  .card-loc { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-bottom: 5px; }
  .card-quote { color: var(--text-muted); font-size: 12px; line-height: 1.45; border-left: 2px solid var(--accent); padding-left: 9px; margin-bottom: 7px; }
  .card-quote.mono { font-family: var(--mono); font-size: 11px; }
  .card-body { color: var(--text); line-height: 1.5; white-space: pre-wrap; }
  .card-body:empty::before { content: "(click to add a note)"; color: var(--text-dim); font-style: italic; }
  .card-mini { font-size: 12px; line-height: 1.5; }
  .card-mini .m-del { color: var(--red); text-decoration: line-through; display: block; font-family: var(--mono); font-size: 11px; }
  .card-mini .m-ins { color: var(--green); display: block; font-family: var(--mono); font-size: 11px; }
  .card-reattach { font-family: var(--mono); font-size: 10px; color: var(--accent); cursor: pointer; margin-top: 6px; text-decoration: underline; }
  .card textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); font: inherit; line-height: 1.5; padding: 6px 8px; resize: none; outline: none; }
  .card textarea:focus { border-color: var(--accent); }
  .card-hint { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 6px; }
  .card-hint kbd { margin: 0 1px; }
  body.composing .card:not(.composer) { opacity: 0.4; }

  /* rich card type variants */
  .conv-chip { font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); border: 1px solid rgba(132,166,232,0.4); border-radius: var(--r-sm); padding: 1px 5px; }
  .blocking-chip { font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--red); border: 1px solid var(--red); border-radius: var(--r-sm); padding: 1px 5px; }
  .card.is-redline .card-type { color: var(--red); }
  .card.is-redline .card-quote { border-left-color: var(--red); color: var(--red); text-decoration: line-through; }
  .card.is-praise { border-color: rgba(98,217,107,0.4); }
  .card.is-praise .card-type { color: var(--green); }
  .card.is-praise .card-quote.green { border-left-color: var(--green); color: var(--text-muted); text-decoration: none; }
  .card.is-suggestion .card-type { color: var(--green); }
  .card.is-label .tag-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  .rail-empty { position: absolute; left: 22px; right: 22px; top: 40px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .rail-note { position: absolute; left: 20px; right: 20px; font-size: 11px; color: var(--text-dim); padding: 8px 2px; border-top: 1px solid var(--border); }

  /* composer conventions */
  .conv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 2px 0 8px; }
  .conv-opt { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 3px 7px; cursor: pointer; }
  .conv-opt.on { background: var(--accent-tint); color: var(--accent); border-color: var(--accent); }
  .conv-opt.none { color: var(--text-dim); }
  .blk-opt { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); background: var(--bg); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: 3px 7px; cursor: pointer; margin-left: auto; }
  .blk-opt.on { color: var(--red); border-color: var(--red); border-style: solid; background: var(--red-tint); }

  #connector { position: absolute; pointer-events: none; z-index: 3; display: none; }
  #connector .wire { position: absolute; height: 1px; background: var(--accent); opacity: 0.55; top: 0; left: 0; right: 0; }
  #connector .nub { position: absolute; left: -3px; top: -2.5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* ── Finish / review content (lives in the Feedback pane) ─ */
  .f-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; color: var(--text-dim); margin: 18px 0 8px; }
  .f-label:first-child { margin-top: 0; }
  #parent-comment { width: 100%; min-height: 66px; background: var(--elevated); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-lg); font: inherit; font-size: 13px; line-height: 1.5; padding: 9px 11px; resize: vertical; outline: none; }
  #parent-comment:focus { border-color: var(--accent); }
  .verdicts { display: flex; flex-direction: column; gap: 6px; }
  .verdict { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 9px 12px; cursor: pointer; transition: all .12s var(--ease); }
  .verdict:hover { background: var(--elevated); }
  .verdict .vdot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--text-dim); flex: none; display: flex; align-items: center; justify-content: center; }
  .verdict .vdot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .verdict.on { background: var(--accent-tint); border-color: var(--accent); }
  .verdict.on.v-approve { background: var(--green-tint); border-color: var(--green); }
  .verdict.on.v-changes { background: var(--red-tint); border-color: var(--red); }
  .verdict.on .vdot { border-color: var(--accent); }
  .verdict.on.v-approve .vdot { border-color: var(--green); }
  .verdict.on.v-changes .vdot { border-color: var(--red); }
  .verdict.on .vdot::after { background: var(--accent); }
  .verdict.on.v-approve .vdot::after { background: var(--green); }
  .verdict.on.v-changes .vdot::after { background: var(--red); }
  .verdict .vname { font-size: 13px; font-weight: 500; }
  .verdict .vdesc { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .verdict .vkey { margin-left: auto; }
  .fgroup { margin-bottom: 12px; }
  .fgroup-head { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .fgroup-head .cnt { color: var(--accent); }
  .fgroup-head.orphan .cnt { color: var(--red); }
  .fitem { border-left: 2px solid var(--border); margin: 5px 0 5px 5px; padding: 3px 0 3px 12px; }
  .fitem.orphan { border-left-color: var(--red); }
  .fitem .fexcerpt { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .fitem .fexcerpt .fex-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fitem .fbody { font-size: 12.5px; color: var(--text); margin-top: 2px; line-height: 1.45; }
  .fitem .fbody .plus { color: var(--green); } .fitem .fbody .minus { color: var(--red); }
  .fitem .fedit .plus { color: var(--green); } .fitem .fedit .minus { color: var(--red); }
  .fi-tag { font-family: var(--mono); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0 4px; color: var(--text-muted); flex: none; }
  .fi-tag.red { color: var(--red); border-color: var(--red); }
  .fi-tag.green { color: var(--green); border-color: rgba(98,217,107,0.5); }
  .fempty { font-size: 12.5px; color: var(--text-dim); font-style: italic; }
  #blocking-warn { display: flex; align-items: center; gap: 9px; border: 1px solid var(--red); background: var(--red-tint); border-radius: var(--r-lg); padding: 9px 12px; margin-bottom: 12px; font-size: 12.5px; color: var(--red); }
  #unviewed-warn { display: flex; align-items: center; gap: 9px; border: 1px solid rgba(245,163,163,0.35); background: var(--accent-tint); border-radius: var(--r-lg); padding: 9px 12px; margin-bottom: 14px; font-size: 12.5px; color: var(--accent); }
  #unviewed-warn .uv-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 2s var(--ease) infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  #submit-btn { flex: 1; font-family: var(--mono); font-size: 13px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: none; border-radius: var(--r-lg); padding: 11px; cursor: pointer; }
  #submit-btn:hover { background: var(--accent-hover); }
  #submit-btn.approve { background: var(--green); } #submit-btn.approve:hover { filter: brightness(1.05); }

  /* quiet confirmation */
  #confirm { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); }
  #confirm.show { display: flex; }
  .confirm-card { background: var(--overlay); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 24px 28px; width: 420px; max-width: 92vw; text-align: center; }
  .confirm-card .cc-mark { width: 40px; height: 40px; margin: 0 auto 14px; border-radius: 50%; border: 1.5px solid var(--green); color: var(--green); font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .confirm-card h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  .confirm-card .cc-sub { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .confirm-card .cc-verdict { display: inline-block; margin-top: 16px; font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; color: var(--text-muted); }
  .confirm-card .cc-verdict b { color: var(--accent); font-weight: 600; }
  .confirm-card .cc-esc { margin-top: 16px; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }

  /* ── Command palette ──────────────────────── */
  #palette-wrap { position: fixed; inset: 0; z-index: 90; display: none; align-items: flex-start; justify-content: center; background: rgba(0,0,0,0.4); }
  #palette-wrap.show { display: flex; }
  #palette { margin-top: 11vh; width: 560px; max-width: 92vw; background: var(--overlay); border: 1px solid var(--border-strong); border-radius: var(--r-xl); box-shadow: var(--shadow); overflow: hidden; }
  #palette-input { width: 100%; background: none; border: none; outline: none; color: var(--text); font-family: var(--sans); font-size: 15px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  #palette-input::placeholder { color: var(--text-dim); }
  #palette-list { max-height: 344px; overflow-y: auto; padding: 6px; }
  .pal-group { font-family: var(--mono); font-size: 9px; letter-spacing: 0.13em; color: var(--text-dim); padding: 10px 12px 4px; }
  .pal-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r); cursor: pointer; }
  .pal-row .pal-ico { width: 18px; text-align: center; color: var(--text-dim); font-size: 13px; flex: none; }
  .pal-row .pal-name { flex: 1; font-size: 13px; color: var(--text); }
  .pal-row .pal-name b { color: var(--accent); font-weight: 600; }
  .pal-row .pal-desc { font-size: 11px; color: var(--text-dim); margin-right: 4px; }
  .pal-row .pal-key { display: flex; gap: 3px; }
  .pal-row.sel { background: var(--accent-tint); }
  .pal-row.sel .pal-ico { color: var(--accent); }
  .pal-empty { padding: 26px; text-align: center; color: var(--text-dim); font-size: 12.5px; }
  #palette-foot { border-top: 1px solid var(--border); padding: 8px 14px; display: flex; gap: 16px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  #palette-foot span { display: flex; align-items: center; gap: 5px; }

  /* ── Settings dialog ──────────────────────── */
  #settings-wrap { position: fixed; inset: 0; z-index: 85; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); }
  #settings-wrap.show { display: flex; }
  #settings { width: 736px; max-width: 94vw; height: 566px; max-height: 88vh; background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--r-xl); box-shadow: var(--shadow); display: grid; grid-template-columns: 188px 1fr; overflow: hidden; }
  #settings-nav { border-right: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  #settings-nav .sn-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--text-dim); padding: 2px 10px 12px; }
  .sn-item { font-size: 13px; color: var(--text-muted); padding: 8px 12px; border-radius: var(--r); cursor: pointer; display: flex; align-items: center; gap: 9px; }
  .sn-item:hover { background: var(--elevated); color: var(--text); }
  .sn-item.on { background: var(--accent-tint); color: var(--accent); }
  .sn-item .sn-ico { width: 15px; text-align: center; opacity: 0.85; }
  #settings-main { display: flex; flex-direction: column; min-height: 0; }
  #settings-head { padding: 17px 24px 13px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 10px; }
  #settings-head h3 { font-size: 15px; font-weight: 600; margin: 0; }
  #settings-head .sh-sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  #settings-head .sh-close { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  #settings-body { flex: 1; overflow-y: auto; padding: 20px 24px 28px; }
  .set-field { margin-bottom: 22px; }
  .set-field .sf-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
  .set-field .sf-help { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5; }
  .seg-control { display: inline-flex; background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); padding: 2px; gap: 2px; flex-wrap: wrap; }
  .seg-control button { font-family: var(--sans); font-size: 12px; color: var(--text-muted); background: none; border: none; border-radius: var(--r-sm); padding: 5px 12px; cursor: pointer; }
  .seg-control button:hover { color: var(--text); }
  .seg-control button.on { background: var(--accent-tint); color: var(--accent); }
  .set-input { background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-family: var(--sans); font-size: 13px; padding: 8px 11px; outline: none; width: 264px; }
  .set-input:focus { border-color: var(--accent); }
  .set-toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-size: 13px; color: var(--text); }
  .set-switch { width: 38px; height: 22px; border-radius: 11px; background: var(--border-strong); position: relative; transition: background .15s var(--ease); flex: none; }
  .set-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); transition: transform .16s var(--ease); }
  .set-toggle.on .set-switch { background: var(--accent); }
  .set-toggle.on .set-switch::after { transform: translateX(16px); background: var(--accent-ink); }
  .set-row { display: flex; align-items: center; gap: 14px; }
  .set-slider { width: 220px; accent-color: var(--accent); }
  .slider-val { font-family: var(--mono); font-size: 12px; color: var(--text-muted); min-width: 34px; }
  .theme-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .theme-card { width: 118px; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; cursor: pointer; }
  .theme-card:hover { border-color: var(--border-strong); }
  .theme-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .theme-prev { height: 56px; padding: 8px; display: flex; flex-direction: column; gap: 5px; justify-content: center; }
  .theme-prev .tp-bar { height: 6px; border-radius: 3px; }
  .theme-name { font-size: 11.5px; padding: 7px 9px; color: var(--text); border-top: 1px solid var(--border); }
  .kb-table { width: 100%; border-collapse: collapse; }
  .kb-table td { padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-muted); }
  .kb-table td.k { text-align: right; width: 170px; }
  .kb-table td.k kbd { margin-left: 3px; }
  .kb-table tr.kb-group td { color: var(--accent); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; padding-top: 16px; border: none; }
  .obs-preview { font-family: var(--mono); font-size: 11.5px; line-height: 1.65; color: var(--text-muted); background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); padding: 11px 13px; margin: 0; white-space: pre-wrap; width: 340px; max-width: 100%; }
  .set-field code { font-family: var(--mono); font-size: 0.92em; color: var(--accent); }
  .set-subhead { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  .set-subhead.sep { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 4px; }

  /* ── Cheat sheet ──────────────────────────── */
  #cheat { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; }
  #cheat.show { display: flex; }
  .cheat { background: var(--overlay); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 24px 30px; box-shadow: var(--shadow); width: 760px; max-width: 92vw; }
  .cheat h3 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; color: var(--text-muted); margin: 0 0 18px; }
  .cheat-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 32px; }
  .cheat-group { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em; color: var(--accent); margin: 12px 0 4px; }
  .cheat-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 12px; color: var(--text-muted); gap: 12px; }
  .cheat-row span:first-child { min-width: 0; }
  .cheat-row .keys { display: flex; gap: 4px; flex: none; }
  .cheat .close-hint { text-align: center; margin-top: 18px; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
</style>

<body>
<div id="app" data-mode="workspace" data-focus="sidebar" data-view="file" data-input="select" data-width="default">

  <div id="topbar">
    <a id="brand" href="../index.html">cueloop</a>
    <div id="crumb"></div>
    <div id="status"></div>
    <div class="segmented" id="mode-seg">
      <button data-mode="workspace" class="on">Workspace</button>
      <button data-mode="focus">Focus</button>
      <button data-mode="guided">Guided</button>
      <button data-mode="split">Split</button>
    </div>
    <button id="theme-btn" class="hbtn" aria-label="Cycle theme"></button>
    <button id="settings-btn" class="hbtn" title="Settings (⌘,)">⚙</button>
  </div>

  <div id="modebar">
    <div class="input-tools" id="input-seg">

/* ═══════════ Diff model (gaps gated by the Diff settings) ═══════════ */

function buildDiffModel(f) {
  const model = [];
  let oldN = 0, newN = 0, idx = -1, i = 0;
  while (i < f.lines.length) {
    const l = f.lines[i];
    if (l.t === "hunk") {
      const m = l.text.match(/@@ -(\d+),?\d* \+(\d+)/);
      oldN = +m[1]; newN = +m[2];
      model.push({ type: "hunk", text: l.text });
      i++; continue;
    }
    if (l.hidden) {
      const gid = l.gapId; const run = [];
      while (i < f.lines.length && f.lines[i].hidden && f.lines[i].gapId === gid) { run.push({ l: f.lines[i], li: i }); i++; }
      const expanded = settings.expandUnchanged || !!state.expandedGaps[f.id + ":" + gid];
      if (!expanded) {
        model.push({ type: "gap", gapId: gid, count: run.length });
        oldN += run.length; newN += run.length;
      } else {
        run.forEach(r => { idx++; model.push({ type: "line", idx: idx, li: r.li, line: r.l, lo: oldN, ln: newN, sign: " " }); oldN++; newN++; });
      }
      continue;
    }
    idx++;
    let lo = "", ln = "", sign = " ";
    if (l.t === "ctx") { lo = oldN++; ln = newN++; }
    else if (l.t === "add") { ln = newN++; sign = "+"; }
    else { lo = oldN++; sign = "−"; }
    model.push({ type: "line", idx: idx, li: i, line: l, lo: lo, ln: ln, sign: sign });
    i++;
  }
  // intra-line pairing over consecutive del/add runs
  let k = 0;
  while (k < model.length) {
    if (model[k].type === "line" && (model[k].line.t === "del" || model[k].line.t === "add")) {
      let j = k;
      const run = [];
      while (j < model.length && model[j].type === "line" && (model[j].line.t === "del" || model[j].line.t === "add")) { run.push(model[j]); j++; }
      const dels = run.filter(x => x.line.t === "del");
      const adds = run.filter(x => x.line.t === "add");
      const pairs = Math.min(dels.length, adds.length);
      for (let p = 0; p < pairs; p++) {
        dels[p].partner = adds[p].line.text;
        adds[p].partner = dels[p].line.text;
      }
      k = j;
    } else k++;
  }
  return model;
}

function rowsFor(fileId) {
  const f = FILES[fileId];
  if (f.kind === "plan") return planRows().map((b, i) => ({ idx: i, block: b, li: i }));
  if (f.kind === "diff") return buildDiffModel(f).filter(m => m.type === "line").map(m => ({ idx: m.idx, li: m.li, line: m.line, lo: m.lo, ln: m.ln }));
  return [];
}
function rowsText(item, s0, s1) {
  const rows = rowsFor(item); const arr = [];
  for (let i = s0; i <= s1; i++) { const r = rows[i]; if (r) arr.push(r.block ? r.block.text : (r.line.text || "")); }
  return arr.join("\n");
}

/* ═══════════ Intra-line diff ═══════════ */

function lcsOps(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--)
    for (let j = n - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < m && j < n) {
    if (a[i] === b[j]) { ops.push({ t: "eq", v: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: "del", v: a[i++] }); }
    else { ops.push({ t: "ins", v: b[j++] }); }
  }
  while (i < m) ops.push({ t: "del", v: a[i++] });
  while (j < n) ops.push({ t: "ins", v: b[j++] });
  return ops;
}
function tokenizeIntra(s, mode) { return mode === "char" ? s.split("") : s.split(/(\s+)/).filter(x => x !== ""); }
function intraSide(oldT, newT, mode, side) {
  const ops = lcsOps(tokenizeIntra(oldT, mode), tokenizeIntra(newT, mode));
  let out = "";
  ops.forEach(o => {
    if (o.t === "eq") out += esc(o.v);
    else if (o.t === "del" && side === "old") out += '<span class="ic-del">' + esc(o.v) + "</span>";
    else if (o.t === "ins" && side === "new") out += '<span class="ic-add">' + esc(o.v) + "</span>";
  });
  return out;
}

function wordDiff(oldText, newText) {
