<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cueloop · Ledger — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../round2/tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  :root { --diff-mono: var(--mono); }

  /* high-contrast curated theme */
  [data-theme="contrast"] {
    --bg:#000000; --panel:#080808; --elevated:#141414; --overlay:#161616;
    --border:rgba(255,255,255,0.30); --border-strong:rgba(255,255,255,0.55);
    --text:#ffffff; --text-muted:#e6e6e6; --text-dim:#9aa0aa;
    --accent:#ffb3b3; --accent-hover:#ffc9c9; --accent-tint:rgba(255,179,179,0.20); --accent-ink:#160000;
    --green:#5cff7a; --green-tint:rgba(92,255,122,0.20); --red:#ff7a7a; --red-tint:rgba(255,122,122,0.20);
    --blue:#9ec0ff; --dot:rgba(255,255,255,0.16); --shadow:0 8px 40px rgba(0,0,0,0.85);
  }

  /* ── App shell ─────────────────────────────── */
  #app { display: grid; grid-template-rows: 50px 1fr; height: 100%; }

  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #crumb { font-family: var(--mono); font-size: 12px; color: var(--text-muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #crumb b { color: var(--text); font-weight: 500; }
  #crumb .sep { color: var(--text-dim); margin: 0 3px; }

  .segmented { display: flex; background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r); padding: 2px; gap: 2px; }
  .segmented button {
    position: relative;
    font-family: var(--sans); font-size: 12px; color: var(--text-muted);
    background: none; border: none; border-radius: var(--r-sm);
    padding: 4px 11px; cursor: pointer; white-space: nowrap;
    transition: background .12s var(--ease), color .12s var(--ease);
  }
  .segmented button:hover { color: var(--text); }
  .segmented button.on { background: var(--accent-tint); color: var(--accent); }
  #gseg-bar { position: absolute; left: 6px; right: 6px; bottom: 1.5px; height: 2px; background: var(--border-strong); border-radius: 1px; overflow: hidden; display: none; }
  #app[data-mode="guided"] #mode-seg #gseg-bar { display: block; }
  #gseg-fill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .28s var(--ease); }

  .tbtn, #finish-btn {
    font-family: var(--mono); font-size: 12px;
    border-radius: var(--r); padding: 6px 11px; cursor: pointer;
    border: 1px solid var(--border); background: var(--elevated); color: var(--text-muted);
    white-space: nowrap; transition: all .14s var(--ease);
  }
  .tbtn:hover { color: var(--text); border-color: var(--border-strong); }
  #texture-btn.on, #settings-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
  #settings-btn, #palette-btn { padding: 6px 9px; }
  #finish-btn { font-weight: 600; }
  #finish-btn.has-pending { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #finish-btn.has-pending:hover { background: var(--accent-hover); }
  #finish-btn.sent { background: var(--green-tint); color: var(--green); border-color: transparent; }

  #status {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    opacity: 0; transition: opacity .3s var(--ease); white-space: nowrap;
    max-width: 300px; overflow: hidden; text-overflow: ellipsis;
  }
  #status.show { opacity: 1; }

  /* ── Lower: sidebar + stage ───────────────── */
  #lower { display: grid; grid-template-columns: 268px 1fr; min-height: 0; }
  #app[data-mode="focus"] #lower { grid-template-columns: 1fr; }
  #app[data-mode="focus"] #sidebar { display: none; }

  /* ── Sidebar ──────────────────────────────── */
  #sidebar {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
    transition: box-shadow .15s var(--ease);
  }
  #app[data-focus="sidebar"] #sidebar { box-shadow: inset 2px 0 0 var(--accent); }
  #side-brand { padding: 12px 16px 10px; }
  #side-brand a {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--text-dim); text-decoration: none;
  }
  #side-brand a:hover { color: var(--accent); }
  #side-brand .b-strong { color: var(--text-muted); }

  .tabs { display: flex; gap: 3px; padding: 0 12px 10px; border-bottom: 1px solid var(--border); }
  .tabs button {
    flex: 1; font-family: var(--sans); font-size: 12px; color: var(--text-muted);
    background: none; border: 1px solid transparent; border-radius: var(--r);
    padding: 5px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--elevated); border-color: var(--border); color: var(--text); }

  #side-list { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
  .side-group {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.13em;
    color: var(--text-dim); padding: 12px 8px 5px;
  }
  .side-folder {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-muted);
    padding: 5px 8px; user-select: none;
  }
  .side-folder .caret { color: var(--text-dim); font-size: 9px; }

  .side-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: var(--r);
    border: 1px solid transparent; cursor: pointer; user-select: none;
  }
  .side-item.indent { margin-left: 14px; }
  .side-item + .side-item { margin-top: 1px; }
  .side-item:hover { background: var(--elevated); }
  .side-item.cursor { border-color: var(--border-strong); background: var(--elevated); }
  #app[data-focus="sidebar"] .side-item.cursor { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-tint); }
  .side-item.open { background: var(--accent-tint); }
  .side-item.open .s-name { color: var(--text); }

  .s-check {
    width: 15px; height: 15px; flex: none; border-radius: 4px;
    border: 1.5px solid var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: transparent; transition: all .12s var(--ease);
  }
  .side-item.viewed .s-check { background: var(--green); border-color: var(--green); color: var(--accent-ink); }
  .s-dot { width: 15px; flex: none; display: flex; align-items: center; justify-content: center; }
  .s-dot::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    border: 1.5px solid var(--text-dim); box-sizing: border-box; transition: all .12s var(--ease);
  }
  .side-item.viewed .s-dot::before { background: var(--green); border-color: var(--green); }

  .s-name { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-item.viewed .s-name { color: var(--text-dim); }
  .s-outline-name { font-family: var(--sans); }
  .s-stat { font-family: var(--mono); font-size: 10px; flex: none; }
  .s-stat .plus { color: var(--green); } .s-stat .minus { color: var(--red); } .s-stat .newf { color: var(--blue); }
  .s-badge {
    flex: none; min-width: 17px; height: 17px; padding: 0 5px;
    border-radius: 9px; background: var(--accent-tint); color: var(--accent);
    border: 1px solid rgba(245,163,163,0.3);
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }

  #side-progress { border-top: 1px solid var(--border); padding: 12px 16px 14px; }
  #side-progress .p-label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 7px; }
  #pbar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  #pbar-fill { height: 100%; width: 0; background: var(--green); border-radius: 2px; transition: width .28s var(--ease); }

  /* ── Stage (scroller + rail) ──────────────── */
  #scroller { overflow-y: auto; min-height: 0; position: relative; }
  #canvas { position: relative; display: flex; justify-content: center; min-height: 100%; }
  .center-col { width: 720px; max-width: min(720px, 100%); padding: 36px 48px 45vh; }
  #app[data-width="compact"] .center-col { width: 616px; }
  #app[data-width="default"] .center-col { width: 720px; }
  #app[data-width="wide"] .center-col { width: 864px; }
  .rail-col { width: 336px; flex: none; position: relative; border-left: 1px solid var(--border); }

  /* guided progress strip */
  #guided-strip { display: none; margin-bottom: 26px; }
  #app[data-mode="guided"] #guided-strip {
    display: block; position: sticky; top: 0; z-index: 4;
    margin: -36px -48px 26px; padding: 18px 48px 16px;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  #guided-strip .g-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  #guided-strip .g-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); }
  #guided-strip .g-count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  #gbar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  #gbar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .3s var(--ease); }
  #guided-strip .g-hint { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 8px; }
  #guided-strip .g-hint kbd { margin: 0 1px; }

  /* ── Plan typography ──────────────────────── */
  .plan .doc-meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--text-dim); margin: -6px 0 26px; }
  .plan .doc-meta b { color: var(--text-muted); font-weight: 500; }
  .row { position: relative; border-radius: var(--r-sm); }
  .plan .row { padding: 3px 12px; margin: 0 -12px; }
  .row.cursor { background: var(--accent-tint); }
  #app[data-focus="content"] .row.cursor::before,
  .row.sel::before {
    content: ""; position: absolute; left: -2px; top: 3px; bottom: 3px;
    width: 2px; border-radius: 2px; background: var(--accent);
  }
  .row.sel { background: var(--accent-tint); }
  .row.has-note::after { content: ""; position: absolute; right: 2px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .row.anchor-focus { background: var(--accent-tint); box-shadow: inset 2px 0 0 var(--accent); }
  .row.guided-dim { opacity: 0.4; }
  .row.flash { animation: rowflash .9s var(--ease); }
  @keyframes rowflash { 0%,35% { background: var(--accent-tint); } 100% { background: transparent; } }

  .plan h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; margin: 0; }
  .plan h2 { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .plan .row:has(h2) { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--border); }
  .plan p { margin: 0; line-height: 1.65; color: var(--text); }
  .plan .li, .plan .oli { display: flex; gap: 10px; line-height: 1.6; }
  .plan .marker { color: var(--text-dim); font-family: var(--mono); flex: none; }
  .fname { font-family: var(--mono); font-size: 0.9em; color: var(--blue); }
  .codewrap { background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-lg); margin: 4px 0; overflow-x: auto; }
  .codewrap .row { padding: 2px 16px; margin: 0; border-radius: 0; }
  .codewrap pre { margin: 0; }
  .codewrap code { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--text-muted); white-space: pre; }
  .tok-kw { color: var(--accent); } .tok-ty { color: var(--green); } .tok-pr { color: var(--text-muted); }

  /* ── Diff ─────────────────────────────────── */
  .diff { font-family: var(--diff-mono, var(--mono)); font-size: 12.5px; }
  .diff-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .diff-head .fpath { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .diff-head .fstat { font-size: 11px; font-family: var(--mono); }
  .diff-head .plus { color: var(--green); } .diff-head .minus { color: var(--red); } .diff-head .newf { color: var(--blue); }
  .dline { display: grid; grid-template-columns: 42px 42px 16px 1fr; line-height: 1.75; }
  .diff .row { border-radius: 0; margin: 0; }
  .dline .gut { text-align: right; padding-right: 8px; color: var(--text-dim); font-size: 11px; user-select: none; }
  .dline .sign { color: var(--text-dim); user-select: none; text-align: center; }
  .dline .txt { white-space: pre; padding-right: 12px; tab-size: var(--tab-size, 2); -moz-tab-size: var(--tab-size, 2); overflow-x: hidden; }
  .dline.hunk { color: var(--blue); background: rgba(132,166,232,0.07); margin: 8px 0 2px; grid-template-columns: 1fr; }
  .dline.hunk .txt { color: var(--blue); padding-left: 12px; }
  .diff .row.cursor .dline { background: var(--accent-tint); }
  .diff .row.sel .dline { background: var(--accent-tint); }
  .diff .row.anchor-focus .dline { background: var(--accent-tint); }
  .dline .ws { color: var(--text-dim); opacity: 0.55; }
  .dline .w-ins { background: color-mix(in srgb, var(--green) 34%, transparent); border-radius: 2px; }
  .dline .w-del { background: color-mix(in srgb, var(--red) 34%, transparent); border-radius: 2px; }

  /* diff settings: line-background intensity via CSS vars */
  .diff { --add-bg: var(--green-tint); --del-bg: var(--red-tint); }
  .diff[data-intensity="subtle"] { --add-bg: color-mix(in srgb, var(--green) 7%, transparent); --del-bg: color-mix(in srgb, var(--red) 7%, transparent); }
  .diff[data-intensity="strong"] { --add-bg: color-mix(in srgb, var(--green) 26%, transparent); --del-bg: color-mix(in srgb, var(--red) 26%, transparent); }
  .dline.add { background: var(--add-bg); } .dline.add .sign, .dline.add .txt { color: var(--green); }
  .dline.del { background: var(--del-bg); } .dline.del .sign, .dline.del .txt { color: var(--red); }

  /* line numbers off */
  .diff[data-style="unified"][data-linenums="off"] .dline:not(.hunk) { grid-template-columns: 16px 1fr; }
  .diff[data-style="unified"][data-linenums="off"] .dline .gut { display: none; }

  /* split style */
  .diff[data-style="split"] .dline:not(.hunk) { grid-template-columns: 42px 1fr 42px 1fr; }
  .diff[data-style="split"][data-linenums="off"] .dline:not(.hunk) { grid-template-columns: 1fr 1fr; }
  .diff[data-style="split"] .txt.c-add { background: var(--add-bg); color: var(--green); }
  .diff[data-style="split"] .txt.c-del { background: var(--del-bg); color: var(--red); }
  .diff[data-style="split"] .gut.mid, .diff[data-style="split"] .txt.mid { border-left: 1px solid var(--border); }

  .drow-expand { font-family: var(--mono); font-size: 11px; color: var(--blue); background: rgba(132,166,232,0.07); padding: 4px 12px; cursor: pointer; text-align: center; }
  .drow-expand:hover { background: rgba(132,166,232,0.14); }

  /* ── Inline edit editor (center) ──────────── */
  .editor-inline { display: block; margin: 4px 0; }
  .editor-inline textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: var(--r);
    font-family: var(--sans); font-size: 14px; line-height: 1.55; padding: 8px 10px;
    resize: none; outline: none;
  }
  .editor-inline.code textarea { font-family: var(--mono); font-size: 12.5px; }
  .editor-inline .ed-hint { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .editor-inline .ed-hint kbd { margin: 0 1px; }

  /* ── Split mode (base vs working) ─────────── */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .split .split-pane { min-width: 0; padding: 0 20px; }
  .split .split-pane:first-child { border-right: 1px solid var(--border); padding-left: 0; }
  .split .split-pane:last-child { padding-right: 0; }
  .split .split-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--text-dim); margin-bottom: 14px; }
  .split .split-label.working { color: var(--accent); }

  /* ── Action bar (sticky) ──────────────────── */
  #action-bar {
    position: sticky; bottom: 14px; margin: 34px 0 0;
    display: flex; align-items: center; gap: 10px;
    background: var(--overlay); border: 1px solid var(--border-strong);
    border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 9px 10px 9px 15px;
  }
  #action-bar .ab-count { font-family: var(--mono); font-size: 12px; color: var(--text-muted); flex: 1; }
  #action-bar .ab-count b { color: var(--accent); font-weight: 600; }
  #action-bar button { font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: none; border-radius: var(--r); padding: 8px 13px; cursor: pointer; }
  #action-bar button:hover { background: var(--accent-hover); }
  #action-bar .ab-ghost { background: var(--elevated); color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; }
  #action-bar .ab-ghost:hover { background: var(--elevated); color: var(--text); }
  #action-bar kbd { margin-left: 6px; }

  /* ── Rail cards ───────────────────────────── */
  #app:not([data-mode="workspace"]) .rail-col { display: none; }
  #rail-cards { position: relative; }
  .card {
    position: absolute; left: 20px; right: 20px;
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 10px 12px;
    font-size: 12.5px; cursor: pointer;
    transition: top .16s var(--ease), border-color .12s var(--ease), box-shadow .12s var(--ease);
  }
  .card:hover { border-color: var(--border-strong); }
  .card.focused { border-color: var(--accent); box-shadow: var(--shadow); }
  .card.composer { border-color: var(--accent); z-index: 6; cursor: default; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card-type { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--text-dim); }
  .card.is-edit .card-type { color: var(--green); }
  .card-badge { margin-left: auto; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.1em; color: var(--accent); border: 1px solid rgba(245,163,163,0.3); border-radius: var(--r-sm); padding: 1px 5px; }
  .card-badge.sent { color: var(--blue); border-color: rgba(132,166,232,0.4); }
  .card-loc { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-bottom: 5px; }
  .card-quote { color: var(--text-muted); font-size: 12px; line-height: 1.45; border-left: 2px solid var(--accent); padding-left: 9px; margin-bottom: 7px; }
  .card-quote.mono { font-family: var(--mono); font-size: 11px; }
  .card-label { display: inline-block; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.09em; text-transform: uppercase; padding: 1px 6px; border-radius: 10px; background: var(--accent-tint); color: var(--accent); margin-bottom: 6px; }
  .card-body { color: var(--text); line-height: 1.5; white-space: pre-wrap; }
  .card-body:empty::before { content: "(no note)"; color: var(--text-dim); font-style: italic; }
  .card-mini { font-size: 12px; line-height: 1.5; }
  .card-mini .m-del { color: var(--red); text-decoration: line-through; display: block; }
  .card-mini .m-ins { color: var(--green); display: block; }
  .card textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); font: inherit; line-height: 1.5; padding: 6px 8px; resize: none; outline: none; }
  .card textarea:focus { border-color: var(--accent); }
  .card-hint { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 6px; }
  .card-hint kbd { margin: 0 1px; }
  .label-row { display: flex; gap: 5px; flex-wrap: wrap; margin: 7px 0 2px; }
  .label-chip { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; user-select: none; }
  .label-chip:hover { color: var(--text); border-color: var(--border-strong); }
  .label-chip.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }
  body.composing .card:not(.composer) { opacity: 0.4; }

  .rail-empty { position: absolute; left: 22px; right: 22px; top: 40px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }

(() => {

  { id: "li-1",  kind: "li",   section: "p1",      text: "server/storage/store.ts — the SessionStore class: an in-memory map with write-through persistence and corruption recovery." },

/* ═══════════ Diff sequence diff (word / char intraline) ═══════════ */

function tokenize(text, gran) {
  if (gran === "char") return [...text];
  return text.match(/\s+|[A-Za-z0-9_]+|[^\sA-Za-z0-9_]+/g) || [];
}
function seqDiff(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--)
    for (let j = n - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < m && j < n) {
    if (a[i] === b[j]) { ops.push({ t: "eq", s: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: "del", s: a[i] }); i++; }
    else { ops.push({ t: "ins", s: b[j] }); j++; }
  }
  while (i < m) ops.push({ t: "del", s: a[i++] });
  while (j < n) ops.push({ t: "ins", s: b[j++] });
  return ops;
}
function intraSide(ops, side) {
  let out = "";
  ops.forEach(op => {
    if (op.t === "eq") out += esc(op.s);
    else if (op.t === "ins") { if (side === "add") out += '<span class="w-ins">' + esc(op.s) + "</span>"; }
    else { if (side === "del") out += '<span class="w-del">' + esc(op.s) + "</span>"; }
  });
  return out;
}
function attachIntraline(rows, gran) {
  let i = 0;
  while (i < rows.length) {
    if (rows[i].hunk || rows[i].t !== "del") { i++; continue; }
    let j = i; while (j < rows.length && !rows[j].hunk && rows[j].t === "del") j++;
    let k = j; while (k < rows.length && !rows[k].hunk && rows[k].t === "add") k++;
    const dels = rows.slice(i, j), adds = rows.slice(j, k);
    const pairs = Math.min(dels.length, adds.length);
    for (let p = 0; p < pairs; p++) {
      const ops = seqDiff(tokenize(dels[p].text, gran), tokenize(adds[p].text, gran));
      dels[p].intra = intraSide(ops, "del");
      adds[p].intra = intraSide(ops, "add");
    }
    i = k > i ? k : i + 1;
  }
}

/* ═══════════ Word diff (tracked plan edits) ═══════════ */

function wordDiff(oldText, newText) {
  const a = oldText.split(/\s+/).filter(Boolean);
  const b = newText.split(/\s+/).filter(Boolean);
  const ops = seqDiff(a, b);
  return ops.map(o => ({ t: o.t, w: o.s }));
}
function editStats(e) { const o = wordDiff(e.oldText, e.newText); return { ins: o.filter(x => x.t === "ins").length, del: o.filter(x => x.t === "del").length }; }
function trackedHTML(oldText, newText) {
  return wordDiff(oldText, newText).map(op => {
    const w = esc(op.w);
    if (op.t === "eq") return w;
    if (op.t === "ins") return '<span class="ins">' + w + "</span>";
    return '<span class="del">' + w + "</span>";
  }).join(" ");
}

function monoStack(k) {
  if (k === "plex") return "'IBM Plex Mono',ui-monospace,monospace";
  if (k === "jetbrains") return "'JetBrains Mono',ui-monospace,monospace";
  if (k === "fira") return "'Fira Code',ui-monospace,monospace";
  return "var(--mono)";
}
function showWhitespace(t) {
  let o = "";
  for (const ch of t) {
    if (ch === " ") o += '<span class="ws">·</span>';
    else if (ch === "\t") o += '<span class="ws">→</span>';
    else o += esc(ch);
  }
  return o;
}
function txtHtml(r) {
  const t = r.text;
  if (!settings.hideWhitespace) return showWhitespace(t) || " ";
  const m = t.match(/^ +/);
  if (m) {
    const n = m[0].length;
    const lead = "\t".repeat(Math.floor(n / 2)) + " ".repeat(n % 2);
    return esc(lead + t.slice(n)) || " ";
  }
  return esc(t) || " ";
}
function lineTxt(r, side) {
  // side: undefined (unified) | 'del' | 'add' — use intraline when present
  if (r.intra && (side === undefined || (side === "del" && r.t === "del") || (side === "add" && r.t === "add"))) return r.intra;
  return txtHtml(r);
}

function buildDiffRows(f) {
  const rows = [];
  let oldN = 0, newN = 0, ri = -1;
  f.lines.forEach(l => {
    if (l.t === "hunk") { const m = l.text.match(/@@ -(\d+),?\d* \+(\d+)/); oldN = +m[1]; newN = +m[2]; rows.push({ hunk: true, text: l.text }); return; }
    ri++;
    let lo = "", ln = "";
    if (l.t === "ctx") { lo = oldN++; ln = newN++; }
    else if (l.t === "add") { ln = newN++; }
    else { lo = oldN++; }
    rows.push({ t: l.t, text: l.text, oldN: lo, newN: ln, rowIdx: ri });
  });
  if (settings.diffGranularity !== "none") attachIntraline(rows, settings.diffGranularity);
  return rows;
}

function computeCollapse(rows, fileId, cur) {
  const hide = new Set(), dividers = {};
  if (settings.expandUnchanged) return { hide, dividers };
  const expandedSet = state.expanded[fileId];
  if (expandedSet === "all") return { hide, dividers };
  let i = 0;
  while (i < rows.length) {
    if (rows[i].hunk || rows[i].t !== "ctx") { i++; continue; }
    let j = i; while (j < rows.length && !rows[j].hunk && rows[j].t === "ctx") j++;
    const run = rows.slice(i, j);
    const containsCursor = run.some(r => r.rowIdx === cur);
    const isExpanded = expandedSet && expandedSet.has(i);
    if (run.length >= 3 && !containsCursor && !isExpanded) {
      for (let k = i + 1; k < j - 1; k++) hide.add(rows[k].rowIdx);
      dividers[rows[i + 1].rowIdx] = { count: (j - 1) - (i + 1), start: i };
    }
    i = j;
  }
  return { hide, dividers };
}

function diffBodyHTML(fileId) {
  const f = fileItems.find(x => x.id === fileId);
  const cur = state.cursors[fileId];
  const [s0, s1] = selRange();
  const rows = buildDiffRows(f);
  const { hide, dividers } = computeCollapse(rows, fileId, cur);
  const style = settings.diffStyle;

  let html = '<div class="diff" data-style="' + style + '" data-linenums="' + (settings.showLineNumbers ? "on" : "off")
    + '" data-intensity="' + settings.lineIntensity + '" style="--tab-size:' + settings.tabSize + ";--diff-mono:" + monoStack(settings.monoFont) + '">';
  html += '<div class="diff-head"><span class="fpath">' + esc(f.path) + "</span>";
  html += f.status === "new"
    ? '<span class="fstat"><span class="newf">new file</span> <span class="plus">+' + f.add + "</span></span>"
    : '<span class="fstat"><span class="plus">+' + f.add + '</span> <span class="minus">−' + f.del + "</span></span>";
  html += '<span class="fstat" style="margin-left:auto;color:var(--text-dim)">' + style + (settings.showLineNumbers ? "" : " · no nums") + "</span></div>";

  rows.forEach(r => {
    if (r.hunk) {
      html += '<div class="dline hunk"><span class="txt">' + esc(r.text) + "</span></div>";
      return;
    }
    if (hide.has(r.rowIdx)) return;
    if (dividers[r.rowIdx]) {
      const d = dividers[r.rowIdx];
      html += '<div class="drow-expand" data-expand="' + d.start + '" data-file="' + fileId + '">⋯ ' + d.count + " unchanged line" + (d.count > 1 ? "s" : "") + " · click to expand</div>";
    }
    const rowCls = ["row", r.rowIdx === cur ? "cursor" : "",
      (state.selAnchor !== null && r.rowIdx >= s0 && r.rowIdx <= s1) ? "sel" : "",
      hasNote(fileId, r.rowIdx) ? "has-note" : ""].filter(Boolean).join(" ");
    html += '<div class="' + rowCls + '" data-row="' + r.rowIdx + '">' + (style === "split" ? splitLineHTML(r) : unifiedLineHTML(r)) + "</div>";
  });
  html += "</div>";
  return html;
}

function unifiedLineHTML(r) {
  const nums = settings.showLineNumbers
    ? '<span class="gut">' + r.oldN + '</span><span class="gut">' + r.newN + "</span>"
    : "";
  const sign = r.t === "add" ? "+" : r.t === "del" ? "−" : " ";
  return '<div class="dline ' + r.t + '">' + nums + '<span class="sign">' + sign + '</span><span class="txt">' + lineTxt(r) + "</span></div>";
}

function splitLineHTML(r) {
  const showN = settings.showLineNumbers;
  let leftTxt = " ", rightTxt = " ", leftCls = "", rightCls = "";
  if (r.t === "ctx") { leftTxt = lineTxt(r); rightTxt = lineTxt(r); }
  else if (r.t === "del") { leftTxt = lineTxt(r, "del"); leftCls = " c-del"; }
  else { rightTxt = lineTxt(r, "add"); rightCls = " c-add"; }
  let h = '<div class="dline">';
  if (showN) {
    h += '<span class="gut">' + (r.oldN !== "" ? r.oldN : "") + "</span>";
    h += '<span class="txt' + leftCls + '">' + leftTxt + "</span>";
    h += '<span class="gut mid">' + (r.newN !== "" ? r.newN : "") + "</span>";
    h += '<span class="txt' + rightCls + '">' + rightTxt + "</span>";
  } else {
    h += '<span class="txt' + leftCls + '">' + leftTxt + "</span>";
    h += '<span class="txt mid' + rightCls + '">' + rightTxt + "</span>";
  }
  h += "</div>";
  return h;
}

/* ═══════════ Split mode (base vs working) ═══════════ */

function splitBodyHTML() {
  const f = fileItems.find(x => x.id === state.active);
  if (f.kind === "plan") {
    const base = '<div class="split-pane"><div class="split-label">BASE · as submitted</div><div class="plan">'
      + planRows.map(b => renderStaticBlock(b, false)).join("") + "</div></div>";
    const work = '<div class="split-pane"><div class="split-label working">WORKING COPY · your edits</div><div class="plan">'
      + planRows.map((b, i) => { const e = state.edits.find(x => x.rowIdx === i); return renderStaticBlock(b, e); }).join("") + "</div></div>";
    return '<div class="split">' + base + work + "</div>";
  }
  const oldSide = [], newSide = [];
  let oldN = 0, newN = 0;
  f.lines.forEach(l => {
    if (l.t === "hunk") { const m = l.text.match(/@@ -(\d+),?\d* \+(\d+)/); oldN = +m[1]; newN = +m[2]; return; }
    if (l.t === "ctx") { oldSide.push({ n: oldN++, t: "ctx", text: l.text }); newSide.push({ n: newN++, t: "ctx", text: l.text }); }
    else if (l.t === "del") { oldSide.push({ n: oldN++, t: "del", text: l.text }); }
    else { newSide.push({ n: newN++, t: "add", text: l.text }); }
  });
  const sideHTML = arr => arr.map(r => '<div class="dline ' + r.t + '"><span class="gut">' + r.n + '</span><span class="sign">' + (r.t === "add" ? "+" : r.t === "del" ? "−" : " ") + '</span><span class="txt">' + (esc(r.text) || " ") + "</span></div>").join("");
  return '<div class="split"><div class="split-pane"><div class="split-label">BASE · ' + esc(f.path) + '</div><div class="diff" data-style="unified" data-linenums="on" style="--tab-size:' + settings.tabSize + '">' + sideHTML(oldSide)
    + '</div></div><div class="split-pane"><div class="split-label working">WORKING COPY</div><div class="diff" data-style="unified" data-linenums="on" style="--tab-size:' + settings.tabSize + '">' + sideHTML(newSide) + "</div></div>";
}

function renderStaticBlock(b, edit) {
  let inner;
  if (b.kind === "code") return '<div class="codewrap"><pre><code>' + (edit ? trackedHTML(edit.oldText, edit.newText) : codeHTML) + "</code></pre></div>";
  inner = edit ? trackedHTML(edit.oldText, edit.newText) : linkFiles(esc(b.text));
  if (b.kind === "h1") return "<h1 style='padding:3px 0'>" + inner + "</h1>";
  if (b.kind === "h2") return "<h2 style='padding:12px 0 4px'>" + inner + "</h2>";
  if (b.kind === "li") return '<div class="li" style="padding:3px 0"><span class="marker">▪</span><span>' + inner + "</span></div>";
  if (b.kind === "oli") return '<div class="oli" style="padding:3px 0"><span class="marker">•</span><span>' + inner + "</span></div>";
  return "<p style='padding:3px 0'>" + inner + "</p>";
}

/* ═══════════ Render content ═══════════ */

function renderContent() {
  const inner = $("#content");
  if (state.mode === "split") { inner.innerHTML = splitBodyHTML(); updateCrumb(); renderActionBar(); return; }
  const f = fileItems.find(x => x.id === state.active);
  inner.innerHTML = f.kind === "plan" ? planBodyHTML() : diffBodyHTML(state.active);

  inner.querySelectorAll("[data-row]").forEach(el => {
    el.addEventListener("click", () => {
      state.focusZone = "content"; syncFocus();
      state.cursors[state.active] = +el.dataset.row;
      state.selAnchor = null;
      const note = firstNoteOnRow(state.active, +el.dataset.row);
      if (note) setFocused(note.id); else setFocused(null);
      renderContent(); renderRail();
    });
  });
  inner.querySelectorAll("[data-expand]").forEach(el => {
    el.addEventListener("click", () => {
      const fileId = el.dataset.file;
      if (!state.expanded[fileId] || state.expanded[fileId] === "all") state.expanded[fileId] = new Set();
      state.expanded[fileId].add(+el.dataset.expand);
      renderContent(); renderRail();
    });
  });

  const ta = $("#edit-input");
  if (ta) { ta.focus(); ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; ta.setSelectionRange(ta.value.length, ta.value.length); }

  const curEl = inner.querySelector(".row.cursor");
  if (curEl && !ta) curEl.scrollIntoView({ block: "nearest" });
  updateCrumb();
  renderActionBar();
  applyAnchorFocus();
}

function updateCrumb() {
  const f = fileItems.find(x => x.id === state.active);
  const rows = rowsFor(state.active);
  const cur = state.cursors[state.active];
  const posLabel = f.kind === "plan" ? "block" : "line";
  $("#crumb").innerHTML = "review <span class='sep'>/</span> <b>" + esc(f.path) + "</b> <span class='sep'>·</span> " + posLabel + " " + (cur + 1) + "/" + rows.length
    + " <span class='sep'>·</span> " + esc(settings.displayName);
}

/* ═══════════ Action bar ═══════════ */

function renderActionBar() {
  const bar = $("#action-bar");
  if (!settings.stickyBar || state.submitted) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  const n = pendingCount();
  const count = n
    ? "<b>" + n + "</b> pending annotation" + (n === 1 ? "" : "s") + " · nothing sent yet"
    : "No annotations yet · move with j / k, then c to comment";
  bar.innerHTML = '<span class="ab-count">' + count + "</span>"
    + '<button class="ab-ghost" data-ab="palette">Command<kbd>⌘K</kbd></button>'
    + '<button data-ab="submit">Finish review<kbd>⌘⏎</kbd></button>';
  bar.querySelector('[data-ab="submit"]').addEventListener("click", () => openPanel());
  bar.querySelector('[data-ab="palette"]').addEventListener("click", () => openPalette());
}

/* ═══════════ Guided ═══════════ */

function renderGuided() {
  const items = activeItems();
  if (state.guidedIndex >= items.length) state.guidedIndex = items.length - 1;
  const it = items[state.guidedIndex];
  if (it.kind === "file") { if (state.active !== it.file.id) { state.active = it.file.id; state.cursors[state.active] = 0; } }
  else { state.active = "plan"; state.cursors.plan = blockRowIndex(it.blockId); }
  state.sidebarCursor = state.guidedIndex;

  const viewedCount = items.filter(isViewed).length;
  $("#g-title").textContent = (it.kind === "file" ? it.file.path : it.label);
  $("#g-count").textContent = "item " + (state.guidedIndex + 1) + " of " + items.length + " · " + viewedCount + " viewed";
  $("#gbar-fill").style.width = (viewedCount / items.length * 100) + "%";

  renderContent();
  const target = $("#content").querySelector(".row.cursor") || $("#content").querySelector("[data-row]");
  if (target) target.scrollIntoView({ block: "start" });
}

function guidedStep(delta) {
  const items = activeItems();
  const next = state.guidedIndex + delta;
  if (delta > 0) state.viewed[items[state.guidedIndex].key] = true;
  if (next < 0) { flash("At the first item"); return; }
  if (next >= items.length) { flash("End of walk — ⌘⏎ to finish the review"); state.viewed[items[state.guidedIndex].key] = true; renderAll(); return; }
  state.guidedIndex = next;
  renderAll();
}

/* ═══════════ Rail ═══════════ */

function topInCanvas(el) { return el.getBoundingClientRect().top - canvas.getBoundingClientRect().top; }
function hasNote(item, rowIdx) {
  const c = state.annotations.some(a => a.item === item && rowIdx >= a.start && rowIdx <= a.end);
  const e = item === "plan" && state.edits.some(x => x.rowIdx === rowIdx);
  return c || e;
}
function firstNoteOnRow(item, rowIdx) {
  const a = state.annotations.find(a => a.item === item && rowIdx >= a.start && rowIdx <= a.end);
  if (a) return { id: a.id };
  if (item === "plan") { const e = state.edits.find(x => x.rowIdx === rowIdx); if (e) return { id: "e" + e.id }; }
  return null;
}

function cardsForActive() {
  const list = [];
  state.annotations.filter(a => a.item === state.active).forEach(a => list.push({ id: a.id, kind: "comment", ann: a, anchor: a.start }));
  if (state.active === "plan") state.edits.forEach(e => list.push({ id: "e" + e.id, kind: "edit", edit: e, anchor: e.rowIdx }));
  list.sort((x, y) => x.anchor - y.anchor);
  return list;
}

function anchorRow(card) { return $("#content").querySelector('[data-row="' + card.anchor + '"]'); }

function buildCard(card, compact) {
  const el = document.createElement("div");
  el.className = "card" + (card.kind === "edit" ? " is-edit" : "");
  el.dataset.id = card.id;
  const sent = state.submitted;
  let html = '<div class="card-head"><span class="card-type">' + (card.kind === "edit" ? "EDIT" : "COMMENT") + '</span>'
    + '<span class="card-badge' + (sent ? " sent" : "") + '">' + (sent ? "SENT" : "PENDING") + "</span></div>";
  const f = fileItems.find(x => x.id === state.active);
  if (card.kind === "edit") {
    html += '<div class="card-mini"><span class="m-del">' + esc(trunc(card.edit.oldText)) + '</span><span class="m-ins">' + esc(trunc(card.edit.newText)) + "</span></div>";
  } else {
    if (f.kind === "diff") html += '<div class="card-loc">' + esc(f.path) + ":" + excerptLine(card.ann) + "</div>";
    if (card.ann.label) html += '<div class="card-label">' + esc(card.ann.label) + "</div>";
    html += '<div class="card-quote' + (f.kind === "diff" ? " mono" : "") + '">' + esc(quoteOf(card.ann)) + "</div>";
    html += '<div class="card-body">' + esc(card.ann.text) + "</div>";
  }
  el.innerHTML = html;
  if (!compact) {
    el.addEventListener("click", e => {
      if (state.focusedId === card.id && card.kind === "comment" && e.target.closest(".card-body")) editCardNote(el, card.ann);
      else setFocused(card.id), renderRail(), applyAnchorFocus();
    });
  }
  return el;
}
function trunc(s) { return s.length > 84 ? s.slice(0, 81).trimEnd() + "…" : s; }
function quoteOf(a) {
  const rows = rowsFor(a.item);
  const first = rows[a.start];
  const text = first.block ? first.block.text : (first.line.text || "(blank line)");
  const more = a.end > a.start ? " … +" + (a.end - a.start) : "";
  return trunc(text.trim()) + more;
}
function excerptLine(a) {
  const f = fileItems.find(x => x.id === a.item);
  if (f.kind !== "diff") return "";
  let oldN = 0, newN = 0, k = -1, res = "?";
  f.lines.forEach(l => {
    if (l.t === "hunk") { const m = l.text.match(/@@ -(\d+),?\d* \+(\d+)/); oldN = +m[1]; newN = +m[2]; return; }
    k++;
    const ln = l.t === "del" ? oldN : newN;
    if (l.t === "ctx") { oldN++; newN++; } else if (l.t === "add") newN++; else oldN++;
    if (k === a.start) res = ln;
  });
  return res;
}

function applyAnchorFocus() {
  document.querySelectorAll(".anchor-focus").forEach(el => el.classList.remove("anchor-focus"));
  if (!state.focusedId) return;
  const card = cardsForActive().find(c => c.id === state.focusedId);
  if (!card) return;
  const row = anchorRow(card);
  if (row) row.classList.add("anchor-focus");
}

function renderRail() {
  railCards.innerHTML = "";
  connector.style.display = "none";
  if (state.mode !== "workspace" || state.railHidden) { railCol.style.display = "none"; return; }
  railCol.style.display = "block";

  const cards = cardsForActive();
  const otherCount = state.annotations.length + state.edits.length - cards.length;

  if (!cards.length) {
    const empty = document.createElement("div");
    empty.className = "rail-empty";
    empty.textContent = fileItems.find(x => x.id === state.active).kind === "plan"
      ? "No notes on this file yet. Move with j / k, extend with ⇧j, then c to comment or e to rewrite a block."
      : "Move the line cursor with j / k, then press c to comment on a line.";
    railCards.appendChild(empty);
    if (otherCount > 0) railNote(otherCount, 90);
    return;
  }

  const items = cards.map(c => {
    const el = buildCard(c, false);
    el.style.top = "0px";
    railCards.appendChild(el);
    const row = anchorRow(c);
    return { card: c, el, want: row ? Math.max(4, topInCanvas(row) - 2) : 4 };
  });
  items.sort((x, y) => x.want - y.want);

  const GAP = 10;
  const fi = items.findIndex(it => it.card.id === state.focusedId);
  const tops = new Array(items.length);
  if (fi >= 0) {
    tops[fi] = items[fi].want;
    for (let i = fi - 1; i >= 0; i--) tops[i] = Math.min(items[i].want, tops[i + 1] - items[i].el.offsetHeight - GAP);
    for (let i = fi + 1; i < items.length; i++) tops[i] = Math.max(items[i].want, tops[i - 1] + items[i - 1].el.offsetHeight + GAP);
  } else {
    let y = 0;
    items.forEach((it, i) => { tops[i] = Math.max(it.want, y); y = tops[i] + it.el.offsetHeight + GAP; });
  }
  let maxBottom = 40;
  items.forEach((it, i) => {
    it.el.style.top = Math.max(4, tops[i]) + "px";
    it.el.classList.toggle("focused", it.card.id === state.focusedId);
    maxBottom = Math.max(maxBottom, tops[i] + it.el.offsetHeight);
  });
  if (otherCount > 0) railNote(otherCount, maxBottom + 24);

  const focused = items.find(it => it.card.id === state.focusedId);
  if (focused) {
    const row = anchorRow(focused.card);
    if (row) {
      const aRect = row.getBoundingClientRect();
      const cRect = canvas.getBoundingClientRect();
      const left = aRect.right - cRect.left + 4;
      const right = focused.el.getBoundingClientRect().left - cRect.left - 2;
      connector.style.display = "block";
      connector.style.left = left + "px";
      connector.style.width = Math.max(0, right - left) + "px";
      connector.style.top = (aRect.top - cRect.top + aRect.height / 2) + "px";
    }
  }
}
function railNote(n, top) {
  const note = document.createElement("div");
  note.className = "rail-note";
  note.style.top = top + "px";
  note.textContent = n + " more pending on other files — press n to walk them.";
  railCards.appendChild(note);
}

function editCardNote(el, ann) {
  const body = el.querySelector(".card-body");
  if (!body || el.querySelector("textarea")) return;
  const ta = document.createElement("textarea");
  ta.value = ann.text; ta.rows = Math.max(2, ann.text.split("\n").length);
  body.replaceWith(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const save = () => { ann.text = ta.value.trim(); renderAll(); };
  ta.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save(); }
    else if (e.key === "Escape") { e.preventDefault(); renderRail(); }
  });
  ta.addEventListener("blur", save);
}

/* ═══════════ Focus / selection ═══════════ */

function selRange() {
  const cur = state.cursors[state.active];
  if (state.selAnchor === null) return [cur, cur];
  return [Math.min(state.selAnchor, cur), Math.max(state.selAnchor, cur)];
}
function setFocused(id) { state.focusedId = id; }
function syncFocus() { $("#app").dataset.focus = state.focusZone; }

/* ═══════════ Actions ═══════════ */

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (state.sidebarCursor >= activeItems().length) state.sidebarCursor = activeItems().length - 1;
  renderAll();
}

function setMode(mode) {
  state.mode = mode;
  $("#app").dataset.mode = mode;
  document.querySelectorAll("#mode-seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  if (mode === "guided") state.guidedIndex = Math.min(state.sidebarCursor, activeItems().length - 1);
  renderAll();
}

function openSidebarItem(it) {
  state.focusZone = "content";
  if (it.kind === "file") { state.active = it.file.id; if (state.cursors[it.file.id] == null) state.cursors[it.file.id] = 0; }
  else { state.active = "plan"; state.cursors.plan = blockRowIndex(it.blockId); }
  state.selAnchor = null; setFocused(null);
  if (state.mode === "guided") state.guidedIndex = state.sidebarCursor;
  renderAll();
  const el = $("#content").querySelector('[data-row="' + state.cursors[state.active] + '"]');
  if (el) el.scrollIntoView({ block: it.kind === "outline" ? "start" : "nearest" });
}

function toggleViewedCurrent() {
  const it = activeItems()[state.sidebarCursor];
  state.viewed[it.key] = !state.viewed[it.key];
  flash(state.viewed[it.key] ? "marked viewed" : "marked not viewed");
  renderAll();
}

function moveSidebar(delta) {
  const n = activeItems().length;
  state.sidebarCursor = Math.max(0, Math.min(n - 1, state.sidebarCursor + delta));
  renderSidebar();
}

function moveContent(delta, extend) {
  const rows = rowsFor(state.active);
  const cur = state.cursors[state.active];
  if (extend && state.selAnchor === null) state.selAnchor = cur;
  if (!extend) state.selAnchor = null;
  state.cursors[state.active] = Math.max(0, Math.min(rows.length - 1, cur + delta));
  setFocused(null);
  renderContent(); renderRail(); renderSidebar();
}

let composer = null;
function startComment() {
  if (state.editing != null) return;
  const [s0, s1] = selRange();
  openComposer(state.active, s0, s1);
}
function openComposer(item, start, end) {
  cancelComposer();
  if (state.railHidden) state.railHidden = false;
  if (state.mode !== "workspace") setMode("workspace");
  renderRail();
  const el = document.createElement("div");
  el.className = "card composer";
  el.dataset.label = "";
  const f = fileItems.find(x => x.id === item);
  const rows = rowsFor(item);
  const first = rows[start];
  const quote = first.block ? first.block.text : (first.line.text || "(blank line)");
  const span = end > start ? " · +" + (end - start) + " more" : "";
  let labelRow = "";
  if (settings.conventionalComments) {
    const labels = LABEL_SETS[settings.labelSet];
    labelRow = '<div class="label-row">' + labels.map(l => '<span class="label-chip" data-label="' + l + '">' + l + "</span>").join("") + "</div>";
  }
  el.innerHTML = '<div class="card-head"><span class="card-type">COMMENT</span><span class="card-badge">DRAFT</span></div>'
    + '<div class="card-quote' + (f.kind === "diff" ? " mono" : "") + '">' + esc(trunc(quote)) + span + "</div>"
    + labelRow
    + '<textarea id="composer-input" rows="3" placeholder="Note for the agent…"></textarea>'
    + '<div class="card-hint"><kbd>⏎</kbd> save · <kbd>esc</kbd> cancel</div>';
  const anchor = $("#content").querySelector('[data-row="' + start + '"]');
  el.style.top = (anchor ? Math.max(4, topInCanvas(anchor) - 2) : 4) + "px";
  railCards.appendChild(el);
  document.body.classList.add("composing");
  composer = { el, item, start, end, label: "" };
  el.querySelectorAll(".label-chip").forEach(chip => chip.addEventListener("click", () => {
    const val = chip.dataset.label;
    composer.label = composer.label === val ? "" : val;
    el.querySelectorAll(".label-chip").forEach(c => c.classList.toggle("on", c.dataset.label === composer.label));
  }));
  const ta = el.querySelector("textarea"); ta.focus();
  ta.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveComposer(); }
    else if (e.key === "Escape") { e.preventDefault(); cancelComposer(); renderRail(); }
  });
}
function saveComposer() {
  if (state.editing != null) { saveEdit(); return; }
  if (!composer) return;
  const text = composer.el.querySelector("textarea").value.trim();
  const { item, start, end, label } = composer;
  cancelComposer();
  if (!text) { flash("Empty note discarded"); renderRail(); return; }
  const a = { id: state.nextId++, item, start, end, text, label: settings.conventionalComments ? label : "" };
  state.annotations.push(a);
  state.undoStack.push({ kind: "comment", id: a.id });
  state.selAnchor = null;
  setFocused(a.id);
  flash("Comment added — pending until submit");
  renderAll();
}
function cancelComposer() {
  if (!composer) return;
  composer.el.remove(); composer = null;
  document.body.classList.remove("composing");
}

function startEdit() {
  const f = fileItems.find(x => x.id === state.active);
  if (f.kind !== "plan") { flash("e edits plan text — press 1 for the plan"); return; }
  cancelComposer();
  state.editing = state.cursors.plan;
  renderContent();
}
function saveEdit() {
  const ta = $("#edit-input");
  if (ta == null || state.editing == null) return;
  const rowIdx = state.editing;
  const block = planRows[rowIdx];
  const text = ta.value.trim();
  const existing = state.edits.find(e => e.rowIdx === rowIdx);
  state.editing = null;
  if (!text || text === block.text) {
    if (existing) state.edits = state.edits.filter(e => e !== existing);
    flash("No change — edit discarded"); renderAll(); return;
  }
  if (existing) { state.undoStack.push({ kind: "edit-update", id: existing.id, prev: existing.newText }); existing.newText = text; }
  else { const e = { id: state.nextId++, rowIdx, oldText: block.text, newText: text }; state.edits.push(e); state.undoStack.push({ kind: "edit", id: e.id }); setFocused("e" + e.id); }
  flash("Edit tracked — pending until submit");
  renderAll();
}
function cancelEdit() { state.editing = null; renderContent(); }

function undo() {
  const op = state.undoStack.pop();
  if (!op) { flash("Nothing to undo"); return; }
  if (op.kind === "comment") { state.annotations = state.annotations.filter(a => a.id !== op.id); flash("Comment removed"); }
  else if (op.kind === "edit") { state.edits = state.edits.filter(e => e.id !== op.id); flash("Edit reverted"); }
  else if (op.kind === "edit-update") { const e = state.edits.find(x => x.id === op.id); if (e) e.newText = op.prev; flash("Edit reverted"); }
  setFocused(null);
  renderAll();
}

function pendingList() {
  const order = fileItems.map(f => f.id);
  const entries = [
    ...state.annotations.map(a => ({ item: a.item, at: a.start, id: a.id })),
    ...state.edits.map(e => ({ item: "plan", at: e.rowIdx, id: "e" + e.id })),
  ];
  return entries.sort((a, b) => order.indexOf(a.item) - order.indexOf(b.item) || a.at - b.at);
}
function jumpPending(dir) {
  const list = pendingList();
  if (!list.length) { flash("No pending annotations yet"); return; }
  if (state.mode !== "workspace") setMode("workspace");
  let idx = list.findIndex(e => e.id === state.focusedId);
  idx = idx < 0 ? (dir > 0 ? 0 : list.length - 1) : (idx + dir + list.length) % list.length;
  const target = list[idx];
  state.active = target.item;
  state.focusZone = "content";
  state.cursors[target.item] = target.at;
  state.selAnchor = null;
  setFocused(target.id);
  if (state.tab === "files") state.sidebarCursor = fileItems.findIndex(f => f.id === target.item);
  renderAll();
  const rowEl = $("#content").querySelector('[data-row="' + target.at + '"]');
  if (rowEl) { rowEl.classList.add("flash"); rowEl.scrollIntoView({ block: "center" }); }
  flash("pending " + (idx + 1) + "/" + list.length);
}

/* ═══════════ Finish panel ═══════════ */

function pendingCount() { return state.annotations.length + state.edits.length; }

function renderFinishButton() {
  const n = pendingCount();
  const btn = $("#finish-btn");
  if (state.submitted) { btn.textContent = "Review sent ✓"; btn.className = "sent"; return; }
  btn.textContent = n ? "Finish review (" + n + ")" : "Finish review";
  btn.className = n ? "has-pending" : "";
}

function renderFinishPanel() {
  const body = $("#finish-body");
  const unviewed = fileItems.filter(f => !state.viewed["file:" + f.id]);
  let html = "";
  if (unviewed.length) {
    html += '<div id="unviewed-warn"><span class="uv-dot"></span>' + unviewed.length + " item" + (unviewed.length > 1 ? "s" : "") + " not viewed · " + unviewed.map(u => esc(u.name)).join(", ") + "</div>";
  }
  html += '<div class="f-label">SUMMARY COMMENT</div><textarea id="parent-comment" placeholder="Overall note to the agent (optional)…">' + (($("#parent-comment") && !state.submitted) ? esc($("#parent-comment").value) : "") + "</textarea>";
  const verdicts = [
    { id: "comment", cls: "", name: "Comment", desc: "Feedback only, no decision", key: "1" },
    { id: "approve", cls: "v-approve", name: "Approve", desc: "Proceed as planned", key: "2" },
    { id: "request", cls: "v-changes", name: "Request changes", desc: "Revise and resubmit", key: "3" },
  ];
  html += '<div class="f-label">VERDICT</div><div class="verdicts">';
  verdicts.forEach(v => {
    html += '<div class="verdict ' + v.cls + (state.verdict === v.id ? " on" : "") + '" data-verdict="' + v.id + '">'
      + '<span class="vdot"></span><span><div class="vname">' + v.name + '</div><div class="vdesc">' + v.desc + "</div></span>"
      + '<span class="vkey"><kbd>' + v.key + "</kbd></span></div>";
  });
  html += "</div>";
  html += '<div class="f-label">PENDING · ' + pendingCount() + "</div>";
  if (!pendingCount()) html += '<div class="fempty">No annotations yet. Press c on any line, or e on plan text.</div>';
  fileItems.forEach(f => {
    const notes = state.annotations.filter(a => a.item === f.id);
    const hasEdits = f.id === "plan" && state.edits.length;
    if (!notes.length && !hasEdits) return;
    html += '<div class="fgroup"><div class="fgroup-head"><span class="cnt">●</span> ' + esc(f.name) + "</div>";
    if (hasEdits) {
      const tot = state.edits.reduce((t, e) => { const s = editStats(e); return { i: t.i + s.ins, d: t.d + s.del }; }, { i: 0, d: 0 });
      html += '<div class="fitem"><div class="fexcerpt">plan text · ' + state.edits.length + " block" + (state.edits.length > 1 ? "s" : "") + " edited</div>"
        + '<div class="fedit"><span class="plus">+' + tot.i + '</span> <span class="minus">−' + tot.d + "</span> words, tracked</div></div>";
    }
    notes.forEach(a => {
      html += '<div class="fitem"><div class="fexcerpt">' + (a.label ? '<span class="flabel">' + esc(a.label) + "</span> " : "") + esc(quoteOf(a)) + '</div><div class="fbody">' + esc(a.text) + "</div></div>";
    });
    html += "</div>";
  });
  body.innerHTML = html;
  $("#finish-sub").textContent = pendingCount() + " pending annotation" + (pendingCount() === 1 ? "" : "s") + " · delivered atomically as " + settings.displayName;
  body.querySelectorAll("[data-verdict]").forEach(el => el.addEventListener("click", () => { state.verdict = el.dataset.verdict; renderFinishPanel(); }));
}

function openPanel() {
  if (state.submitted) return;
  cancelComposer(); if (state.editing != null) saveEdit();
  state.panelOpen = true;
  // context-aware default verdict: approve when there is no pending feedback
  state.verdict = pendingCount() === 0 ? "approve" : (state.verdict === "approve" ? "comment" : state.verdict);
  renderFinishPanel();
  $("#scrim").classList.add("show");
  $("#finish-panel").classList.add("show");
  setTimeout(() => { const pc = $("#parent-comment"); if (pc) pc.focus(); }, 200);
}
function closePanel() { state.panelOpen = false; $("#scrim").classList.remove("show"); $("#finish-panel").classList.remove("show"); }

let autoCloseTimer = null;
function submitReview() {
  const names = { comment: "Comment", approve: "Approve", request: "Request changes" };
  const pc = $("#parent-comment");
  const parent = pc ? pc.value.trim() : "";
  const nc = state.annotations.length, ne = state.edits.length;
  state.submitted = true;
  closePanel();
  const parts = [];
  if (nc) parts.push(nc + " comment" + (nc === 1 ? "" : "s"));
  if (ne) parts.push(ne + " tracked edit" + (ne === 1 ? "" : "s"));
  $("#cc-sub").textContent = (parts.length ? parts.join(" and ") : "No annotations")
    + (parent ? ", with an overall note," : "") + " delivered to agent/worker-3 as " + settings.displayName + " in one atomic reply. Nothing was visible until now.";
  $("#cc-verdict").innerHTML = "verdict · <b>" + names[state.verdict] + "</b>";
  $("#confirm").classList.add("show");
  renderFinishButton();
  renderActionBar();
  clearTimeout(autoCloseTimer);
  if (settings.autoClose !== "off") autoCloseTimer = setTimeout(dismissConfirm, (+settings.autoClose) * 1000);
}
function dismissConfirm() { $("#confirm").classList.remove("show"); }

/* ═══════════ Command palette ═══════════ */

let paletteOpen = false, paletteResults = [], paletteSel = 0;

const commands = [
  { id: "comment", group: "Annotate", ico: "✎", name: "Comment on selection", desc: "Note the current line or span", keys: ["c"], run: () => { closePalette(); startComment(); } },
  { id: "edit", group: "Annotate", ico: "✐", name: "Edit plan text", desc: "Rewrite the current block, tracked", keys: ["e"], run: () => { closePalette(); state.focusZone = "content"; syncFocus(); startEdit(); } },
  { id: "goto", group: "Navigate", ico: "⧉", name: "Go to section", desc: "Jump to the outline", keys: ["t"], run: () => { closePalette(); setTab("outline"); state.focusZone = "sidebar"; syncFocus(); renderAll(); } },
  { id: "next", group: "Navigate", ico: "↓", name: "Next annotation", desc: "Walk pending annotations", keys: ["n"], run: () => { closePalette(); jumpPending(1); } },
  { id: "prev", group: "Navigate", ico: "↑", name: "Previous annotation", desc: "Walk pending annotations", keys: ["p"], run: () => { closePalette(); jumpPending(-1); } },
  { id: "diff", group: "Navigate", ico: "⇄", name: "Switch to diff", desc: "Open the first changed file", keys: ["2"], run: () => { closePalette(); setTab("files"); state.sidebarCursor = 1; openSidebarItem(activeItems()[1]); } },

];

function fuzzy(q, text) {
  q = q.toLowerCase(); const s = text.toLowerCase();
  let ti = 0, qi = 0; const idxs = []; let score = 0, streak = 0;
  while (qi < q.length && ti < s.length) {
    if (q[qi] === s[ti]) { idxs.push(ti); qi++; streak++; score += 1 + streak; }
    else streak = 0;
    ti++;
  }
  if (qi < q.length) return null;
  return { idxs, score: score - s.length * 0.02 };
}
function highlightName(name, idxs) {
  if (!idxs || !idxs.length) return esc(name);
  const set = new Set(idxs);
  let out = "";
  for (let i = 0; i < name.length; i++) out += set.has(i) ? "<b>" + esc(name[i]) + "</b>" : esc(name[i]);
  return out;
}
function keysHTML(keys) { return keys.map(k => "<kbd>" + esc(k) + "</kbd>").join(""); }

function renderPalette(query) {
  const q = (query || "").trim();
  if (!q) {
    paletteResults = commands.map(c => ({ c, idxs: [] }));
  } else {
    paletteResults = commands.map(c => { const m = fuzzy(q, c.name) || fuzzy(q, c.desc || ""); return m ? { c, idxs: fuzzy(q, c.name) ? fuzzy(q, c.name).idxs : [], score: m.score } : null; })
      .filter(Boolean).sort((a, b) => b.score - a.score);
  }
  if (paletteSel >= paletteResults.length) paletteSel = 0;
  const list = $("#palette-list");
  if (!paletteResults.length) { list.innerHTML = '<div class="pal-empty">No commands match “' + esc(q) + "”</div>"; return; }
  let html = "", lastGroup = null;
  paletteResults.forEach((r, i) => {
    if (!q && r.c.group !== lastGroup) { html += '<div class="pal-group">' + esc(r.c.group) + "</div>"; lastGroup = r.c.group; }
    html += '<div class="pal-row' + (i === paletteSel ? " sel" : "") + '" data-i="' + i + '">'
      + '<span class="pal-ico">' + r.c.ico + "</span>"
      + '<span class="pal-name">' + highlightName(r.c.name, r.idxs) + "</span>"
      + (r.c.desc ? '<span class="pal-desc">' + esc(r.c.desc) + "</span>" : "")
      + '<span class="pal-key">' + keysHTML(r.c.keys) + "</span></div>";
  });
  list.innerHTML = html;
  list.querySelectorAll("[data-i]").forEach(el => {
    el.addEventListener("mousemove", () => { paletteSel = +el.dataset.i; markPaletteSel(); });
    el.addEventListener("click", () => { paletteSel = +el.dataset.i; runPaletteSel(); });
  });
}
function markPaletteSel() {
  const list = $("#palette-list");
  list.querySelectorAll(".pal-row").forEach((el, i) => el.classList.toggle("sel", i === paletteSel));
  const sel = list.querySelector(".pal-row.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}
function movePaletteSel(d) {
  if (!paletteResults.length) return;
  paletteSel = (paletteSel + d + paletteResults.length) % paletteResults.length;
  markPaletteSel();
}
function runPaletteSel() {
  const r = paletteResults[paletteSel];
  if (r) r.c.run();
}
function openPalette() {
  if (paletteOpen) return;
  paletteOpen = true; paletteSel = 0;
  $("#palette-wrap").classList.add("show");
  const input = $("#palette-input"); input.value = "";
  renderPalette("");
  setTimeout(() => input.focus(), 20);
}
function closePalette() {
  paletteOpen = false;
  $("#palette-wrap").classList.remove("show");
}

let statusTimer = null;
function flash(msg) {

function renderCheat() {
  const cols = $("#cheat-cols");
  const half = Math.ceil(KEYS.length / 2);
  const colHTML = groups => groups.map(([group, rows]) =>
    '<div class="cheat-group">' + group + "</div>" + rows.map(([label, keys]) =>
      '<div class="cheat-row"><span>' + esc(label) + '</span><span class="keys">' + keys.map(k => "<kbd>" + esc(k) + "</kbd>").join("") + "</span></div>").join("")).join("");
  cols.innerHTML = "<div>" + colHTML(KEYS.slice(0, half)) + "</div><div>" + colHTML(KEYS.slice(half)) + "</div>";
}
function toggleCheat() { $("#cheat").classList.toggle("show"); }

/* ═══════════ Render all ═══════════ */

function renderAll() {
  syncFocus();
  renderSidebar();
  if (state.mode === "guided") renderGuided(); else renderContent();
  renderRail();
  renderFinishButton();
  renderActionBar();
  if (state.panelOpen) renderFinishPanel();
  applyAnchorFocus();
}

/* ═══════════ Keyboard ═══════════ */

document.addEventListener("keydown", e => {
  const meta = e.metaKey || e.ctrlKey;
  const typing = /^(TEXTAREA|INPUT)$/.test(e.target.tagName);

  // command palette scope
  if (paletteOpen) {
    if (e.key === "Escape") { e.preventDefault(); closePalette(); return; }
    if (e.key === "ArrowDown" || (meta && e.key === "n")) { e.preventDefault(); movePaletteSel(1); return; }
    if (e.key === "ArrowUp" || (meta && e.key === "p")) { e.preventDefault(); movePaletteSel(-1); return; }
    if (e.key === "Enter") { e.preventDefault(); runPaletteSel(); return; }
    return; // typing updates input via 'input' listener
  }

  // settings scope
  if (settingsOpen) {
    if (e.key === "Escape" || (meta && e.key === ",")) { e.preventDefault(); closeSettings(); return; }
    return; // let inputs receive other keys; block app shortcuts
  }

  // global surface openers (work even from most contexts)
  if (meta && (e.key === "k" || e.key === "K")) { e.preventDefault(); openPalette(); return; }
  if (meta && e.key === ",") { e.preventDefault(); openSettings(); return; }

  if (state.submitted) {
    if (e.key === "Escape") dismissConfirm();
    return;
  }

  if (!typing && e.key === "/") { e.preventDefault(); openPalette(); return; }

  // textarea scope (composer / editor / parent-comment / card edit)
  if (typing) {
    if (e.key === "Enter" && meta) {
      e.preventDefault();
      if (state.panelOpen && e.target.id === "parent-comment") { submitReview(); return; }
      if (e.target.id === "edit-input") { saveEdit(); return; }
      if (e.target.id === "composer-input") { saveComposer(); return; }
      return;
    }
    if (e.target.id === "edit-input") {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); return; }
      if (e.key === "Escape") { e.preventDefault(); cancelEdit(); return; }
    }
    return;
  }

  // cheat overlay
  if ($("#cheat").classList.contains("show")) {
    if (e.key === "?" || e.key === "Escape") toggleCheat();
    return;
  }
  if (e.key === "?") { e.preventDefault(); toggleCheat(); return; }

  // global finish (context-aware)
  if (e.key === "Enter" && meta) { e.preventDefault(); if (state.panelOpen) submitReview(); else openPanel(); return; }

  // panel scope
  if (state.panelOpen) {
    if (e.key === "Escape") { closePanel(); return; }
    if (e.key === "1") { state.verdict = "comment"; renderFinishPanel(); return; }
    if (e.key === "2") { state.verdict = "approve"; renderFinishPanel(); return; }
    if (e.key === "3") { state.verdict = "request"; renderFinishPanel(); return; }
    return;
  }

  if (e.key === "z" && meta) { e.preventDefault(); undo(); return; }

  if (e.key === "1") { setTab("files"); state.sidebarCursor = 0; openSidebarItem(activeItems()[0]); return; }
  if (e.key === "2") { setTab("files"); state.sidebarCursor = 1; openSidebarItem(activeItems()[1]); return; }

  if (e.key === "t") { setTab(state.tab === "outline" ? "files" : "outline"); return; }
  if (e.key === "a") { if (state.mode === "workspace") { state.railHidden = !state.railHidden; flash(state.railHidden ? "Rail hidden" : "Rail shown"); renderRail(); } else flash("Rail shows in Workspace mode"); return; }
  if (e.key === "v") { toggleViewedCurrent(); return; }
  if (e.key === "c") { e.preventDefault(); startComment(); return; }
  if (e.key === "e") { e.preventDefault(); startEdit(); return; }
  if (e.key === "n") { e.preventDefault(); if (state.mode === "guided") guidedStep(1); else jumpPending(1); return; }
  if (e.key === "p") { e.preventDefault(); if (state.mode === "guided") guidedStep(-1); else jumpPending(-1); return; }

  if (e.key === "Escape") {
    if (composer) { cancelComposer(); renderRail(); return; }
    if (state.selAnchor !== null) { state.selAnchor = null; renderContent(); renderRail(); return; }
    if (state.focusedId) { setFocused(null); renderRail(); applyAnchorFocus(); return; }
    if (state.focusZone === "content") { state.focusZone = "sidebar"; syncFocus(); renderContent(); return; }
    return;
  }

  if (state.mode === "guided") {
    if (e.key === "Enter") { e.preventDefault(); guidedStep(1); return; }
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveContent(1, e.shiftKey); return; }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveContent(-1, e.shiftKey); return; }
    return;
  }

  if (state.focusZone === "sidebar") {
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveSidebar(1); return; }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveSidebar(-1); return; }
    if (e.key === "Enter") { e.preventDefault(); openSidebarItem(activeItems()[state.sidebarCursor]); return; }
    if (e.key === "Tab") { e.preventDefault(); openSidebarItem(activeItems()[state.sidebarCursor]); return; }
    return;
  }

  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveContent(1, false); return; }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveContent(-1, false); return; }
  if (e.key === "J" || (e.shiftKey && e.key === "j")) { e.preventDefault(); moveContent(1, true); return; }
  if (e.key === "K" || (e.shiftKey && e.key === "k")) { e.preventDefault(); moveContent(-1, true); return; }
  if (e.key === "Tab") { e.preventDefault(); moveContent(e.shiftKey ? -1 : 1, false); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    const note = firstNoteOnRow(state.active, state.cursors[state.active]);
    if (note) { setFocused(note.id); renderRail(); applyAnchorFocus(); }
    return;
  }
});

/* ═══════════ Wire up ═══════════ */

$("#theme-btn").addEventListener("click", cycleTheme);
$("#texture-btn").addEventListener("click", () => { settings.textured = !settings.textured; refreshFromSettings(); flash(settings.textured ? "Textured canvas on" : "Textured canvas off"); if (settingsOpen) renderSettingsBody(); });
$("#palette-btn").addEventListener("click", openPalette);
$("#settings-btn").addEventListener("click", openSettings);
$("#finish-btn").addEventListener("click", () => { if (!state.submitted) openPanel(); });
$("#submit-btn").addEventListener("click", submitReview);
$("#scrim").addEventListener("click", closePanel);
$("#confirm").addEventListener("click", e => { if (e.target.id === "confirm") dismissConfirm(); });
$("#cheat").addEventListener("click", e => { if (e.target.id === "cheat") toggleCheat(); });
$("#palette-wrap").addEventListener("click", e => { if (e.target.id === "palette-wrap") closePalette(); });
$("#settings-wrap").addEventListener("click", e => { if (e.target.id === "settings-wrap") closeSettings(); });
$("#palette-input").addEventListener("input", e => { paletteSel = 0; renderPalette(e.target.value); });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
document.querySelectorAll("#mode-seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("#sidebar").addEventListener("mousedown", () => { if (state.focusZone !== "sidebar") { state.focusZone = "sidebar"; syncFocus(); } });
$("#scroller").addEventListener("mousedown", e => { if (e.target.closest("#action-bar")) return; if (state.focusZone !== "content") { state.focusZone = "content"; syncFocus(); } });
window.addEventListener("resize", () => { if (state.mode === "workspace") renderRail(); });

/* ═══════════ Seed & init ═══════════ */

(function seed() {
  const p1Row = blockRowIndex("p-p1");
  state.annotations.push({ id: state.nextId++, item: "plan", start: p1Row, end: p1Row, text: "Do we fsync the directory after the rename? On ext4 the rename itself can still be lost on power failure.", label: "" });
  state.annotations.push({ id: state.nextId++, item: "store", start: 11, end: 11, text: "Bumping revision here is nice, but nothing reads it yet — worth wiring into the recovery summary in Phase 2.", label: "" });
})();

renderCheat();
applyTheme();
document.documentElement.style.setProperty("--grain", settings.grain);
document.documentElement.style.setProperty("--diff-mono", monoStack(settings.monoFont));
updateTextureBtn();
setMode("workspace");
renderAll();
flash("⌘K for commands · ⌘, for settings · j / k to move · c to comment · ? for keys");

})();
</script>
</body>
</html>
