name: Sticky comment
description: Create or update one pull request comment identified by a hidden marker.
inputs:
  marker:
    description: The HTML comment that identifies this comment; the body must contain it.
    required: true
  body-file:
    description: Path to the file holding the comment body.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      with:
        script: |
          const fs = require("node:fs");
          const marker = ${{ toJSON(inputs.marker) }};
          const body = fs.readFileSync(${{ toJSON(inputs.body-file) }}, "utf8");
          if (!body.includes(marker)) throw new Error(`sticky-comment: body is missing the marker ${marker}`);
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((comment) => comment.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
