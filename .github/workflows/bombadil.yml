name: Bombadil terminal tests

on:
  pull_request:
    paths:
      - ".github/workflows/bombadil.yml"
      - "packages/**"
      - "test/bombadil/**"
      - "test/helpers/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    name: Terminal properties
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run terminal campaigns and negative control
        run: bun run test:bombadil --duration 30 --output tmp/bombadil
      - name: Publish run summary
        if: always()
        run: |
          if [ -f tmp/bombadil/summary.md ]; then
            cat tmp/bombadil/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bombadil-terminal-evidence
          path: tmp/bombadil
          if-no-files-found: warn
          retention-days: 7
