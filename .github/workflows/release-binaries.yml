name: release-binaries

# Manual recovery lever: rebuild the binaries and attach them to an existing
# release when its assets are missing or corrupt. The normal path builds them
# in release.yml; this only repairs a release without re-running the publish.
# Each platform compiles on its own runner - the embedded @opentui/core native
# package is platform-specific, so one host cannot cross-compile the set.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (cueloop@<version>)"
        required: true

concurrency:
  group: release-binaries-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # upload assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compile standalone binary
        run: |
          cd packages/cli
          bun run build:binary
          mv dist/cueloop "dist/cueloop-${{ matrix.target }}"
      - name: Smoke-test the binary
        run: packages/cli/dist/cueloop-${{ matrix.target }} --version
      - name: Upload binary to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: packages/cli/dist/cueloop-${{ matrix.target }}

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload checksums.txt to the release
    steps:
      - name: Compute and upload checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p assets && cd assets
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            gh release download "$TAG" --pattern "cueloop-$target" --dir .
          done
          sha256sum cueloop-* > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --clobber
