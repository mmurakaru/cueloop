name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check:release
      - run: bun run check:publish -- --dev
      - run: bun run test

  pty:
    # The PTY tier drives the real TUI in a pseudo terminal through the native
    # pty and Ghostty VT shims, which ship prebuilt for darwin-arm64 only, so
    # this job is pinned to the same Apple silicon runner the release build
    # uses. Serial on purpose: OpenTUI's FFI does not survive bun's parallel
    # test isolation.
    name: PTY tier
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:pty

  install-sh:
    # The curl installer under dash as /bin/sh and GNU coreutils; the macOS
    # test job already covers bash-as-sh and BSD userland.
    name: Installer on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 60000 ./test/install

  bench-pr:
    # Informational: the source-only benchmarks of the merge base and the head,
    # measured interleaved on one runner, as a sticky comment. Never fails on
    # performance; fails only when a benchmark itself crashes. Same-repo pull
    # requests only: a fork's token cannot comment.
    name: Benchmark comment
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check out the merge base beside the head
        id: base
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="$(git merge-base FETCH_HEAD HEAD)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          git worktree add ../base "$base"
          if [ -f ../base/bun.lock ]; then (cd ../base && bun install --frozen-lockfile); fi
      - name: Compare head against the merge base
        run: |
          bun run scripts/benchmarks/pr-compare.ts \
            --base-dir ../base --head-dir . \
            --base-sha "${{ steps.base.outputs.sha }}" --head-sha "${{ github.event.pull_request.head.sha }}" \
            --samples 3 \
            --out dist/bench-pr.json --markdown dist/bench-pr.md
          cat dist/bench-pr.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the sticky comment
        uses: ./.github/actions/sticky-comment
        with:
          marker: "<!-- cueloop-bench -->"
          body-file: dist/bench-pr.md

  bench-main:
    # One history record per push to main, on the bench-history branch (main
    # is protected), plus the daemon leak check, which is the one check here
    # that fails the job. Redeploys the docs site so the trend page updates.
    # Serialized so two quick pushes cannot race on the history branch.
    name: Benchmark history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: bench-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Daemon memory leak check
        run: bun run scripts/benchmarks/daemon-memory-check.ts
      - name: Run the source benchmarks
        run: bun run bench -- --samples 3 --source-only --out dist/bench-main.json
      - name: Append the record to the bench-history branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --no-tags origin bench-history 2>/dev/null; then
            git worktree add ../history FETCH_HEAD
          else
            git worktree add --detach ../history
            git -C ../history switch --orphan bench-history
          fi
          bun run scripts/benchmarks/history.ts --run dist/bench-main.json --history ../history/benchmarks/history/linux-x64.ndjson
          cd ../history
          git add benchmarks/history/linux-x64.ndjson
          git commit -q -m "bench: record ${GITHUB_SHA::7}"
          # the concurrency group serializes pushes, but rebase-and-retry survives a manual push too
          for attempt in 1 2 3; do
            if git push origin HEAD:bench-history; then break; fi
            git fetch --no-tags origin bench-history && git rebase FETCH_HEAD || true
          done
      - name: Redeploy the docs site with the new record
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main

  native:
    name: Native shim
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect native changes
        id: native-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            packages/client/native \
            packages/client/src/ghostty-terminal.test.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v6
        if: steps.native-changes.outputs.changed == 'true'
        with:
          path: |
            ${{ runner.temp }}/cueloop-libghostty-build/ghostty
            ${{ runner.temp }}/cueloop-libghostty-build/zig-*.tar.xz
            ${{ runner.temp }}/cueloop-libghostty-build/zig-gcache
            ${{ runner.temp }}/cueloop-libghostty-build/zig-lcache
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/client/native/build.sh') }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: oven-sh/setup-bun@v2
        if: steps.native-changes.outputs.changed == 'true'
        with:
          bun-version: 1.3.14
      - name: Build native terminal shim
        if: steps.native-changes.outputs.changed == 'true'
        run: sh packages/client/native/build.sh
      - name: Test native terminal ABI
        if: steps.native-changes.outputs.changed == 'true'
        run: bun test packages/client/src/ghostty-terminal.test.ts

  changeset:
    # Every PR ships a changeset (empty is fine for docs/CI-only changes:
    # `bunx changeset --empty`). Release PRs are exempt.
    name: Changeset present
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}
