name: Bootstrap first npm publish

# New npm packages cannot use trusted publishing until their first version exists.
# The repository token can publish the first version after an explicit dispatch.
# A maintainer grants release.yml trusted-publisher access for later versions.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the prepared first version with the repository token"
        required: true
        default: false
        type: boolean
      package_name:
        description: "Publishable workspace package name, for example @cueloop/pi"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag for the first version"
        required: true
        default: alpha
        type: string

concurrency:
  group: npm-bootstrap-${{ inputs.package_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Pack first npm version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - run: bun run check:publish
      - name: Select unpublished workspace package
        id: package
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "First npm publishes must use main" >&2
            exit 1
          fi
          if ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9._-]*$ ]]; then
            echo "Invalid npm dist-tag: $DIST_TAG" >&2
            exit 1
          fi
          package_dir=""
          for manifest in packages/*/package.json packages/integrations/*/package.json; do
            [ -f "$manifest" ] || continue
            name=$(jq -r 'if .private then empty else .name end' "$manifest")
            if [ "$name" = "$PACKAGE_NAME" ]; then
              package_dir="${manifest%/package.json}"
              break
            fi
          done
          if [ -z "$package_dir" ]; then
            echo "No publishable workspace package named $PACKAGE_NAME" >&2
            exit 1
          fi
          set +e
          lookup=$(npm view "$PACKAGE_NAME" version --prefer-online 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$PACKAGE_NAME already exists on npm: $lookup" >&2
            exit 1
          fi
          if ! printf '%s' "$lookup" | grep -q 'E404'; then
            echo "Could not confirm $PACKAGE_NAME is absent from npm: $lookup" >&2
            exit 1
          fi
          echo "directory=$package_dir" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version "$package_dir/package.json")" >> "$GITHUB_OUTPUT"
      - name: Pack first version
        id: pack
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.directory }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap
          tarball=$(cd "$PACKAGE_DIR" && npm pack --silent --pack-destination "$GITHUB_WORKSPACE/bootstrap")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-first-publish-${{ github.run_id }}
          path: bootstrap/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
      - name: Publish first version with repository token
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "First publication requires the repository NPM_TOKEN secret" >&2
            exit 1
          fi
          for changeset in .changeset/*.md; do
            [ -f "$changeset" ] || continue
            [ "$(basename "$changeset")" != README.md ] || continue
            echo "Version pending changesets through the release PR before publishing" >&2
            exit 1
          done
          npm publish "./bootstrap/$TARBALL" --access public --tag "$DIST_TAG" --ignore-scripts
      - name: Verify first publication
        if: ${{ inputs.publish }}
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          expected=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; console.log("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"))' "./bootstrap/$TARBALL")
          for attempt in {1..15}; do
            actual=$(npm view "$PACKAGE_NAME@$VERSION" dist.integrity --prefer-online 2>/dev/null || true)
            if [ "$actual" = "$expected" ]; then
              exit 0
            fi
            if [ -n "$actual" ]; then
              echo "Published tarball integrity does not match the prepared artifact" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Published tarball was not visible before the verification deadline" >&2
          exit 1
      - name: Show maintainer commands
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          {
            echo "Prepared $PACKAGE_NAME@$VERSION from $GITHUB_SHA."
            echo
            echo 'If publication was disabled, download the artifact and publish it with npm.'
            echo 'Configure the trusted publisher from an authenticated owner session:'
            echo '```bash'
            printf 'npm publish ./%s --access public --tag %s\n' "$TARBALL" "$DIST_TAG"
            printf 'npm trust github %s --repo mmurakaru/cueloop --file release.yml --allow-publish\n' "$PACKAGE_NAME"
            echo '```'
            echo 'The normal release workflow handles later versions with OIDC.'
          } >> "$GITHUB_STEP_SUMMARY"
