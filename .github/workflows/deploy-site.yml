name: Deploy site

# Deploys the Astro site in site/ to Cloudflare Pages (project cueloop-site).
# - push to main (site/ changed) -> production (www.cueloop.dev)
# - PR labelled "deploy-preview" -> a preview deployment, URL posted on the PR
# - workflow_dispatch -> manual production deploy
#
# Requires the repo secret CLOUDFLARE_API_TOKEN (Cloudflare -> My Profile ->
# API Tokens -> "Edit Cloudflare Pages" for account 7a31fcb2...). The account
# id is public, so it is inlined below.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-site-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # Production on main / manual; preview only when the PR carries the label.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Fetch the benchmark history for the trend page
        run: |
          mkdir -p site/src/data
          if git fetch --depth 1 origin bench-history 2>/dev/null; then
            git show origin/bench-history:benchmarks/history/linux-x64.ndjson > site/src/data/bench-history.ndjson
          else
            : > site/src/data/bench-history.ndjson
          fi
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: site
        run: bun run build
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7a31fcb24b660fc77f69222e21459965
          workingDirectory: site
          # branch=main is the production alias; any other branch is a preview.
          # workflow_dispatch always targets production regardless of the ref.
          command: pages deploy dist --project-name=cueloop-site --branch=${{ github.event_name == 'workflow_dispatch' && 'main' || github.head_ref || github.ref_name }}
      - name: Write the preview comment body
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p dist
          {
            printf '%s\n' '<!-- cueloop-site-preview -->'
            printf '**Site preview deployed** -> %s\n\n' "${{ steps.deploy.outputs.deployment-url }}"
            printf 'From `%s`.\n' "${GITHUB_SHA::7}"
          } > dist/site-preview.md
        working-directory: site
      - name: Post or update the preview comment
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/sticky-comment
        with:
          marker: "<!-- cueloop-site-preview -->"
          body-file: site/dist/site-preview.md
