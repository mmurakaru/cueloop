name: release

# Changesets-driven release (alpha prerelease mode). On every push to main
# this either opens/updates the "Release Packages" PR (collecting pending
# changesets into version bumps + changelogs + the plugin.json sync) or, when
# that PR merges, publishes the workspace to npm under the `alpha` dist-tag.
#
# Secrets required:
#   NPM_TOKEN      granular automation token for the cueloop + @cueloop packages
#   RELEASE_TOKEN  (optional) a PAT - merges made with the default GITHUB_TOKEN
#                  do not trigger workflows (anti-recursion), so without a PAT
#                  the publish run after merging the Release PR must be started
#                  manually via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Version / publish
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # fresh install in the publish lane - tarball contents never come from a cache
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./packages ./test
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run ci:publish
          commit: "Release: version packages"
          title: "Release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
