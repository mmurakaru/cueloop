name: release

# Changesets-driven release (alpha prerelease mode). On every push to main this
# either opens/updates the "Release Packages" PR (collecting pending changesets
# into version bumps + changelogs + the plugin.json sync) or, when that PR
# merges, publishes the workspace to npm under the `alpha` dist-tag.
#
# AUTH is split by operation:
#   - PUBLISH goes through trusted publishing (OIDC) - no token, provenance
#     attached. Configured per package on npmjs.com → Settings → Publishing
#     access → Trusted publisher: repo mmurakaru/cueloop, workflow release.yml.
#     (A package's FIRST publish predates that config, so do the first one with a
#     token, then it is OIDC forever.)
#   - DIST-TAGS (`npm dist-tag add` in the sync step) are NOT covered by OIDC, so
#     they keep a scoped NPM_TOKEN repo secret: a granular token with write on
#     `cueloop` + `@cueloop/*`, set an expiry and rotate. It is wired ONLY into
#     the sync step below, so publishing stays token-free.
#
# See docs/releasing.md for the full checklist.
#
# RELEASE_TOKEN (optional PAT): merges made with the default GITHUB_TOKEN do not
# trigger workflows (GitHub's anti-recursion rule), so without it the publish
# run after merging the Release PR must be started via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Version / publish
    runs-on: macos-latest
    permissions:
      contents: write # create the Release PR + push tags
      pull-requests: write # open/update the Release PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets/action needs push credentials for the Release PR branch.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # changeset publish shells out to the npm CLI, and trusted publishing
      # requires npm >= 11.5.1 on Node >= 22.14 - neither is the runner default.
      # Node 24: current npm releases require ^22.22 || ^24.15 || >=26, so the
      # bare 22.14 floor cannot install them.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      # fresh install in the publish lane - tarball contents never come from a cache
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./packages ./test
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run ci:publish
          commit: "Release: version packages"
          title: "Release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN here on purpose: publishing goes through trusted
          # publishing (OIDC), which needs no token and attaches provenance. (A
          # brand-new package's FIRST publish predates its trusted-publisher
          # config - do that one manually with a token, then it is OIDC forever.)
          NPM_CONFIG_PROVENANCE: "true"
      # changesets in pre mode publishes to `latest`, so the prerelease tag must
      # be pointed at this version. `npm dist-tag add` is NOT covered by OIDC, so
      # this one step needs a scoped NPM_TOKEN (write on cueloop + @cueloop/*).
      # Publishing above stays token-free.
      - name: Sync prerelease dist-tags
        if: steps.changesets.outputs.published == 'true'
        run: bun run scripts/sync-dist-tags.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Success is what a stranger can install. A publish tool reporting success
      # for a package that never reached the registry must fail the run.
      - name: Verify the published release
        if: steps.changesets.outputs.published == 'true'
        run: bun run verify:published
