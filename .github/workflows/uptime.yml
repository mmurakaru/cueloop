name: uptime

# Account-free external liveness for the gateway + docs site (ADR 0007, Layer 1
# stopgap). Runs on GitHub's infra, so it still reports when the box is down.
# Cruder than a purpose-built monitor (cron can lag ~5-15m, no status page); if
# you want tighter intervals + a status page, add UptimeRobot per the runbook and
# retire this. On failure it opens one deduplicated issue (label: uptime-alert).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the gateway (:22) and the docs site (www)
        run: |
          fail=0
          if ! timeout 10 bash -c '</dev/tcp/cueloop.dev/22' 2>/dev/null; then
            echo "::error::gateway cueloop.dev:22 (SSH) is unreachable"
            fail=1
          fi
          if ! curl -fsS --max-time 15 https://www.cueloop.dev >/dev/null; then
            echo "::error::https://www.cueloop.dev is unreachable"
            fail=1
          fi
          exit $fail

      - name: Open a deduplicated alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create uptime-alert --color B60205 --description "Automated uptime probe failure" 2>/dev/null || true
          open=$(gh issue list --label uptime-alert --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --label uptime-alert \
              --title "Uptime alert: cueloop.dev probe failed" \
              --body "The scheduled uptime probe failed. Check the gateway (\`:22\`) and \`https://www.cueloop.dev\`.\n\nRun: $RUN_URL\n\nAuto-filed; close this once service is restored (it dedupes while open)."
          fi
